version: "0.2"
decisions:
  - id: DEC-001
    title: 采用 28 周主线加逐月滚动细化
    category: process
    status: active
    authority: B
    user_approval: approved
    related_tasks:
      - TASK-001
    related_business_logic: []
    context: 学习者每天可投入 1.5 小时，需要系统补齐通用 AI 到机器人学习的能力，并可能在两台设备间切换。
    hypothesis: 稳定总路线配合逐月作业比一次性生成约 150 天静态任务更可执行。
    options:
      - name: 28 周总路线加逐月滚动细化
        benefits:
          - 长期方向稳定
          - 可根据阶段验收调整任务难度
          - 适应双设备和实际进度
        costs:
          - 每月需要一次计划更新
        risks:
          - 需要持续维护学习状态
      - name: 一次性生成全部每日任务
        benefits:
          - 初始日程完整
        costs:
          - 后期任务容易与实际掌握程度不匹配
        risks:
          - 形成大量失真的静态计划
    decision: 采用 28 周总路线，先细化首月 24 个学习日，之后依据验收滚动展开。
    reason_summary:
      - 用户选择完整路线、每日作业和持续带学。
      - 学习路线跨度大，必须根据真实学习证据调整。
      - 8GB 与 24GB 显存设备需要分层安排实验。
    conditions:
      - 日常必做任务以 RTX 4060 8GB 为资源上限。
      - 4090 实验不得成为进入下一阶段的唯一条件。
    action: 写入总路线、首月作业、资料索引、验收标准和记录模板。
    expected_result: 学习者可以从第一个学习日开始直接执行，并能跨设备延续。
    reversal_plan: 若实际投入显著变化，保留能力依赖和验收，重新压缩或扩展周数。
    observation: null
    actual_result: null
    outcome_status: not-observed
    lesson: null
    evidence:
      - 学习路线/机器人学习系统路线/
    supersedes: []
    created_at: "2026-07-31"
    updated_at: "2026-07-31"
  - id: DEC-002
    title: 补录 Day 1-4 真实执行证据并继续 Day 5
    category: process
    status: active
    authority: B
    user_approval: approved
    related_tasks:
      - TASK-002
      - TASK-003
    related_business_logic: []
    context: 7/31 已存在 Day 1-4 练习，但项目日志仍停留在 Day 1 起点；用户确认继续推进。
    hypothesis: 补齐复核结果并登记执行证据后，学习路线可以从当前真实进度继续。
    options:
      - name: 补录真实执行证据并继续 Day 5
        benefits:
          - 不伪造缺失日期记录
          - 保持路线从实际掌握处继续
        costs:
          - 需要本人补齐 Day 5 以上的个人理解与错误记录
        risks:
          - 中间缺失日期留下进度缺口
      - name: 退回 Day 1 重新执行
        benefits:
          - 学习链连续
        costs:
          - 重复已完成且可复核的练习
        risks:
          - 降低执行动力并浪费已有证据
    decision: 补录 Day 1-4 已完成的真实证据，不伪造 8/1-8/11 记录，从 Day 5 继续。
    reason_summary:
      - 用户确认继续。
      - 学习代码可以复跑，实验结果可以补记。
      - 缺失日期没有真实学习行为，不能凭空补写。
    conditions:
      - 未发生的学习不生成伪造记录。
      - 后续按实际学习日期逐日记录。
    action: 更新学习记录、任务列表、执行证据和当前会话。
    expected_result: 项目日志反映 Day 1-4 已验证、Day 5 待本人完成。
    reversal_plan: 若用户认为应从 Day 1 重学，可暂停 Day 5 并重新调整任务。
    observation: null
    actual_result: null
    outcome_status: not-observed
    lesson: null
    evidence:
      - EV-004
      - EV-005
    supersedes: []
    created_at: "2026-08-12"
    updated_at: "2026-08-12"

  - id: DEC-003
    title: 采用机器人控制与具身智能算法复合简历主线
    category: product
    status: active
    authority: C
    user_approval: approved
    related_tasks:
      - TASK-005
    related_business_logic: []
    context: 当前候选稿同时覆盖机器人控制、具身智能算法和机器人系统工程，需要确定主投递方向以控制项目排序与篇幅。
    hypothesis: 以机器人控制与具身智能算法复合方向为主线，最能同时利用真实机器人闭环、模型训练评估和数据工程证据。
    options:
      - name: 机器人控制与具身智能算法复合方向
        benefits:
          - 同时覆盖真实机器人控制闭环和具身模型能力
          - 切豆腐、炒菜机器人、GR00T、数据平台形成递进主线
          - 可自然衍生机器人控制版和具身算法版备选简历
        costs:
          - 需要控制平台工程和应用开发内容的篇幅
        risks:
          - 若目标岗位极度偏单一算法或纯控制，需后续做定向压缩
      - name: 纯机器人控制方向
        benefits:
          - 强化 ROS2、标定、IK、轨迹和真机联调
        costs:
          - GR00T 和数据闭环价值被压缩
        risks:
          - 具身智能岗位匹配度下降
      - name: 纯具身智能算法方向
        benefits:
          - 强化 GR00T、LeRobot、数据和策略评估
        costs:
          - 真实机器人系统能力展示不足
        risks:
          - 可能弱化独立控制闭环证据
    decision: 采用机器人控制与具身智能算法复合方向作为主投递主线，纯机器人控制、纯具身智能算法和机器人系统工程作为后续备选版本。
    reason_summary:
      - 用户明确同意推荐方向。
      - 该主线覆盖当前最强的真实机器人、模型训练和数据工程证据。
    conditions:
      - 所有项目表达必须保留个人贡献边界，不把团队探索包装为独立交付。
      - 备选版本从同一事实基线派生，不重复建立互相冲突的项目事实。
    action: 以复合方向确定主项目排序，并按岗位需要派生备选版本。
    expected_result: 先形成复合方向正式投递版，再可低成本压缩出控制、算法和系统工程版本。
    reversal_plan: 若实际投递反馈显示岗位匹配不足，保留事实基线并调整项目顺序、技能权重和摘要。
    observation: null
    actual_result: null
    outcome_status: not-observed
    lesson: null
    evidence:
      - 个人简历/简历专业美化版-第三阶段候选稿.md
      - 个人简历/项目经历精华材料索引-第一阶段.md
    supersedes: []
    created_at: "2026-08-17"
    updated_at: "2026-08-17"
