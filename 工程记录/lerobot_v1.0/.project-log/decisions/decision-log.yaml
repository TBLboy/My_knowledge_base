version: '0.2'
decisions:
- id: DEC-001
  title: 后续 LeRobot 开发使用 Miniforge lerobot 环境并采用 editable 源码安装
  category: tooling
  status: active
  authority: A
  user_approval: approved
  related_tasks:
  - TASK-002
  related_business_logic: []
  context: 用户明确要求清除旧版 LeRobot，并在当前 lerobot-v1.0 仓库上继续开发。
  hypothesis: 复用已有 Python 3.12/CUDA Miniforge 环境并安装当前源码，可避免重复下载大型 CUDA 依赖，同时保证修改立即生效。
  options:
  - name: 复用 Miniforge lerobot 环境并 editable 安装当前仓库
    benefits:
    - 复用已有 CUDA/PyTorch 环境
    - 源码修改立即生效
    - 避免创建重复 uv .venv
    costs:
    - 环境可能保留历史无关依赖
    risks:
    - 历史依赖冲突需要单独识别
  - name: 重新创建 uv 项目环境
    benefits:
    - 隔离性和锁文件复现性更强
    costs:
    - 需要重新下载大型 PyTorch/CUDA 依赖
    risks:
    - 硬件相关依赖和已有 CUDA 配置可能需要重新验证
  decision: 选择复用 /home/tbl/miniforge3/envs/lerobot，并将当前仓库以 editable 模式安装。
  reason_summary:
  - 用户已明确选择该环境作为后续开发环境。
  - 现有环境已具备 Python 3.12.13、Torch 2.10.0 和 CUDA 12.8。
  conditions:
  - 不删除整个 Conda 环境
  - 若发现依赖冲突，记录并单独处理，不静默修改产品源码
  action: 卸载 lerobot 0.5.1；执行 pip install -e '.[dev,test,wallx]'。
  expected_result: lerobot 版本为 0.6.1，导入路径指向当前仓库，CLI 可以加载。
  reversal_plan: 可在该环境中重新安装原版 PyPI lerobot，或重建 Miniforge 环境。
  observation: 安装完成；首次 CLI smoke 暴露 transformers 5.3.0 不兼容，补齐 wallx 约束后 transformers 升级至 5.5.4。
  actual_result: 当前源码 0.6.1 editable 安装成功，CLI smoke 和配置测试通过。
  outcome_status: successful
  lesson: 复用旧环境前必须检查可选依赖版本；当前仓库的 wallx 导入要求 transformers 5.4+。
  evidence:
  - EV-005
  - EV-006
  created_at: '2026-07-27T10:41:43+08:00'
  updated_at: '2026-07-27T10:41:43+08:00'
- id: DEC-002
  title: CodeGraph 作为 Codex 工具运行，不安装进 LeRobot Python 环境
  category: tooling
  status: active
  authority: B
  user_approval: approved
  related_tasks:
  - TASK-005
  related_business_logic: []
  context: LeRobot 开发需要代码结构和调用关系导航，但 CodeGraph 属于开发工具，不是 LeRobot 运行时依赖。
  hypothesis: 将 CodeGraph 安装在用户工具目录并通过 Codex MCP 使用，可避免污染 /home/tbl/miniforge3/envs/lerobot。
  options:
  - name: 安装进 lerobot 环境
    benefits:
    - 调用路径近
    costs:
    - 增加应用环境依赖
    risks:
    - 破坏环境隔离
  - name: 安装为 Codex MCP（选择）
    benefits:
    - 与应用环境解耦
    - 多个项目可复用
    costs:
    - 需要重启 ACP 才能加载
    risks:
    - MCP server 与 Codex 配置需要维护
  decision: 采用 Codex 全局 MCP 配置，CodeGraph 不安装进 LeRobot conda 环境。
  reason_summary:
  - 保持 LeRobot 运行环境干净
  - CodeGraph 面向工程导航而非产品运行时
  - Codex/Zed ACP 可跨项目复用
  conditions:
  - CodeGraph 索引目录保持项目本地并加入 .gitignore。
  action: 保留 /home/tbl/.local/bin/codegraph，配置 /home/tbl/.codex MCP，并在 LeRobot 根忽略 .codegraph/。
  expected_result: CodeGraph 可查询 LeRobot 且不改变 lerobot 环境依赖。
  reversal_plan: 执行 codex mcp remove codegraph 并删除本地索引。
  observation: 索引和 MCP 配置验证通过。
  actual_result: 804 files、17,512 nodes、46,134 edges，状态 up to date；lerobot 环境未新增 CodeGraph 依赖。
  outcome_status: successful
  lesson: 开发辅助工具应与产品运行时环境分层。
  evidence:
  - EV-009
  supersedes: []
  created_at: '2026-07-27T11:48:34+08:00'
  updated_at: '2026-07-27T11:48:34+08:00'
- id: DEC-003
  title: raw GR00T checkpoint 通过 base_model_path 进入 LeRobot 微调
  category: architecture
  status: active
  authority: A
  user_approval: approved
  related_tasks:
  - TASK-012
  related_business_logic: []
  context: 独立 checkpoint-30000 是原生 Isaac-GR00T 分片 checkpoint，config.json 不包含 LeRobot policy 所需的 type 字段。
  hypothesis: 将 checkpoint-30000 作为 GrootConfig.base_model_path，可以由 GR00T 原生 from_pretrained 加载分片权重，同时保持 LeRobot lerobot-train 作为训练循环；直接使用 --policy.path 会走 LeRobot config 解析并失败。
  options:
  - name: 使用 --policy.path 加载
    benefits:
    - 语义上接近 LeRobot 原生 checkpoint
    costs:
    - 当前 raw checkpoint 缺少 LeRobot type/config 结构
    risks:
    - 无法通过 PreTrainedConfig.from_pretrained 解析
  - name: 使用 --policy.base_model_path 加载 raw checkpoint（选择）
    benefits:
    - 复用 GR00T 原生分片权重加载器
    - 不修改原始 checkpoint
    - 训练循环仍统一使用 lerobot-train
    costs:
    - 不恢复独立训练器的 optimizer/scheduler/RNG/step 状态
    risks:
    - 需要把独立训练器状态另行适配到 LeRobot resume 格式
  decision: "使用 --policy.base_model_path=/mnt/data/.../checkpoint-30000，以 checkpoint 权重初始化一个新的 LeRobot 微调运行。"
  action: 修改 examples/groot/finetune_right_o6_13d_lerobot.sh 的 INITIAL_CHECKPOINT_PATH，并运行最小 CUDA forward smoke。
  expected_result: checkpoint-30000 可由 GrootPolicy(config) 加载，真实 v3 数据的 forward loss 为 finite，且正式训练不启动。
  reason_summary:
  - checkpoint config.json 没有 LeRobot `type` 字段。
  - GrootPolicy(config) 真实 CUDA forward 已通过。
  conditions:
  - 不修改原始 checkpoint
  - 正式训练由用户手动启动
  reversal_plan: 将 INITIAL_CHECKPOINT_PATH 改回基础模型目录即可从基础 GR00T 重新开始。
  observation: checkpoint 分片权重加载成功；唯一提示是 checkpoint 缺失未使用的 backbone.model.lm_head.weight；loss=0.04111609607934952 且 finite。
  actual_result: 训练模板已切换并完成最小运行时验证。
  outcome_status: successful
  lesson: “从 checkpoint 权重初始化”与“恢复训练器完整状态”是两个不同能力；raw GR00T checkpoint 适合前者，后者需要额外格式适配。
  evidence:
  - EV-022
  - EV-023
  supersedes: []
  created_at: '2026-07-27T18:45:00+08:00'
  updated_at: '2026-07-27T18:45:00+08:00'
- id: DEC-004
  title: 本地微调默认关闭 Hugging Face Hub 推送
  category: process
  status: active
  authority: A
  user_approval: approved
  related_tasks:
  - TASK-013
  related_business_logic: []
  context: LeRobot PreTrainedConfig 默认 push_to_hub=true；本次训练输出到本地，用户没有提供 Hugging Face policy.repo_id。
  hypothesis: 显式传入 policy.push_to_hub=false 可以让本地训练不要求 repo_id，同时保留本地 checkpoint 保存。
  options:
  - name: 设置 policy.repo_id 并上传 Hub
    benefits:
    - 可自动上传模型和 checkpoint
    costs:
    - 需要 Hub 登录、仓库命名和网络
    risks:
    - 可能产生公开/私有仓库和数据上传影响
  - name: 本地训练关闭 push_to_hub（选择）
    benefits:
    - 不需要 repo_id 或 Hub 凭证
    - 保持训练和 checkpoint 全部落地本机
    costs:
    - 不自动同步 Hub
    risks:
    - 需要用户自行备份输出目录
  decision: "在 GR00T 本地微调模板中加入 --policy.push_to_hub=false。"
  action: 修改 examples/groot/finetune_right_o6_13d_lerobot.sh，并运行完整 steps=0 初始化 smoke。
  expected_result: cfg.validate、dataset、policy、optimizer、scheduler 初始化通过，0 step 正常结束。
  reason_summary:
  - 用户当前要求本地训练，不要求上传 Hub。
  - 失败信息明确来自 push_to_hub=true 且 policy.repo_id 缺失。
  conditions:
  - 如需 Hub 上传，用户必须提供 policy.repo_id 并启用 push_to_hub。
  reversal_plan: 删除该参数或改为 --policy.push_to_hub=true，并增加 --policy.repo_id=<hub-repo-id>。
  observation: 加入参数后完整入口通过 cfg.validate，checkpoint-30000 加载、optimizer/scheduler 创建和 0 step 结束均成功。
  actual_result: 本地训练配置已修复。
  outcome_status: successful
  lesson: dry-run 只能验证命令拼接，不能覆盖 TrainPipelineConfig.validate；正式启动前应执行 steps=0 的完整初始化 smoke。
  evidence:
  - EV-024
  supersedes: []
  created_at: '2026-07-27T18:51:00+08:00'
  updated_at: '2026-07-27T18:51:00+08:00'
