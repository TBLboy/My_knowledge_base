  observation: 旧版卸载成功；当前源码 editable 安装成功；首次 CLI 因 transformers 5.3.0 失败，补齐依赖后 transformers 5.5.4，CLI 通过；配置测试 5 passed。
  actual_result: Miniforge lerobot 环境已切换到当前仓库 0.6.1。pip check 仍有无关 ROS/机器人包缺少 typeguard，长组合测试未完整跑完。
