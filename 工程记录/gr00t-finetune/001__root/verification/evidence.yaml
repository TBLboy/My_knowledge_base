  - id: verification-011
    task: task-005
    status: partial-failed
    subject: "20,000-step GR00T checkpoint 的 open-loop 策略质量诊断"
    commands:
      - "HF_HUB_OFFLINE=1 CUDA_VISIBLE_DEVICES=0 python gr00t/eval/open_loop_eval.py --dataset-path .../lerobot_dataset_right_o6_13d --embodiment-tag NEW_EMBODIMENT --model-path .../checkpoint-20000 --traj-ids 0 --execution-horizon 16 --steps 400 --modality-keys right_arm right_o6_hand"
      - "checkpoint-16000/18000/19000/20000：同一 trajectory 0、100-step、horizon=16 对照"
      - "python .project-log/eval_action_diagnostics.py .../checkpoint-20000"
    results:
      - "checkpoint-20000 可加载；400-step eval: unnormalized total MSE=717.3781，MAE=12.3097。"
      - "100-step checkpoint 对照（diffusion sampling 存在随机性）：16k MSE/MAE=754.53/13.66；18k=642.40/12.21；19k=723.99/12.83；20k=691.24/12.70。不存在随训练后段单调恶化的证据，18k 反而是本次最佳。"
      - "20k 的逐维复测：总 MSE/MAE=622.80/11.56；右臂 MSE/MAE=0.1279/0.2731；O6 手 MSE/MAE=1349.25/24.74。"
      - "同一轨迹的当前状态（不动作）基线显著更好：总 MSE/MAE=82.91/3.51；右臂=0.00011/0.00605；O6 手=179.63/7.61。模型没有学到该数据中强烈的 action≈current-state 时间连续性。"
      - "O6 0..100 数值范围主导非归一化总误差；按全数据 stats 估算，手部维度贡献约 99.99% 的全局动作均值 MSE。因此总 MSE 不能用于和仅含弧度关节的数据集横向比较，但与同数据的当前状态基线比较有效。"
    artifacts:
      - "outputs/gr00t_n1_right_o6_13d_full_20k/open_loop_eval_ckpt20000.png"
      - ".project-log/logs/checkpoint-comparison-open-loop.log"
      - ".project-log/logs/per-dimension-eval-ckpt20000.log"
      - ".project-log/eval_action_diagnostics.py"
    conclusion: "训练产物技术上有效（可加载、可推理），但未达到数据内 open-loop 行为质量；当前不能执行真机闭环。cosine 学习率末段衰减可能限制后续改善，却不是此失败的充分或已证实根因。"
    limitations:
      - "checkpoint 只保留 16k 之后的五个版本，无法比较 1k/5k/10k；未运行基础模型对照。"
      - "评估只覆盖 trajectory 0，且扩散采样未固定随机种子；100-step 指标含采样噪声。"
      - "尚未实施单 episode overfit，因此尚不能区分训练/评估管线错误与完整数据训练超参数不足。"
  - id: verification-012
    task: task-007
    status: partial-failed
    subject: "单 episode 多训练暴露量与去噪步数对照"
    commands:
      - "conda run -n gr00t_n1 python .project-log/diagnose_action_alignment.py"
      - "python .project-log/create_single_episode_subset.py && python gr00t/data/stats.py ...overfit_ep0"
      - "300-step 训练：base model + episode 0（462 valid action anchors）+ batch=1 + shard_size=64 + sampling_rate=0.1"
      - "2,000-step 训练：相同设置，checkpoint at 1,000 and 2,000"
      - "python .project-log/eval_action_diagnostics.py <checkpoint> <ep0 dataset> <denoising steps>"
    results:
      - "数据对齐：全量同帧 action-state MAE=2.334（右臂=0.0222 rad，O6=5.032），下一帧 MAE=2.565（右臂=0.0269 rad，O6=5.527）。同帧更接近，未发现整体 action/state 错一帧证据。"
      - "300-step（约 0.65 个等效 episode pass）训练完成；checkpoint-100/200/300 的 episode-0 action MSE 约 1251/1300/1278，均差于 current-state baseline MSE=82.91。"
      - "checkpoint-300 在 4、8、16 个 diffusion denoising steps 下的 MSE 分别约 1341、1371、1273；增加推理去噪步未解决问题。"
      - "2,000-step run 实际完成全部 optimizer steps（日志到 step 2000，末段 train loss 约 0.99–1.14）；checkpoint-1000 成功加载评估，MSE=682.67、MAE=12.64，显著优于 300-step 但仍远差于 state baseline MSE=82.91。"
      - "checkpoint-2000 权重与 optimizer 文件写入完成，但训练在最终模型重复保存时因根分区仅剩约 1.7GB 出现 PyTorchStreamWriter file-write error；processor 元数据未完整写入，无法作为可加载 eval checkpoint。"
    conclusion: "训练暴露量是确认的主导问题：20k batch-1 对约45,030个有效全量动作锚点仅相当于0.44个数据 pass；单 episode从0.65 pass增加到约4.3 pass后，MSE从约1,278改善到682，证明模型确实在学习，而非单纯推理去噪不足或整体时序错位。但4.3 pass仍未超过强 current-state baseline，因此不能宣称已验证完整管线无误；也不能用当前训练量判断模型能力上限。"
    artifacts:
      - ".project-log/diagnose_action_alignment.py"
      - ".project-log/create_single_episode_subset.py"
      - ".project-log/eval_action_diagnostics.py"
      - ".project-log/logs/overfit-ep0-sharded-300.log"
      - ".project-log/logs/overfit-ep0-eval.log"
      - ".project-log/logs/overfit-ep0-2k.log"
      - ".project-log/logs/overfit-ep0-2k-eval.log"
    limitations:
      - "扩散采样未在评估脚本中固定 generator；单次数值存在采样方差。"
      - "2k checkpoint 的 processor 不完整，无法评估其最终点；checkpoint-1000 是多 epoch 对照的最后可加载证据。"
      - "单 episode 只验证记忆能力，不说明148 episode的泛化。"
  - id: verification-013
    task: task-009
    status: passed
    subject: "30,000-step 重训（constant LR, batch=8, ~5.3 passes）在多条验证轨迹上的 open-loop 动作质量"
    commands:
