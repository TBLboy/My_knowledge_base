         --dataset-path /mnt/data/gr00t-finetune/datasets/lerobot_dataset_right_o6_13d
         --embodiment-tag NEW_EMBODIMENT
         --model-path /mnt/data/gr00t-finetune/outputs/gr00t_n1_right_o6_13d_retrain/gr00t_n1_right_o6_13d_full_20k/checkpoint-30000
         --traj-ids 0 --execution-horizon 16 --steps 400 --denoising-steps 4
         --modality-keys right_arm right_o6_hand"
      - "同上，--traj-ids 1 2 3"
    results:
