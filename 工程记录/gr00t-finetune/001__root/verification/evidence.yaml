      - "轨迹 1 (400 steps): MSE=18.50, MAE=0.90"
      - "轨迹 2 (400 steps): MSE=29.87, MAE=1.39"
      - "轨迹 3 (400 steps): MSE=22.50, MAE=1.15"
      - "平均 (4 轨迹): MSE=23.62, MAE=1.15"
    comparison:
      - "vs 旧 20k checkpoint (traj 0): MSE 717.38 → 13.73（↓98%）"
      - "vs current-state 基线 (traj 0): MSE 82.91 → 13.73（↓83%）"
      - "vs 单 episode 4.3 pass (traj 0): MSE ~683 → 13.73（↓98%）"
    artifacts:
      - "/mnt/data/gr00t-finetune/outputs/gr00t_n1_right_o6_13d_retrain/open_loop_eval/ckpt30000_traj0.png"
      - "/mnt/data/gr00t-finetune/outputs/gr00t_n1_right_o6_13d_retrain/open_loop_eval/ckpt30000_traj0.log"
      - "/mnt/data/gr00t-finetune/outputs/gr00t_n1_right_o6_13d_retrain/open_loop_eval/ckpt30000_traj1-3.png"
      - "/mnt/data/gr00t-finetune/outputs/gr00t_n1_right_o6_13d_retrain/open_loop_eval/ckpt30000_traj1-3.log"
    conclusion: |
      根因诊断完全证实：训练量不足（0.44 pass → 5.3 passes），加上恒定学习率，使模型在检测轨迹上实现了大幅优于先前所有对照的动作预测。
      平均 MSE 23.62（4 轨迹）显著优于 current-state 基线（82.91），且各轨迹表现一致稳定。
      模型已具备可用的开放循环动作预测能力。
    limitations:
      - "仅评估了 4 条训练集轨迹，未评估未见过的验证轨迹或真机闭环部署。"
      - "MSE 受 O6 手部 [0-100] 数值尺度主导，不能与仅含弧度关节的数据集直接比较，但与同数据基线的比较有效。"
