  - id: task-007
    kind: diagnostic-experiment
    phase: verification
    goal: "通过数据时序对齐和受控单 episode 过拟合，区分 GR00T 13D 训练失败的主要原因。"
    status: completed
    priority: high
    dependencies: [task-005]
    business_atoms: [atom-vla-001]
    inputs:
      - "lerobot_dataset_right_o6_13d（148 条训练 episode）"
      - "基础模型 /home/tbl/Project/models/gr00t_n1_base"
      - "正式 checkpoint-16000 到 checkpoint-20000 的既有评估证据"
    execution_plan: |
      1. 量化全数据 action 与同帧/相邻 state 的误差，验证动作时序契约。
      2. 构建一个可复现的单 episode LeRobot 子集，保持原始 metadata、视频和 13D 合同。
      3. 从基础 checkpoint 在固定 seed、无颜色增强、episode_sampling_rate=1.0 下训练一个有限步数的 overfit run。
      4. 对比短（300-step）与多 epoch（2,000-step）single-episode run、当前-state baseline 与现有 full run 的 open-loop 逐维指标。
    done_when:
      - "时序对齐结果、训练参数、checkpoint 和评估输出都记录到 project-log。"
      - "能够用证据将根因收敛到管线/监督契约或完整训练配方之一，或明确仍不可区分的限制。"
    risks:
      - "单 episode 过拟合需要 GPU 且可能耗时数分钟；结果只验证可记忆性，不代表泛化。"
      - "扩散推理有采样随机性；比较需固定 seed 或多次报告范围。"
    result: |
      数据时间对齐未见整体错帧；推理从4增至16去噪步无改善。
      20k正式训练在batch=1下仅约0.44个全量有效数据pass，是未拟合的主要可证实原因。
      单episode从约0.65 pass到约4.3 pass，open-loop MSE由约1278降至683，说明优化确有学习；仍未超过state baseline 82.91，故全量部署仍不可接受。
      2k实验的final save受根分区空间耗尽影响，但checkpoint-1000已可加载并提供关键对照证据。
    evidence:
      - .project-log/verification/evidence.yaml#verification-012
      - .project-log/research/solution-research.yaml#research-002
    artifact_retention: "用户于 2026-07-22 明确要求删除所有训练/诊断 checkpoint；outputs/ 已清空，日志与证据保留。"
