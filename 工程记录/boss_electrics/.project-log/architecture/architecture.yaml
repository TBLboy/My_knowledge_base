version: '0.4'
architectures:
- id: ARCH-001
  status: draft
  goal: 为 V1 左手单臂动作流程建立主仓库编排、类型化目标、中心坐标转换、底盘阶段协同和执行仓库技能之间的最小架构边界。
  related_business_logic:
  - BL-PLATING-001
  - BL-GRASP-001
  decision_refs:
  - DEC-003
  - DEC-005
  - DEC-006
  - DEC-007
  - DEC-008
  - DEC-013
  - DEC-009
  components:
  - name: BossElectricsPourPolicy
    repository: kitchen_robot_home
    responsibility: 按 V1 多阶段驱动模式推进任务：Phase 1 从感知结果预生成抓取→提锅→底盘移动步骤，Phase 2 在底盘移动后动态读取餐盘检测结果计算倾倒接近和增量回放步骤；沿锅把 PCA 主轴计算抓取偏置，构造中心坐标系 C 下的类型化目标。
  - name: Existing ExecuteTask/TaskTarget contract
    repository: kitchen_robot_home/dexbot_interfaces
    responsibility: 复用现有公共消息；V1 在本任务内部约定 move_cartesian/cartesian_trajectory 的笛卡尔数组表示左臂 base frame 下的法兰位姿，不新增领域消息。
  - name: CenterFrameTransformAdapter
    repository: kitchen_robot_home
    responsibility: 复用左右臂 base 与相机标定文件生成的中心坐标系配置，完成输入到 C 的统一和 C 到执行坐标的单一转换。
  - name: BaseMotionAdapter
    repository: kitchen_robot_home
    responsibility: 调用底盘组能力，表达进入倾倒工作区域、完成/失败/超时和阶段屏障；不把底盘动作实现塞入 arm MotionPrimitive。
  - name: BossElectricsPourSkill
    repository: robot_motion_executor
    responsibility: V1 只使用 1 个专用 Skill（PanPourSkill）；抓取/准备倾倒/倾倒接近复用现有 move_cartesian API，手部开闭、增量倾倒回放、放锅固定点和回 home 由该 Skill 覆盖。
  - name: PanPourSkill
    repository: robot_motion_executor
    responsibility: V1 唯一专用 Skill（task_type=pan_pour，action_name=close_hand/open_hand/pour_delta_replay/put_fixed/return_home）；完全自包含资源（arm 位姿、手部预设、103 点 pour_delta.json），复用既有 LOCAL_DELTA_FLANGE_REPLAY 原语与 delta_flange_replay_client（读当前法兰位姿 → T_current @ Delta_i → IK → 关节流式回放）。
  - name: TCPAndTrajectoryAdapter
    repository: kitchen_robot_home/robot_motion_executor
    responsibility: Planner 侧把业务计算得到的中心坐标系 C 目标转换为左臂 base frame B 下的法兰目标；Executor 侧只负责展开左臂 base 下的法兰增量回放并复用 RobotDriver。
  - name: RobotDriver gateway
    repository: robot_motion_executor/kitchen_robot_home
    responsibility: 复用现有 MoveCartesian、MoveJoints、灵巧手服务和停止主题；不承担 V1 业务状态。
  interfaces:
  - name: ScenePerception extension
    type: ROS 2 message
    direction: perception_group -> kitchen_robot_home
    contract: 提供有效性、时间戳、锅把中心/抓取点/PCA 主轴及其 source frame；在 planner 边界归一为 C。
  - name: Existing ExecuteTask flange convention
    type: ROS 2 action
    direction: kitchen_robot_home -> robot_motion_executor
    contract: 不增加消息字段；V1 约定目标在进入 MotionExecutor 前已转换为左臂 base frame B 下的法兰位姿，中心坐标系 C 只存在于业务计算和上游转换阶段。
  - name: Base motion adapter
    type: ROS 2 action/service adapter
    direction: kitchen_robot_home -> base_group
    contract: 发送目标工作区域，等待 done/failed/timeout；V1 左臂在该阶段不发新运动目标。
  - name: TCP configuration
    type: YAML/configuration
    direction: configuration -> planner/executor
    contract: 抓取 TCP、锅具 TCP 的位置和姿态可配置；锅具 TCP 是锅上固定参考点。
  - name: Relative flange trajectory
    type: versioned trajectory file
    direction: configuration -> BossElectricsPourSkill
    contract: 轨迹点相对于录制起始法兰表达，包含姿态、顺序和必要的回放参数；运行时从 C 下的法兰起始位姿展开为 arm 执行航点，锅具通过刚体连接跟随。
  data_flows:
  - 感知组发布 ScenePerception -> planner 读取最新有效信息 -> 将锅把字段转换到 C -> 计算 grasp_target_C
  - planner 读取餐盘中心 plate_center_C 和 pour_offset_C -> 计算 pour_point_C -> 构造 C 下法兰目标
  - planner 发送抓取/提锅阶段 goal -> executor skill -> MotionPrimitive -> RobotDriver
  - planner 发送底盘目标 -> BaseMotionAdapter -> 底盘组；收到完成后进入餐盘目标和倾倒阶段
  - executor 根据左臂 base B 下的当前法兰位姿和 relative flange trajectory 展开绝对法兰航点 -> RobotDriver
  - 当前 V1 不产生落料验收结果和异常业务分支；接口保留后续字段和阶段扩展位
  state_and_concurrency:
  - TaskPlanner 是 V1 业务状态唯一拥有者；Executor 只拥有单个 ExecuteTask goal 的原语执行状态。
  - V1 阶段按顺序执行；底盘移动阶段左臂保持准备倾倒姿态，不与新的左臂运动 goal 并发。
  - 底盘完成事件是从 lift-to-pour-ready 到 plate-target-calculated 的阶段屏障。
  - 当前不实现业务级重试、幂等恢复和异常分支；后续扩展必须重新定义状态和验收。
  failure_paths:
  - 感知未就绪：V1 保持未启动/等待占位，不进入抓取目标计算。
  - 目标未在 Planner 侧完成 C→B 转换或目标 frame 语义不明：不得直接发送，需在边界报告接口错误。
  - 底盘适配器未提供完成信号：技术选型/Spike 阻塞底盘协同实现，不静默假定完成。
  - TCP 或轨迹参数缺失：在构造执行目标前报告配置缺失，不由 executor 猜测默认业务值。
  - 其他执行失败：V1 仅沿现有 action/primitive 失败返回链路退出；不新增自动重试或回退。
  security_and_privacy:
  - 主要风险是机器人控制权限和配置误用；TCP、轨迹和手部参数必须来自受控部署配置，不从不可信感知字段直接执行。
  observability:
  - 每个阶段记录 task_id、frame_id、目标摘要、TCP 名称/版本、轨迹名称/版本和 goal 结果。
  - 记录中心坐标转换输入来源、时间戳和最终执行 frame，便于复现坐标错误。
  skill_boundary:
  - status: confirmed
    date: '2026-08-06'
    rule: V1 只使用 1 个专用 Skill（PanPourSkill / pan_pour），完全自包含、不引用临时 teach 链路；抓取/准备倾倒/倾倒接近复用 move_cartesian API，手部开闭、增量倾倒回放、放锅固定点、回 home 由该 Skill 覆盖。
    reused:
    - move_cartesian API：抓取、提锅到准备倾倒、倾倒接近（Planner 侧已完成 C→B 转换，发送左臂 base 下法兰目标）
    - ScenePerception -> WorldState -> PanPourPolicy：感知（Planner 侧，不是执行器 Skill）
    new_for_v1:
    - PanPourSkill：close_hand / open_hand / pour_delta_replay / put_fixed / return_home（手部用 SET_HAND 不收 driver 命名动作）
    pending:
    - 底盘协同：V1 流程有 WAITING_FOR_BASE_POSITION 阶段；若底盘动作需经 MotionExecutor 下发，再新增 1 个底盘相关 Skill，否则由底盘组自行控制，执行器侧不新增
    evidence:
    - kitchen_robot_home/src/dexbot_task_planner/dexbot_task_planner/policy/pan_pour/pan_pour_policy.py
    - robot_motion_executor/src/dexbot_motion_executor/dexbot_motion_executor/skills/pan_pour/pan_pour_skill.py
    owner: 主 Agent
    next_action: 底盘接口确认后决定是否新增底盘 Skill；正式 V1 标定后真机验证完整 V1 链路
  deployment_and_compatibility:
  - 本方案不修改 ExecuteTask/TaskTarget；现有通用 TaskTarget 和其他 task_type 保持兼容。
  - 首阶段只更新项目配置、接口、planner policy、executor skill 和针对性测试，不修改底层 SDK。
  open_questions:
  - 底盘组实际 action/service 名称、完成事件和超时字段。
  - 现有 driver/控制器能否按显式锅具 TCP 局部轨迹执行，或需要 replay spike。
  - 感知组最终确认锅把/餐盘字段如何映射到现有 ScenePerception/ObjectDetection，以及发布 frame、有效性和新鲜度一致性。
  perception_boundary:
  - status: confirmed
    path: ScenePerception -> TaskPlannerNode._on_scene() -> WorldState -> PanPourPolicy
    rule: 正式流程复用 Planner 现有路径 A；PanPourPolicy 使用已注入的 WorldState，不直接订阅 ROS topic。
    rejected_for_now:
    - 老板电器专用 PerceptionBridge
    - Policy 内第二套感知缓存
    - 直接把通用 ObjectDetection.pose 擅自解释为锅把或餐盘业务字段
    pending_external_contract:
    - 锅把抓取点
    - 锅把 PCA 主轴
    - 餐盘中心
    - source frame 与中心坐标系转换责任
    - 有效性、置信度和新鲜度规则
    evidence:
    - kitchen_robot_home/src/dexbot_task_planner/dexbot_task_planner/task_planner_node.py:281-311
    - kitchen_robot_home/src/dexbot_task_planner/dexbot_task_planner/policy/pan_pour/pan_pour_policy.py
    - kitchen_robot_home/src/dexbot_interfaces/msg/ScenePerception.msg
    - kitchen_robot_home/src/dexbot_interfaces/msg/ObjectDetection.msg
    owner: 感知组
    next_action: 等待感知组提供最终字段契约后，在 Planner 现有 WorldState 写入边界接入最小映射
  created_at: '2026-07-28'
  updated_at: '2026-08-06'
