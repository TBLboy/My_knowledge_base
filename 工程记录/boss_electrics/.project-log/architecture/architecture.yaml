version: '0.4'
architectures:
- id: ARCH-001
  status: draft
  goal: 为 V1 左手单臂动作流程建立主仓库编排、类型化目标、中心坐标转换、底盘阶段协同和执行仓库技能之间的最小架构边界。
  related_business_logic:
  - BL-PLATING-001
  - BL-GRASP-001
decision_refs:
  - DEC-003
  - DEC-005
  - DEC-006
  - DEC-007
  - DEC-008
  - DEC-009
  components:
  - name: BossElectricsPourPolicy
    repository: kitchen_robot_home
    responsibility: 按 V1 多阶段驱动模式推进任务：Phase 1 从感知结果预生成抓取→提锅→底盘移动步骤，Phase 2 在底盘移动后动态读取餐盘检测结果计算倾倒接近和增量回放步骤；沿锅把 PCA 主轴计算抓取偏置，构造中心坐标系 C 下的类型化目标。
  - name: PourTaskTarget message
    repository: kitchen_robot_home/dexbot_interfaces
    responsibility: 显式承载感知引用、frame_id、抓取目标、餐盘中心、倾倒偏置、两个 TCP 参数、手部参数和轨迹引用。
  - name: CenterFrameTransformAdapter
    repository: kitchen_robot_home
    responsibility: 复用左右臂 base 与相机标定文件生成的中心坐标系配置，完成输入到 C 的统一和 C 到执行坐标的单一转换。
  - name: BaseMotionAdapter
    repository: kitchen_robot_home
    responsibility: 调用底盘组能力，表达进入倾倒工作区域、完成/失败/超时和阶段屏障；不把底盘动作实现塞入 arm MotionPrimitive。
  - name: BossElectricsPourSkill
    repository: robot_motion_executor
    responsibility: 将类型化目标转换为现有笛卡尔移动、手部角度/力矩和轨迹播放 MotionPrimitive。
  - name: TCPAndTrajectoryAdapter
    repository: robot_motion_executor
    responsibility: 根据参数化抓取 TCP/锅具 TCP 和锅具 TCP 局部增量轨迹构造执行器所需航点；具体 driver frame 转换集中在此处。
  - name: RobotDriver gateway
    repository: robot_motion_executor/kitchen_robot_home
    responsibility: 复用现有 MoveCartesian、MoveJoints、灵巧手服务和停止主题；不承担 V1 业务状态。
  interfaces:
  - name: ScenePerception extension
    type: ROS 2 message
    direction: perception_group -> kitchen_robot_home
    contract: 提供有效性、时间戳、锅把中心/抓取点/PCA 主轴及其 source frame；在 planner 边界归一为 C。
  - name: ExecuteTask typed target
    type: ROS 2 action
    direction: kitchen_robot_home -> robot_motion_executor
    contract: 在现有 ExecuteTask 上增加可选 PourTaskTarget；保留通用 TaskTarget 兼容路径，task_type 标识 V1 领域 Skill。
  - name: Base motion adapter
    type: ROS 2 action/service adapter
    direction: kitchen_robot_home -> base_group
    contract: 发送目标工作区域，等待 done/failed/timeout；V1 左臂在该阶段不发新运动目标。
  - name: TCP configuration
    type: YAML/configuration
    direction: configuration -> planner/executor
    contract: 抓取 TCP、锅具 TCP 的位置和姿态可配置；锅具 TCP 是锅上固定参考点。
  - name: Relative pour trajectory
    type: versioned trajectory file
    direction: configuration -> BossElectricsPourSkill
    contract: 轨迹点相对于锅具 TCP 表达，包含姿态、顺序和必要的回放参数；运行时由适配器转换为 arm 执行航点。
  data_flows:
  - 感知组发布 ScenePerception -> planner 读取最新有效信息 -> 将锅把字段转换到 C -> 计算 grasp_target_C
  - planner 读取餐盘中心 plate_center_C 和 pour_offset_C -> 计算 pour_point_C -> 构造 PourTaskTarget
  - planner 发送抓取/提锅阶段 goal -> executor skill -> MotionPrimitive -> RobotDriver
  - planner 发送底盘目标 -> BaseMotionAdapter -> 底盘组；收到完成后进入餐盘目标和倾倒阶段
  - executor 根据 pan_tcp_pose 和 relative trajectory -> 计算 arm 执行航点 -> RobotDriver
  - 当前 V1 不产生落料验收结果和异常业务分支；接口保留后续字段和阶段扩展位
  state_and_concurrency:
  - TaskPlanner 是 V1 业务状态唯一拥有者；Executor 只拥有单个 ExecuteTask goal 的原语执行状态。
  - V1 阶段按顺序执行；底盘移动阶段左臂保持准备倾倒姿态，不与新的左臂运动 goal 并发。
  - 底盘完成事件是从 lift-to-pour-ready 到 plate-target-calculated 的阶段屏障。
  - 当前不实现业务级重试、幂等恢复和异常分支；后续扩展必须重新定义状态和验收。
  failure_paths:
  - 感知未就绪：V1 保持未启动/等待占位，不进入抓取目标计算。
  - 类型化目标缺失或 frame_id 非 C：边界拒绝该 goal，并记录接口错误。
  - 底盘适配器未提供完成信号：技术选型/Spike 阻塞底盘协同实现，不静默假定完成。
  - TCP 或轨迹参数缺失：在构造执行目标前报告配置缺失，不由 executor 猜测默认业务值。
  - 其他执行失败：V1 仅沿现有 action/primitive 失败返回链路退出；不新增自动重试或回退。
  security_and_privacy:
  - 主要风险是机器人控制权限和配置误用；TCP、轨迹和手部参数必须来自受控部署配置，不从不可信感知字段直接执行。
  observability:
  - 每个阶段记录 task_id、frame_id、目标摘要、TCP 名称/版本、轨迹名称/版本和 goal 结果。
  - 记录中心坐标转换输入来源、时间戳和最终执行 frame，便于复现坐标错误。
  deployment_and_compatibility:
  - 接口消息变更需要主仓库和执行仓库同步构建、版本化和回滚。
  - 现有通用 TaskTarget 和其他 task_type 保持兼容；V1 使用独立 task_type 和可选 PourTaskTarget。
  - 首阶段只更新项目配置、接口、planner policy、executor skill 和针对性测试，不修改底层 SDK。
  open_questions:
  - 底盘组实际 action/service 名称、完成事件和超时字段。
  - 现有 driver/控制器能否按显式锅具 TCP 局部轨迹执行，或需要 replay spike。
  - 感知组最终消息字段、发布 frame 和时间戳一致性。
  created_at: '2026-07-28'
  updated_at: '2026-07-28'
