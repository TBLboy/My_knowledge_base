version: '0.4'
baselines:
- id: REQ-001
  revision: 3
  status: active
  goal: 完成老板电器炒菜机器人 3.3 倾倒入盘（大）的第一版可重复闭环，并为第二版右手锅铲辅助预留迭代入口
  actors:
  - 双臂移动机器人
  - 左臂灵巧手
  - 视觉感知系统
  - 自动翻炒锅 KP200
  - 餐盘
  in_scope:
  - V1 以锅把朝左为固定场景基准
  - 感知组提供锅把中心、抓取点、主轴方向等感知信息；本子任务订阅并使用结果
  - 左手基于感知抓取点沿锅把主轴 PCA 向量的可调偏置计算目标，使用位置和姿态均可参数化的抓取 TCP 以固定姿态移动并闭合灵巧手
  - V1 初版不执行抓取确认；抓取确认作为后续迭代入口，不进入当前 V1 状态链和验收
  - 左手提锅进入准备倾倒姿态，底盘移动期间保持该姿态
  - 定位餐盘，并在机器人中心坐标系下将餐盘中心点加可调 xyz 偏置计算为倾倒点，再使用参数化锅具 TCP 转换后移动到倾倒位置
  - 在锅具 TCP 坐标系下执行固定场景预录制倾倒动作，必要时加入轻微抖动
  - 倾倒完成后预留放回锅具、张开灵巧手和恢复 home 的流程位置；具体放回规则、轨迹和 home 参数后续确定
  - V1 当前只打通动作流程，不加入菜品完整落盘、卡料、洒落或其他验收规则
  - V1 当前不实现异常检查、自动重试和回退处理，仅预留扩展位置
  - 将右手锅铲辅助作为 V2 独立迭代任务，不进入 V1 验收
  out_of_scope:
  - V1 右手锅铲抓取、放置和辅助动作
  - 生产级多锅型、多菜品和多场景泛化
  - 未经接口和低速 Spike 验证的全轨迹自适应力控
  - V1 默认采用双臂协同完成倾倒
  business_logic_refs:
  - BL-GRASP-001
  - BL-PLATING-001
  constraints:
  - 抓取闭合完成前锅体必须保持安全支撑；当前 V1 不执行抓取确认
  - 感知模型开发不属于本子任务，底盘运动能力由底盘组提供
  - 所有业务目标、中间位姿和偏置统一使用机器人中心坐标系；机械臂基坐标只作为底层执行转换坐标
  - V1 倾倒点公式为 `pour_point_C = plate_center_C + pour_offset_C`
  - V1 优先保证固定场景可重复闭环，不等待 V2 右手锅铲能力
  - 运行参数、固定姿态、TCP 数值和轨迹参数均属于待填写配置，不阻塞流程骨架
  - 异常检查、自动重试、回退和人工接管仅预留扩展位置，不进入当前 V1 验收
  - V2 右手锅铲辅助必须在 V1 闭环验收后单独评估
  quality_attributes:
  - 可重复性
  - 可观测性
  - 安全可停止
  - 失败可恢复
  - 版本边界清晰
  assumptions:
  - KP200 在 V1 测试中可提供稳定且可识别的锅把朝左固定场景
  - V1 使用专属初始状态和固定餐盘区域压缩环境变量
  - 锅把几何、材质、温度和负载仍需通过 TASK-002 实物测量确认
  unresolved_questions:
  - Q-001、Q-007、Q-008：影响锅把抓取、热安全和灵巧手参数，需要通过实物和接口测量解决；不阻塞无确认基础流程的业务澄清
  - Q-006：已确认 V1 不增加落料完整性验收规则
  - Q-010、Q-012、Q-015：业务规则已确认，接口承载、代码配置入口和底层转换进入技术选型
  - Q-013：放回规则、轨迹和 home 后续确定，不阻塞前段流程
  - Q-014：已确认 V1 只预留异常处理位置，不实现异常分支
  - Q-003、Q-004、Q-005：不阻塞 V1 基础闭环，作为后续倾倒反馈迭代输入
  - Q-002：V1 已明确不加入右手锅铲辅助，其他双臂协同需求延期至 V2 评估
  approval:
    status: approved
    evidence:
    - /home/tbl/Project/My_knowledge_base/学习记录/2026.07.27/今日任务.md
    - 用户于 2026-07-28 确认两版本实施方案
