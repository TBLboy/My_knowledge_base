    # 十、关键前置动作：锅把抓取确认深度调研（2026-07-22）
    grasp_precondition:
      decision_question: >
        在锅把尺寸、材质、温度和锅具质心尚未完全确认的条件下，如何让灵巧手可靠抓住 KP200 锅把，
        并在进入转运/倾倒前用可观测证据确认抓取稳定？
      core_conclusion: >
        抓锅把必须独立为一个带状态输出的原子动作。推荐“视觉几何定位 + 预抓取姿态 + 包络式多指夹持 +
        接触/力矩联合确认 + 受控短距离试抬升”的五段式流程。仅凭手指闭合角度、夹爪到位或单次力矩读数，
        都不足以证明锅把已抓稳。
      why_this_is_critical: >
        锅具的风险不是只承受竖直重量，还要承受长柄产生的倾覆力矩、转运加速度、倾倒时质心移动和可能的卡料冲击。
        抓取点、手指接触几何、摩擦条件和腕部姿态会共同决定滑移、旋转和脱手风险；抓取失败必须在锅体仍有支撑时被发现。
      grasp_sequence:
        - stage: 0_geometry_and_safety_gate
          action: >
            识别锅把轴线、可抓取长度、截面/直径、端部、锅体方向和高温禁区；检查机器人工作空间、碰撞模型、
            手部可达性、负载和腕部姿态余量。
          evidence_required:
            - 锅把位姿置信度
            - 抓取区域温度状态
            - 锅把几何或模板匹配结果
        - stage: 1_pre_grasp
          action: >
            让手掌/手指接近方向与锅把轴线和截面法向匹配，保留安全间隙；优先抓取远离锅体高温区、
            但仍有足够包络长度和抗倾覆力矩的区段，不默认“越靠末端越好”。
          design_note: >
            抓取点需在热安全、力矩、手指行程和后续倾倒可达性之间折中；必须通过实物测量，不应凭照片猜尺寸。
        - stage: 2_compliant_close
          action: >
            采用低速、限力、带接触检测的闭合；优先使用掌面/多指包络接触或专用锅把适配夹具，
            避免只靠两个硬点指尖夹持光滑圆柱把手。
          design_note: >
            若现有灵巧手无法提供可重复的包络接触或夹持力反馈，工程上应优先增加可更换的锅把夹具/软质高摩擦衬垫，
            而不是继续用软件补偿一个先天不稳定的抓取界面。
        - stage: 3_contact_and_load_confirmation
          action: >
            联合检查指尖接触分布、手指位置/力矩、腕部或关节负载趋势以及锅把相对位姿；
            检查是否出现单侧接触、快速闭合、夹持力饱和、锅把转动或异常摩擦滑移。
          forbidden_shortcut: 仅用“手指到位/电机电流超过阈值”作为成功判据
        - stage: 4_controlled_micro_lift
          action: >
            在锅具仍接近安全支撑面的条件下，沿预定安全方向低速抬升一个小距离并短暂停留，
            观察相对滑移、姿态变化、力矩突变和关节负载；通过后才输出 grasp_confirmed。
          safety_note: >
            试抬升不是甩动或大幅加速度测试；其目的只是暴露未接触、滑移和明显承载不足，
            具体高度、速度和停留时间必须由负载与安全评估确定。
      grasp_modes:
        - id: mode-a-dedicated-handle-gripper
          name: 专用锅把适配夹具/软衬垫
          recommendation: preferred-if-allowed
          fit: >
            对固定 KP200 和原型演示最有利；通过包络、止挡和高摩擦材料把几何不确定性转化为可控接口。
          tradeoffs: >
            需要确认不遮挡锅把、不受高温/油污影响，并保留快速释放和清洁维护能力；会降低通用性。
        - id: mode-b-dexterous-enveloping-grasp
          name: 灵巧手多指包络抓取
          recommendation: primary-software-path
          fit: >
            可发挥现有灵巧手能力，适合锅把截面和抓取区稳定可识别的场景。
          tradeoffs: >
            对指尖接触模型、触觉/力反馈、手指同步和油污条件敏感；必须做试抬升验证。
        - id: mode-c-two-arm-cooperative-grasp
          name: 双臂协同持锅
          recommendation: conditional
          fit: >
            当锅具负载大、锅把细长或单手腕部力矩余量不足时可降低单臂负荷。
          tradeoffs: >
            显著增加同步、碰撞、协调和释放复杂度；不能因为机器人有双臂就默认使用。
            第二只手若只是扶锅体，可能进入高温区或干扰倾倒路径。
        - id: mode-d-suction_or_magnetic
          name: 吸附/磁吸辅助
          recommendation: generally-not-primary
          fit: >
            只有锅把表面、材料和结构明确满足条件时才可考虑。
          tradeoffs: >
            磁性、曲面、油污、温度和剥离载荷会限制可靠性；不应作为未知锅把的默认方案。
      confirmation_signals:
        required:
          - 视觉/几何：手指与锅把相对位姿、抓取区域和锅把是否离开支撑面的变化
          - 手部：各手指位置、闭合行程、接触或触觉分布、夹持力/电流（若可标定）
          - 机器人负载：关节 effort/力矩或腕部 F/T 的姿态补偿后趋势
          - 动态：微抬升期间的滑移、锅把旋转、姿态变化、超时和通信状态
        minimum_acceptance: >
          至少需要“接触/闭合证据 + 受控微抬升负载证据 + 无明显相对滑移”三类证据组合；
          任一证据缺失时只能输出 grasp_unverified，不得进入倾倒。
      failure_recovery:
        - failure: 定位置信度不足
          action: 退回安全位 → 重拍/重新定位 → 仍失败则人工介入
        - failure: 接触分布不完整或手指行程异常
          action: 停止闭合 → 释放到支撑面 → 更换预抓取姿态，仅允许一次重试
        - failure: 微抬升滑移或姿态突变
          action: 立即降回支撑面 → 保持锅体稳定 → 释放 → 检查锅把/手部油污和抓取点
        - failure: 超温/超负载/通信丢失
          action: 禁止转运；按设备安全策略停机并人工介入
      recommended_validation:
        name: 锅把抓取确认 Spike
        stages:
          - 采集 KP200 锅把尺寸、材料、温度、支撑方式和可抓取区
          - 使用空锅进行视觉定位、不同抓取点和不同手指预形状重复测试
          - 使用安全等效负载模拟最坏锅内质量与质心，进行低速微抬升
          - 对比指尖/电机/关节力矩/腕部 F/T/视觉相对位姿信号
          - 再用冷却后的真实锅具和近似菜品做低速测试
        outputs:
          - 可重复的抓取姿态和手指预形状
          - 抓取确认阈值与拒绝条件
          - 单手、双手和专用夹具的成功率/失败分类
          - 进入倾倒动作所需的 grasp_confirmed 数据契约
      confidence:
        level: medium
        known: >
          触觉反馈可用于动态重心变化下的抓取调节，且官方控制框架支持分层运动与传感器接口。
        unknown: >
          KP200 锅把真实几何、材料、温度、机器人灵巧手型号、指尖传感器能力、负载余量和 SDK 接口。
