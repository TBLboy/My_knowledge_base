version: "0.2"
studies:
  - id: study-pouring-control-strategies
    title: 炒菜出锅倾倒入盘控制策略技术方案调研
    phase: solution-research
    status: completed
    date: 2026-07-21

    # 一、调研前条件
    preconditions:
      target_capability: 双臂移动机器人抓取自动翻炒锅（KP200）手柄，将烹饪好的菜品（芦笋虾仁类固体+少量汤汁）倾倒入餐盘
      inputs:
        - 自动翻炒锅 KP200（含长手柄，锅体在前）
        - 餐盘位置和朝向（预设固定位置）
        - 菜品类型（芦笋虾仁：固体为主 + 少量汤汁）
      outputs:
        - 菜品完整装入餐盘
        - 空锅（可能残留少量汤汁油渍）
      runtime_environment:
        - 双臂机器人 7-DOF/臂 + 灵巧手
        - 典型 ROS 2 + MoveIt 2 控制框架
        - IoT 平台作为设备协调中心
        - 厨房台面高度 ~900mm，深度 ~700mm
      integration_boundaries:
        - 手臂运动规划（MoveIt 2 Cartesian 路径）
        - 力/力矩感知（关节力矩传感器或腕部 F/T 传感器）
        - 视觉定位（识别锅把手、餐盘位置）
        - 任务调度（三级任务结构中的原子动作层）
      constraints:
        - 手柄抓取点远离高温区域
        - 倾倒过程中避免与台面/灶具碰撞
        - 菜品不能洒出台面或餐盘外
        - 锅具重量（含菜品）在机器人负载范围内
        - 原型演示阶段，优先保证可靠性和可复现性
        - 项目阶段：原型验证和演示阶段，允许固定预设
      related_atoms:
        - atom-plating-pour
      related_tasks:
        - task-solution-research-plating

    # 二、检索来源证据
    evidence_sources:
      academic:
        - id: arXiv:2310.18473
          title: "Pouring by Feel: An Analysis of Tactile and Proprioceptive Sensing for Accurate Pouring"
          authors: "Pedro Piacenza, Daewon Lee, Volkan Isler"
          year: 2023
          venue: arXiv (cs.RO)
          summary: >
            使用 PID 控制器 + 机器人关节力矩传感器估计倾倒出的液体重量。
            仅靠本体感知（无需外部 F/T 传感器）即可达到 ±10ml 精度。
            在 novel 位置和不同抓取方式下均表现鲁棒。
          relevance: 核心技术参考 — 力感知闭环倾倒控制
        - id: arXiv:2503.17501
          title: "Shear-based Grasp Control for Multi-fingered Underactuated Tactile Robotic Hands"
          authors: "Christopher J. Ford et al."
          year: 2025
          venue: IEEE Transactions on Robotics (Special Section on Tactile Robotics)
          summary: >
            使用指尖触觉传感器的剪切力控制实现动态倾倒。
            特别处理了倾倒过程中重心变化导致的抓取力调整。
            灵巧手 + 触觉反馈实现类人操作。
          relevance: 灵巧手触觉反馈技术参考
        - id: arXiv:2407.01755
          title: "An Intelligent Robotic System for Perceptive Pancake Batter Stirring and Precise Pouring"
          authors: "Xinyuan Luo, Shengmiao Jin, Hung-Jui Huang, Wenzhen Yuan"
          year: 2024
          venue: IROS 2024
          summary: >
            集成触觉感知与控制的机器人面糊倾倒系统。
            可估计水粉比和液位，精确倒入任意形状。
          relevance: 厨房场景触觉感知倾倒参考
        - id: arXiv:2408.01366
          title: "Play to the Score: Stage-Guided Dynamic Multi-Sensory Fusion for Robotic Manipulation"
          authors: "Ruoxuan Feng, Di Hu, Wenke Ma, Xuelong Li"
          year: 2024
          venue: CoRL 2024 (oral)
          summary: >
            多感官融合（视觉+听觉+触觉）的模仿学习框架。
            在倾倒任务中动态调整各模态优先级。
          relevance: 高级融合方案参考（适合后续阶段）
        - id: arXiv:2505.11680
          title: "Grounded Task Axes: Zero-Shot Semantic Skill Generalization"
          authors: "M. Yunus Seker, Shobhit Aggarwal, Oliver Kroemer"
          year: 2025
          summary: >
            将操作技能分解为任务轴控制器（位置/力控制）。
            在倾倒任务中验证了轴控制器的鲁棒迁移能力。
          relevance: 控制框架设计参考
      frameworks:
        - name: MoveIt 2
          capability: Cartesian 路径规划
          relevance: 实现倾倒运动轨迹的基本框架
          evidence: MoveIt 2 官方文档确认支持 computeCartesianPath 规划笛卡尔空间路径
        - name: ROS 2 Control
          capability: 力/力矩控制接口
          relevance: 支持阻抗/导纳控制器实现力控倾倒
          evidence: ros2_control 框架支持多种控制器类型，可通过 joint torque 接口获取力信息

    # 三、候选方案对比
    candidates:
      - id: option-a-teach-replay
        name: 纯示教轨迹 (Teach-and-Replay)
        category: position-control
        description: >
          人工引导机器人完成一次倾倒动作，记录关节轨迹，
          在演示时直接回放。无力觉/视觉反馈。
        requirement_fit:
          rating: medium
          note: 固定场景可工作，但对食物重量变化无适应能力
        integration_cost: 低 — 只需示教一次，不需要额外传感器
        maintenance_cost: 低 — 固定轨迹，无需维护
        performance:
          rating: medium-low
          note: 食物重量/质心变化时可能洒出；汤汁量不同时表现不稳定
        reliability:
          rating: medium
          note: 预设状态良好时可靠；偏离预设时失败率高
        debuggability: 高 — 轨迹固定，容易定位问题
        lock_in: 无
        safety_risk: 中 — 无力控可能导致碰撞检测不及时
        advantages:
          - 实现最简单
          - 演示可复现性高
          - 不需要额外传感器
          - 开发周期最短
        disadvantages:
          - 对食物量/类型变化零适应
          - 锅具重量不同需重新示教
          - 汤汁洒出风险随变量增加
        project_fit:
          rating: medium
          note: 可作为最小可行方案快速上线，但演示风险较高

      - id: option-b-force-pid
        name: 力感知 PID 闭环倾倒 (Force-based PID Pouring)
        category: force-control
        description: >
          基于"Pouring by Feel"方法，使用机器人关节力矩传感器
          实时监测锅具+食物重量变化，PID 控制器根据重量损失率
          调节倾倒角度和速度。无需外部 F/T 传感器。
        requirement_fit:
          rating: high
          note: 适应不同食物重量，控制倾倒速度，降低洒出风险
        integration_cost:
          rating: medium
          note: 需要接入关节力矩数据，实现重量估计算法和 PID 控制器
        maintenance_cost: 中 — 需标定不同锅具/菜品的重量基线
        performance:
          rating: high
          note: 论文证明 ±10ml 精度（液体测试），固体+汤汁效果应更优
        reliability:
          rating: high
          note: 不依赖视觉条件，在关节力矩传感器可用时始终可靠
        debuggability: 高 — PID 参数和重量估计可独立调试
        lock_in: 无 — 在 ROS 2 框架内实现，可移植
        safety_risk: 低 — 力感知可检测异常阻力（如食物卡住）
        advantages:
          - 实现在现有硬件上（关节力矩传感器）
          - 不需要额外传感器硬件
          - 主动适应食物重量变化
          - 经验证的学术方法（±10ml 精度）
          - 可检测倾倒异常（重量变化异常）
        disadvantages:
          - 需要标定空锅重量
          - 对极轻/极重食物的控制参数需调整
          - 单靠力感无法检测餐盘位置偏差
        project_fit:
          rating: high
          note: 最适合原型演示阶段的技术—硬件已有、开发量适中、可靠性高

      - id: option-c-vision-servo
        name: 视觉引导倾倒 (Vision-guided Pouring)
        category: visual-servo
        description: >
          使用 RGB-D 相机（顶部或腕部安装）实时监测倾倒过程。
          视觉算法检测餐盘位置、食物落点、汤汁飞溅。
          根据视觉反馈调整倾倒轨迹。
        requirement_fit:
          rating: medium
          note: 可检测餐盘位置偏差和飞溅，但对油烟/遮挡敏感
        integration_cost: 高 — 需要视觉流水线、标定、实时推理
        maintenance_cost: 高 — 光照/背景变化需维护视觉模型
        performance:
          rating: medium
          note: 依赖光照、视角、油烟条件；处理延迟可能影响实时控制
        reliability:
          rating: medium-low
          note: 厨房环境（油烟、蒸汽、水渍）影响视觉稳定性
        debuggability: 中 — 视觉失败需要区分环境/算法/标定问题
        lock_in: 低 — 可基于 OpenCV 等开源方案
        safety_risk: 低 — 被动感知，不增加机械风险
        advantages:
          - 可检测餐盘位置偏差并补偿
          - 可发现飞溅并及时调整
          - 可与力控方案互补
        disadvantages:
          - 对厨房油烟/蒸汽/光照敏感
          - 实时视觉处理增加计算负载
          - 延迟可能影响倾倒控制稳定性
          - 原型阶段视觉环境可能变化
        project_fit:
          rating: low-medium
          note: 适合作为补充而非主力方案；原型阶段稳定视觉环境不易保证

      - id: option-d-hybrid-force-vision
        name: 力+视觉融合倾倒 (Hybrid Force-Visual Pouring)
        category: hybrid
        description: >
          力控为主、视觉为辅的双通道方案。
          主控制回路基于关节力矩传感器的重量反馈，
          视觉作为辅助确认餐盘位置和检测异常飞溅。
        requirement_fit:
          rating: high
          note: 兼具力控的鲁棒性和视觉的异常检测能力
        integration_cost: 高 — 需要同时实现力控和视觉流水线
        maintenance_cost: 中高 — 两个子系统均需维护
        performance:
          rating: high
          note: 双通道冗余，一组失效时另一组可降级运行
        reliability:
          rating: high
          note: 即使视觉失效，力控通道仍可独立完成倾倒
        debuggability: 中 — 交互问题需要判断哪个通道出错
        lock_in: 低
        safety_risk: 低 — 有冗余感知
        advantages:
          - 最稳健的方案
          - 力控通道独立工作，视觉提供额外安全保障
          - 可为后续智能化升级（如自适应倾倒）提供基础
        disadvantages:
          - 开发周期最长
          - 系统复杂度高
          - 原型阶段可能过度设计
        project_fit:
          rating: medium
          note: 适合最终系统，原型阶段可能过度工程化

      - id: option-e-tactile-dexterous
        name: 灵巧手触觉反馈倾倒 (Tactile Dexterous Hand Pouring)
        category: tactile-control
        description: >
          利用灵巧手指尖触觉传感器感知抓取力和滑动，
          在倾倒过程中动态调整抓取力和手腕姿态。
          参考 Shear-based Grasp Control (arXiv:2503.17501)。
        requirement_fit:
          rating: medium-high
          note: 充分发挥灵巧手能力，但需要触觉传感器硬件
        integration_cost: 高 — 需要触觉传感器集成和标定
        maintenance_cost: 高 — 触觉传感器磨损/标定维护
        performance:
          rating: high
          note: 精细抓取控制，适应重心变化
        reliability:
          rating: medium
          note: 触觉传感器在厨房环境（油污）下的可靠性需验证
        debuggability: 中 — 触觉信号解读需要专业知识
        lock_in: 中 — 触觉传感器型号可能绑定
        safety_risk: 低 — 精细力控可防止抓取损伤
        advantages:
          - 发挥灵巧手全部潜力
          - 最接近人类操作的精细度
          - 可检测滑移并即时调整
        disadvantages:
          - 需要触觉传感器硬件和驱动
          - 高油污环境对触觉传感器的挑战
          - 开发周期长，原型阶段风险较大
        project_fit:
          rating: low-medium
          note: 适合后期精细化阶段，原型阶段优先保证基本功能可靠

    # 四、对比总结
    comparison_summary:
      best_overall: option-b-force-pid
      best_for_demo: option-b-force-pid
      best_for_production: option-d-hybrid-force-vision
      easiest_to_start: option-a-teach-replay

    # 五、推荐方案
    recommendation:
      primary:
        id: option-b-force-pid
        name: 力感知 PID 闭环倾倒
        strategy: wrapper-adapter
        rationale: >
          综合考虑原型演示阶段定位、现有硬件能力（关节力矩传感器 + 灵巧手）、
          开发周期和演示可靠性，推荐以力感知 PID 闭环倾倒作为主方案。

          理由：
          1. 充分利用现有硬件——关节力矩传感器在所有 7-DOF 机器人上标配
          2. 不需要额外传感器硬件投入
          3. 经验证的学术方案（Pouring by Feel, ±10ml 精度）
          4. 主动适应食物重量变化，降低演示风险
          5. 开发量适中（PID 控制器 + 重量估计算法），适合原型阶段
          6. 可与后续视觉/触觉方案叠加演进

          实现路径：
          - Phase 1: 示教空锅倾倒轨迹，记录关节角度序列
          - Phase 2: 集成关节力矩传感器，实现空锅重量基线标定
          - Phase 3: 实现 PID 重量反馈控制器，在示教轨迹基础上实时调节倾倒速度
          - Phase 4: 加入食物测试，标定不同食物重量的 PID 参数
          - Phase 5: 加入异常检测（重量变化异常 → 停止/提示）
      fallback:
        id: option-a-teach-replay
        name: 纯示教轨迹
        strategy: direct-use
        rationale: >
          如果力控集成遇到不可预见困难（如关节力矩传感器数据访问受限、
          力矩噪声过大、实时性不满足），退回到纯示教轨迹方案。
          此时必须确保：
          1. 每次演示的食物量和类型完全一致
          2. 锅具位置和姿态精确重复
          3. 餐盘位置固定
          4. 留有充足的安全裕度
      future_evolution:
        - id: option-d-hybrid-force-vision
          trigger: >
            力控方案稳定运行后，增加视觉作为辅助通道。
            主要解决餐盘位置偏差和飞溅检测两个痛点。
          effort: medium
        - id: option-e-tactile-dexterous
          trigger: >
            触觉传感器硬件就绪且厨房环境适应性验证通过后，
            增加灵巧手触觉反馈，提升抓取精细度和安全边界。
          effort: high

    # 六、方案失效条件
    invalidation_conditions:
      - condition: 关节力矩传感器数据不可用或噪声过大无法用于重量估计
        fallback: option-a-teach-replay
      - condition: 锅具手柄抓取姿态导致力矩数据失真（灵巧手抓取方式引入额外力矩）
        fallback: option-a-teach-replay 或需增加腕部 F/T 传感器
      - condition: 实时控制循环无法满足力控闭环的延迟要求
        fallback: option-a-teach-replay + 离线优化轨迹

    # 七、开放问题
    open_questions:
      - question: KP200 锅具手柄的具体尺寸、重量和抓取点？
        impact: 影响抓取策略和力矩基线标定
        suggested_action: 获取 KP200 技术规格或实物测量
        authority: C（需用户确认）
      - question: 机器人关节力矩传感器的数据接口和采样频率？
        impact: 影响力控 PID 控制器的设计和参数
        suggested_action: 查阅机器人 SDK 文档或联系供应商
        authority: B（自主调研）
      - question: 倾倒过程中是否需要双臂协同？（一臂持锅倾倒，另一臂辅助固定餐盘或锅盖）
        impact: 影响任务分解和运动规划
        suggested_action: 确认场景设计中餐盘是否需要辅助固定
        authority: C（需用户确认）
      - question: 芦笋虾仁的具体重量范围和汤汁比例？
        impact: 影响 PID 参数标定
        suggested_action: 从菜谱或试验获取数据
        authority: B（自主获取）

    # 八、证据日志
    evidence_log:
      - source: arXiv:2310.18473
        fact: PID + 关节力矩传感器可实现 ±10ml 倾倒精度
        retrieval_date: 2026-07-21
        confidence: high
      - source: arXiv:2503.17501
        fact: 灵巧手触觉反馈可处理倾倒过程中重心变化
        retrieval_date: 2026-07-21
        confidence: high
      - source: MoveIt 2 官方文档
        fact: MoveIt 2 支持 Cartesian 路径规划（computeCartesianPath）
        retrieval_date: 2026-07-21
        confidence: high
      - source: arXiv:2407.01755
        fact: 厨房场景中触觉感知可用于液体倾倒控制
        retrieval_date: 2026-07-21
        confidence: medium

    # 九、深度调研补充（2026-07-22）
    deep_research:
      decision_question: >
        在 KP200 长柄锅、固体菜品+少量汤汁、固定餐盘和原型演示条件下，
        应采用何种分层控制方案，才能在不把液体实验结论过度外推的前提下，
        兼顾演示可靠性、异常可停机性和后续升级空间？
      included_scope:
        - 倾倒轨迹生成与局部修正
        - 关节力矩/腕部 F/T 的可用性与估重边界
        - MoveIt 2、MoveIt Servo、ros2_control 的职责边界
        - 固体+汤汁倾倒的失效模式和最小验证实验
      excluded_scope:
        - KP200 未公开或未提供的具体机械尺寸、负载和 SDK 保证
        - 量产级食品卫生、整机安全认证和最终视觉识别系统
        - 直接把学术论文实验指标作为本项目验收指标
      sources:
        - id: arxiv-2310-18473-api
          url: https://export.arxiv.org/api/query?id_list=2310.18473
          retrieval_date: 2026-07-22
          fact: >
            论文摘要描述的是使用机器人自身关节力矩传感器估计容器重量变化，
            以 PID 监督水的精确倾倒；摘要报告平均约 10 ml 误差，且测试了新位置和不同抓取。
          limitation: >
            摘要对象是 water / source container 的液体倾倒，不是固体菜品、汤汁、锅具或餐盘装盘；
            因此只能证明方法方向可行，不能证明本项目的装盘成功率或防洒率。
          confidence: high
        - id: arxiv-pouring-search-api
          url: https://export.arxiv.org/api/query?search_query=all:%22robotic%20pouring%22&start=0&max_results=10
          retrieval_date: 2026-07-22
          fact: >
            相关工作覆盖视觉液流检测、音频/触觉融合、液体高度估计、饮料倾倒和倾倒洒落原因分析；
            研究对象普遍是液体或可流动物料。
          limitation: >
