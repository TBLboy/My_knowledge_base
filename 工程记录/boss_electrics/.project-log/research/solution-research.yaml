version: '0.4'
studies:
- id: RES-001
  status: complete
  problem: 为 KP200 自动翻炒锅的固体+少量汤汁出锅呈盘选择可验证、可分层实现的机器人倾倒控制路线。
  related_business_logic:
  - BL-PLATING-001
  - BL-GRASP-001
  related_tasks:
  - TASK-001
  - TASK-002
  - TASK-003
  - TASK-004
  constraints:
  - 手柄抓取点远离高温区域
  - 倾倒过程中避免与台面/灶具碰撞
  - 菜品不能洒出台面或餐盘外
  - 锅具重量（含菜品）在机器人负载范围内
  - 原型演示阶段，优先保证可靠性和可复现性
  - 项目阶段：原型验证和演示阶段，允许固定预设
  candidates:
  - id: option-a-teach-replay
    name: 纯示教轨迹 (Teach-and-Replay)
    category: position-control
    description: '人工引导机器人完成一次倾倒动作，记录关节轨迹， 在演示时直接回放。无力觉/视觉反馈。

      '
    requirement_fit:
      rating: medium
      note: 固定场景可工作，但对食物重量变化无适应能力
    integration_cost: 低 — 只需示教一次，不需要额外传感器
    maintenance_cost: 低 — 固定轨迹，无需维护
    performance:
      rating: medium-low
      note: 食物重量/质心变化时可能洒出；汤汁量不同时表现不稳定
    reliability:
      rating: medium
      note: 预设状态良好时可靠；偏离预设时失败率高
    debuggability: 高 — 轨迹固定，容易定位问题
    lock_in: 无
    safety_risk: 中 — 无力控可能导致碰撞检测不及时
    advantages:
    - 实现最简单
    - 演示可复现性高
    - 不需要额外传感器
    - 开发周期最短
    disadvantages:
    - 对食物量/类型变化零适应
    - 锅具重量不同需重新示教
    - 汤汁洒出风险随变量增加
    project_fit:
      rating: medium
      note: 可作为最小可行方案快速上线，但演示风险较高
  - id: option-b-force-pid
    name: 力感知 PID 闭环倾倒 (Force-based PID Pouring)
    category: force-control
    description: '基于"Pouring by Feel"方法，使用机器人关节力矩传感器 实时监测锅具+食物重量变化，PID 控制器根据重量损失率
      调节倾倒角度和速度。无需外部 F/T 传感器。

      '
    requirement_fit:
      rating: high
      note: 适应不同食物重量，控制倾倒速度，降低洒出风险
    integration_cost:
      rating: medium
      note: 需要接入关节力矩数据，实现重量估计算法和 PID 控制器
    maintenance_cost: 中 — 需标定不同锅具/菜品的重量基线
    performance:
      rating: high
      note: 论文证明 ±10ml 精度（液体测试），固体+汤汁效果应更优
    reliability:
      rating: high
      note: 不依赖视觉条件，在关节力矩传感器可用时始终可靠
    debuggability: 高 — PID 参数和重量估计可独立调试
    lock_in: 无 — 在 ROS 2 框架内实现，可移植
    safety_risk: 低 — 力感知可检测异常阻力（如食物卡住）
    advantages:
    - 实现在现有硬件上（关节力矩传感器）
    - 不需要额外传感器硬件
    - 主动适应食物重量变化
    - 经验证的学术方法（±10ml 精度）
    - 可检测倾倒异常（重量变化异常）
    disadvantages:
    - 需要标定空锅重量
    - 对极轻/极重食物的控制参数需调整
    - 单靠力感无法检测餐盘位置偏差
    project_fit:
      rating: high
      note: 最适合原型演示阶段的技术—硬件已有、开发量适中、可靠性高
  - id: option-c-vision-servo
    name: 视觉引导倾倒 (Vision-guided Pouring)
    category: visual-servo
    description: '使用 RGB-D 相机（顶部或腕部安装）实时监测倾倒过程。 视觉算法检测餐盘位置、食物落点、汤汁飞溅。 根据视觉反馈调整倾倒轨迹。

      '
    requirement_fit:
      rating: medium
      note: 可检测餐盘位置偏差和飞溅，但对油烟/遮挡敏感
    integration_cost: 高 — 需要视觉流水线、标定、实时推理
    maintenance_cost: 高 — 光照/背景变化需维护视觉模型
    performance:
      rating: medium
      note: 依赖光照、视角、油烟条件；处理延迟可能影响实时控制
    reliability:
      rating: medium-low
      note: 厨房环境（油烟、蒸汽、水渍）影响视觉稳定性
    debuggability: 中 — 视觉失败需要区分环境/算法/标定问题
    lock_in: 低 — 可基于 OpenCV 等开源方案
    safety_risk: 低 — 被动感知，不增加机械风险
    advantages:
    - 可检测餐盘位置偏差并补偿
    - 可发现飞溅并及时调整
    - 可与力控方案互补
    disadvantages:
    - 对厨房油烟/蒸汽/光照敏感
    - 实时视觉处理增加计算负载
    - 延迟可能影响倾倒控制稳定性
    - 原型阶段视觉环境可能变化
    project_fit:
      rating: low-medium
      note: 适合作为补充而非主力方案；原型阶段稳定视觉环境不易保证
  - id: option-d-hybrid-force-vision
    name: 力+视觉融合倾倒 (Hybrid Force-Visual Pouring)
    category: hybrid
    description: '力控为主、视觉为辅的双通道方案。 主控制回路基于关节力矩传感器的重量反馈， 视觉作为辅助确认餐盘位置和检测异常飞溅。

      '
    requirement_fit:
      rating: high
      note: 兼具力控的鲁棒性和视觉的异常检测能力
    integration_cost: 高 — 需要同时实现力控和视觉流水线
    maintenance_cost: 中高 — 两个子系统均需维护
    performance:
      rating: high
      note: 双通道冗余，一组失效时另一组可降级运行
    reliability:
      rating: high
      note: 即使视觉失效，力控通道仍可独立完成倾倒
    debuggability: 中 — 交互问题需要判断哪个通道出错
    lock_in: 低
    safety_risk: 低 — 有冗余感知
    advantages:
    - 最稳健的方案
    - 力控通道独立工作，视觉提供额外安全保障
    - 可为后续智能化升级（如自适应倾倒）提供基础
    disadvantages:
    - 开发周期最长
    - 系统复杂度高
    - 原型阶段可能过度设计
    project_fit:
      rating: medium
      note: 适合最终系统，原型阶段可能过度工程化
  - id: option-e-tactile-dexterous
    name: 灵巧手触觉反馈倾倒 (Tactile Dexterous Hand Pouring)
    category: tactile-control
    description: '利用灵巧手指尖触觉传感器感知抓取力和滑动， 在倾倒过程中动态调整抓取力和手腕姿态。 参考 Shear-based Grasp Control
      (arXiv:2503.17501)。

      '
    requirement_fit:
      rating: medium-high
      note: 充分发挥灵巧手能力，但需要触觉传感器硬件
    integration_cost: 高 — 需要触觉传感器集成和标定
    maintenance_cost: 高 — 触觉传感器磨损/标定维护
    performance:
      rating: high
      note: 精细抓取控制，适应重心变化
    reliability:
      rating: medium
      note: 触觉传感器在厨房环境（油污）下的可靠性需验证
    debuggability: 中 — 触觉信号解读需要专业知识
    lock_in: 中 — 触觉传感器型号可能绑定
    safety_risk: 低 — 精细力控可防止抓取损伤
    advantages:
    - 发挥灵巧手全部潜力
    - 最接近人类操作的精细度
    - 可检测滑移并即时调整
    disadvantages:
    - 需要触觉传感器硬件和驱动
    - 高油污环境对触觉传感器的挑战
    - 开发周期长，原型阶段风险较大
    project_fit:
      rating: low-medium
      note: 适合后期精细化阶段，原型阶段优先保证基本功能可靠
  strategy: spike-first
  recommendation:
    primary:
      id: option-b-force-pid
      name: 力感知 PID 闭环倾倒
      strategy: wrapper-adapter
      rationale: '综合考虑原型演示阶段定位、现有硬件能力（关节力矩传感器 + 灵巧手）、 开发周期和演示可靠性，推荐以力感知 PID 闭环倾倒作为主方案。

        理由： 1. 充分利用现有硬件——关节力矩传感器在所有 7-DOF 机器人上标配 2. 不需要额外传感器硬件投入 3. 经验证的学术方案（Pouring
        by Feel, ±10ml 精度） 4. 主动适应食物重量变化，降低演示风险 5. 开发量适中（PID 控制器 + 重量估计算法），适合原型阶段
        6. 可与后续视觉/触觉方案叠加演进

        实现路径： - Phase 1: 示教空锅倾倒轨迹，记录关节角度序列 - Phase 2: 集成关节力矩传感器，实现空锅重量基线标定 - Phase
        3: 实现 PID 重量反馈控制器，在示教轨迹基础上实时调节倾倒速度 - Phase 4: 加入食物测试，标定不同食物重量的 PID 参数 - Phase
        5: 加入异常检测（重量变化异常 → 停止/提示）

        '
    fallback:
      id: option-a-teach-replay
      name: 纯示教轨迹
      strategy: direct-use
      rationale: '如果力控集成遇到不可预见困难（如关节力矩传感器数据访问受限、 力矩噪声过大、实时性不满足），退回到纯示教轨迹方案。 此时必须确保：
        1. 每次演示的食物量和类型完全一致 2. 锅具位置和姿态精确重复 3. 餐盘位置固定 4. 留有充足的安全裕度

        '
    future_evolution:
    - id: option-d-hybrid-force-vision
      trigger: '力控方案稳定运行后，增加视觉作为辅助通道。 主要解决餐盘位置偏差和飞溅检测两个痛点。

        '
      effort: medium
    - id: option-e-tactile-dexterous
      trigger: '触觉传感器硬件就绪且厨房环境适应性验证通过后， 增加灵巧手触觉反馈，提升抓取精细度和安全边界。

        '
      effort: high
  conditions:
  - 先完成锅把抓取确认 Spike，再启动倾倒反馈 Spike。
  - 保留固定场景示教轨迹作为可回退基线。
  - id: S0-interface
    action: 记录关节位置、速度、力矩/effort、控制周期和通信时间戳；验证掉线/延迟行为
    pass: 接口可读、时间戳单调、更新率/延迟有统计结果
  - id: S1-empty-pan
    action: 空锅在 3 个抓取重复、3 个倾角段运行；建立重力/摩擦/姿态基线
    pass: 估计信号重复性和异常阈值可计算
  - id: S2-known-load
    action: 加入已知质量的非食品安全模拟物，分 3 个质量档重复倾倒
    pass: 质量趋势单调，局部修正不会造成振荡或超限
  - id: S3-liquid
    action: 使用可控液体验证论文方法在本机上的误差和延迟
    pass: 形成项目实测指标；不直接采用论文 ±10 ml 作为门槛
  - id: S4-solid-plus-sauce
    action: 使用近似芦笋虾仁的固体+少量汤汁，记录卡料、洒落、落盘完整性和盘位变化
    pass: 形成演示场景成功率和失败分类；若观测不足，维持保守回放+人工确认
  contrary_evidence:
  - id: finding-liquid-to-solid-extrapolation
    classification: implementation-drift
    statement: '原调研将“液体实验约 ±10 ml”写成固体+汤汁项目性能依据，证据强度不足；应改为方向性参考， 项目性能必须通过实际锅具和菜品实验建立。

      '
  - id: finding-moveit-force-boundary
    classification: traceability-gap
    statement: '原调研未清晰区分 MoveIt 轨迹/伺服层与底层 effort/torque/F-T 控制层； 后续工程说明必须显式定义接口所有权、更新率、时延、限幅和停机责任。

      '
  - id: finding-solid-food-observability
    classification: missing-test
    statement: '仅凭重量变化不能可靠判定固体菜块是否卡在锅沿、是否已全部落盘或是否发生局部洒落； 必须增加落料/卡料/盘位异常的可观察信号或保守状态机。

      '
  - 液体论文中的 ±10ml 结果不能直接作为固体+汤汁装盘性能承诺。
  - MoveIt 2 规划/伺服与底层 effort/torque/F-T 控制边界必须在工程说明中明确。
  confidence: 0.65
  decision_ref: DEC-001
