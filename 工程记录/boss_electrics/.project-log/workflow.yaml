version: '0.4'
mode: prototype
current_phase: business-clarification
active_goal: GOAL-001
phase_order:
- business-intent
- business-clarification
- requirement-baseline
- solution-research
- architecture-decision
- task-decomposition
- engineering-spec
- implementation
- verification
- alignment
- retrospective
- distillation
phases:
  business-intent:
    status: completed
    gate_status: passed
    required_artifacts: []
    exit_conditions:
    - goal and target outcome are stated
    evidence:
    - .project-log/goals/active-goal.yaml
  business-clarification:
    status: active
    gate_status: open
    required_artifacts:
    - .project-log/business-logic/atoms.yaml
    - .project-log/business-logic/clarification.yaml
    exit_conditions:
    - functional and technical behavior are recorded
    - blocking conflicts are absent
    evidence:
    - .project-log/business-logic/clarification.yaml
    - .project-log/tasks/task-list.yaml
    notes: 已进入两个仓库的业务逻辑澄清；第一轮代码事实地图完成，业务规则与代码承载仍需逐条对齐。
  requirement-baseline:
    status: completed
    gate_status: passed
    required_artifacts:
    - .project-log/requirements/baseline.yaml
    exit_conditions:
    - scope and exclusions are explicit
    - active atoms have acceptance criteria
    evidence:
    - .project-log/requirements/baseline.yaml
    - .project-log/requirements.md
  solution-research:
    status: reopened
    gate_status: open
    required_artifacts:
    - .project-log/research/solution-research.yaml
    exit_conditions:
    - material technical choices have evidence or are explicitly not required
    evidence:
    - .project-log/research/solution-research.yaml
    notes: 倾倒控制研究和 V1/V2 业务边界仍有效；因代码事实暴露业务承载未知，先回到 business-clarification，再恢复技术选型和 Spike。
  architecture-decision:
    status: pending
    gate_status: not-evaluated
    required_artifacts:
    - .project-log/architecture/architecture.yaml
    exit_conditions:
    - ownership interfaces data and failure boundaries are sufficient for decomposition
    evidence: []
  task-decomposition:
    status: pending
    gate_status: not-evaluated
    required_artifacts:
    - .project-log/tasks/task-list.yaml
    exit_conditions:
    - next ready task can be selected mechanically
    - in-scope atoms are covered or intentionally deferred
    evidence: []
  engineering-spec:
    status: pending
    gate_status: not-evaluated
    required_artifacts:
    - .project-log/specs
    exit_conditions:
    - non-trivial ready tasks have implementation-ready specs
    evidence: []
  implementation:
    status: pending
    gate_status: not-evaluated
    required_artifacts: []
    exit_conditions:
    - planned outputs exist
    - deviations are recorded
    evidence: []
  verification:
    status: pending
    gate_status: not-evaluated
    required_artifacts:
    - .project-log/verification/evidence.yaml
    exit_conditions:
    - completion conditions have evidence or exact limitations are recorded
    evidence: []
  alignment:
    status: pending
    gate_status: not-evaluated
    required_artifacts:
    - .project-log/alignment/findings.yaml
    exit_conditions:
    - material business-code-test differences are resolved assigned or accepted
    evidence: []
  retrospective:
    status: pending
    gate_status: not-evaluated
    required_artifacts:
    - .project-log/retrospective/retrospective.yaml
    exit_conditions:
    - concrete workflow improvements are recorded
    evidence: []
  distillation:
    status: pending
    gate_status: not-evaluated
    required_artifacts:
    - .project-log/distillation/candidates.yaml
    exit_conditions:
    - lessons are classified without silently becoming permanent rules
    evidence: []
open_gates:
- V1 业务原子与两个仓库代码行为完成双向对齐
- 锅把抓取确认、倾倒完整性和暂停恢复语义澄清
- 两仓库源码/deb/overlay 交付边界确认
- 技术选型批准前不得修改产品代码
return_edges:
- from: solution-research
  to: business-clarification
  reason: 第一轮代码接管暴露 V1 业务语义、接口契约和现有实现之间存在缺失与未知，需要先完成双向澄清。
- from: implementation
  to: business-clarification
  reason: implementation exposed product ambiguity
- from: verification
  to: implementation
  reason: acceptance evidence failed
- from: alignment
  to: business-clarification
  reason: authoritative behavior conflict
- from: alignment
  to: implementation
  reason: implementation or test drift
last_updated: '2026-07-28'
