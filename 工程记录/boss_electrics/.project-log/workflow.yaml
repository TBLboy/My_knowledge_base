version: '0.4'
mode: prototype
current_phase: solution-research
active_goal: GOAL-001
phase_order:
- business-intent
- business-clarification
- requirement-baseline
- solution-research
- architecture-decision
- task-decomposition
- engineering-spec
- implementation
- verification
- alignment
- retrospective
- distillation
phases:
  business-intent:
    status: completed
    gate_status: passed
    required_artifacts: []
    exit_conditions:
    - goal and target outcome are stated
    evidence:
    - .project-log/goals/active-goal.yaml
  business-clarification:
    status: completed
    gate_status: passed
    required_artifacts:
    - .project-log/business-logic/atoms.yaml
    - .project-log/business-logic/clarification.yaml
    exit_conditions:
    - functional and technical behavior are recorded
    - blocking conflicts are absent
    evidence:
    - .project-log/business-logic/clarification.yaml
    notes: C 级未知项已保留并转入 open questions；不代表已获得用户答案。
  requirement-baseline:
    status: pending
    gate_status: not-evaluated
    required_artifacts:
    - .project-log/requirements/baseline.yaml
    exit_conditions:
    - scope and exclusions are explicit
    - active atoms have acceptance criteria
    evidence: []
  solution-research:
    status: active
    gate_status: open
    required_artifacts:
    - .project-log/research/solution-research.yaml
    exit_conditions:
    - material technical choices have evidence or are explicitly not required
    evidence:
    - .project-log/research/solution-research.yaml
    notes: 研究产物完成，等待用户审阅推荐方案和 C 级问题。
  architecture-decision:
    status: pending
    gate_status: not-evaluated
    required_artifacts:
    - .project-log/architecture/architecture.yaml
    exit_conditions:
    - ownership interfaces data and failure boundaries are sufficient for decomposition
    evidence: []
  task-decomposition:
    status: pending
    gate_status: not-evaluated
    required_artifacts:
    - .project-log/tasks/task-list.yaml
    exit_conditions:
    - next ready task can be selected mechanically
    - in-scope atoms are covered or intentionally deferred
    evidence: []
  engineering-spec:
    status: pending
    gate_status: not-evaluated
    required_artifacts:
    - .project-log/specs
    exit_conditions:
    - non-trivial ready tasks have implementation-ready specs
    evidence: []
  implementation:
    status: pending
    gate_status: not-evaluated
    required_artifacts: []
    exit_conditions:
    - planned outputs exist
    - deviations are recorded
    evidence: []
  verification:
    status: pending
    gate_status: not-evaluated
    required_artifacts:
    - .project-log/verification/evidence.yaml
    exit_conditions:
    - completion conditions have evidence or exact limitations are recorded
    evidence: []
  alignment:
    status: pending
    gate_status: not-evaluated
    required_artifacts:
    - .project-log/alignment/findings.yaml
    exit_conditions:
    - material business-code-test differences are resolved assigned or accepted
    evidence: []
  retrospective:
    status: pending
    gate_status: not-evaluated
    required_artifacts:
    - .project-log/retrospective/retrospective.yaml
    exit_conditions:
    - concrete workflow improvements are recorded
    evidence: []
  distillation:
    status: pending
    gate_status: not-evaluated
    required_artifacts:
    - .project-log/distillation/candidates.yaml
    exit_conditions:
    - lessons are classified without silently becoming permanent rules
    evidence: []
open_gates:
- 用户审阅固定场景 MVP
- C 级开放问题确认
- 锅把抓取 Spike
return_edges:
- from: implementation
  to: business-clarification
  reason: implementation exposed product ambiguity
- from: verification
  to: implementation
  reason: acceptance evidence failed
- from: alignment
  to: business-clarification
  reason: authoritative behavior conflict
- from: alignment
  to: implementation
  reason: implementation or test drift
last_updated: '2026-07-28'
