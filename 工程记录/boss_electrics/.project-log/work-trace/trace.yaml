  context: 需要把用户补充的 V1 流程继续映射到两个仓库的实际接口和执行能力。
  hypothesis: 若先确认感知接收、路径录制和底盘协同的真实边界，再提出业务决策，能够避免把现有通用能力误认为完整 V1 实现。
