- id: TRACE-013
  task_id: TASK-013
  timestamp: '2026-07-30'
  context: 现有路径录制能力绕过 RobotDriver，且目标 Driver 的当前法兰位姿和 MoveCartesian 运行时语义尚未实测；但法兰增量的资产格式和 SE(3) 展开数学可独立实现并验证。
  hypothesis: 将离线轨迹资产严格限定为版本化 spatial_only/flangeInBase 增量，并只实现 T_current @ Delta_i 展开，可为后续 Skill 提供可验证输入，同时不提前假设 Driver、ROS 或硬件行为。
  decision_ref: DEC-011
  action: 在 robot_motion_executor 实体层新增 FlangeDeltaTrajectory，校验 frame、单位、RPY 顺序、参考系、连续索引、有限数值与 identity 首增量；为平移/转动复合、schema 拒绝和变换往返编写单元测试。
  expected_result: 轨迹资产一旦接入运行时，Skill 可只负责获取当前法兰位姿和把已展开的绝对航点交给现有 RobotDriver 链路；不再把格式/数学歧义混入 ROS 执行路径。
  observation: 10 项定向测试、模块编译和 diff 检查通过；当前模块没有 ROS、Driver、xCore 或硬件依赖。
  actual_result: 离线轨迹基础完成；正式 Skill、真实轨迹资产和实机 replay spike 仍依赖目标 Driver 运行时证据，TASK-013 保持 blocked。
  delta: 从“轨迹回放整体等待 Driver 验证”拆出为“离线资产/数学已完成，运行时接入仍显式阻塞”。
  lesson: 对示教回放，先冻结资产参考系、单位、姿态顺序和增量组合方向，才能避免运行时把数学或文件问题误归因于机器人驱动。
  next_adjustment: 获取目标 Driver 运行时证据与真实轨迹资产后，在 MotionExecutor Skill 边界接入本模块并做低速实机验证。
  evidence:
