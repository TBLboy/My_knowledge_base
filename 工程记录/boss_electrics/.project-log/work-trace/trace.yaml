- id: TRACE-001
  task_id: TASK-001
  timestamp: '2026-07-22'
  context: 原调研把液体论文指标过度外推到固体装盘，且未清晰划分 MoveIt 与底层力控边界。
  hypothesis: 分层控制和 Spike-first 路线能降低固体菜品与未知接口带来的风险。
  decision_ref: DEC-001
  action: 补充 ArXiv、MoveIt 2 和 ros2_control 一手资料，并拆分锅把抓取确认前置任务。
  expected_result: 形成可审阅的推荐方案、回退方案和最小验证入口。
  observation: 官方资料支持组件能力，但不能证明 KP200 接口可用或固体落料必然成功。
  actual_result: 完成分层推荐、抓取确认闸门、MVP 固定场景任务链和开放问题清单。
  delta: 从直接承诺力感知 PID 改为示教基线加受限局部反馈。
  lesson: 抓取确认和菜品落盘判断必须与轨迹执行结果分开建模。
  next_adjustment: 先执行 TASK-002，再决定是否启动 TASK-003。
  evidence:
  - .project-log/research/solution-research.yaml
  - .project-log/decisions/decision-log.yaml
  knowledge_candidate: true
- id: TRACE-002
  task_id: TASK-007
  timestamp: '2026-07-28'
  context: 用户进一步明确两个仓库由团队共同开发，感知模型和底盘能力由其他小组提供，本子任务负责执行链路；同时修订了抓取确认的必选假设。
  hypothesis: 将职责边界、两个 TCP、抓取偏置、姿态保持和录制增量动作写入业务原子，能减少后续把外部能力误算成本任务实现或把技术假设误当产品规则的风险。
  decision_ref: DEC-004
  action: 更新业务原子、需求基线、决策、任务、开放问题、澄清和会话记录；将抓取确认从必经闸门修订为可选插槽。
  expected_result: 后续技术选型围绕真实 V1 流程展开，团队成员能从项目日志恢复统一口径。
  observation: 用户明确了上游移交、感知订阅、左臂抓取 TCP、锅具 TCP、底盘保持姿态、倾倒增量回放和放回/home 等流程节点；抓取确认失败回退仍待定。
  actual_result: 已更新 REQ-001 revision 2、DEC-004、BL-PLATING-001、BL-GRASP-001、TASK-004、TASK-007 及相关会话记录。
  delta: 从“抓取确认是倾倒前置安全闸门”改为“抓取确认暂留可选步骤插槽”；从“感知/底盘由本任务负责”改为“感知组和底盘组提供能力，本任务消费并协同”。
  lesson: 业务闭环应先明确跨团队输入和坐标契约，再决定接口扩展；可选能力不能在需求基线中隐式变成强制闸门。
  next_adjustment: 继续澄清两个 TCP 与抓取偏置、倾倒目标点、录制动作的坐标和版本契约，再进入技术选型。
  evidence:
  - 用户于 2026-07-28 补充 V1 流程
  - .project-log/business-logic/atoms.yaml
  - .project-log/requirements/baseline.yaml
  knowledge_candidate: false
