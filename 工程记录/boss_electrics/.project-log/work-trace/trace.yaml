- id: TRACE-012
  task_id: TASK-012
  timestamp: '2026-07-30'
  context: V1 需要在锅把、底盘和餐盘的分阶段外部输入之间保留任务，但现有 ScenePerception、底盘接口和倾倒回放 Skill 尚未提供可接入的正式契约。
  hypothesis: 在单个 PanPourPolicy 内显式保存业务 phase，并把外部边界建模为 WAIT，可先验证确定的规划和坐标计算逻辑，同时避免伪造公共 ROS 接口或把未知数据解释为业务事实。
  decision_ref: DEC-013
  action: 新增并注册 PanPourPolicy；以显式更新方法接收未来适配器的锅把、餐盘和底盘状态；复用任务私有 TCP 参数和 Planner 内 WAIT/EXECUTE/COMPLETE 调度语义；为阶段推进、转换和等待边界编写单元测试。
  expected_result: Policy 按结果回调逐步推进，不要求预生成全流程；每个外部依赖未就绪时均可观测地 WAIT，且不会向 MotionExecutor 发送不受支持的目标。
  observation: 28 个定向测试和 3 个相关 ROS 包构建通过。抓取 PCA 偏置、双 TCP 法兰反解、Action 完成驱动的 phase 迁移、底盘/餐盘/回放等待和 task_type 注册均得到覆盖。
  actual_result: 动态 Policy 骨架已实现并可本地验证；完整跨组链路仍被感知字段契约、底盘生命周期接口和相对法兰回放 Skill 阻塞，任务状态保持 blocked。
  delta: 从“等待外部契约后才能开始 Policy”改为“先实现边界明确、可独立验证的 Policy 骨架，同时把缺失集成点显式保留为 WAIT”。
  lesson: 对跨组机器人流程，先实现确定性编排内核并将未知接口隔离在适配边界，可减少接口猜测导致的架构漂移；但单元测试不能替代真实 ROS/Driver/硬件验证。
  next_adjustment: 收到感知、底盘和回放接口契约后，分别接入适配器并进行 ROS 级集成验证；在现场标定前保持 configured=false。
  evidence:
  - .project-log/verification/evidence.yaml#EVID-TASK-012-001
  - kitchen_robot_home/src/dexbot_task_planner/dexbot_task_planner/policy/pan_pour/pan_pour_policy.py
  - kitchen_robot_home/src/dexbot_task_planner/test/test_pan_pour_policy.py
  knowledge_candidate: false
- id: TRACE-011
  task_id: TASK-010
  timestamp: '2026-07-30'
  context: 现有 Planner 将 Policy 返回的 None 无条件解释为任务成功，但 V1 在底盘移动和餐盘进入视野之间必须保留任务并等待外部状态。
  hypothesis: 在 Planner 私有域将 EXECUTE、WAIT、COMPLETE 显式建模，可保持静态 Policy 兼容并避免通过伪造保持动作来等待。
  decision_ref: DEC-015
  action: 新增 PolicyDecision 与旧返回值适配器；在 _on_tick 中分支处理等待、执行、完成和非法返回；增加纯实体与 Planner 调度分支测试。
  expected_result: WAIT 不发送 ExecuteTask、不清理 active task，COMPLETE 保持旧成功清理语义，旧 Policy 无需修改。
  observation: 12 项定向测试通过，验证了 WAIT/EXECUTE/COMPLETE 与非法返回；ROS 接口包和 Planner 包构建通过。
  actual_result: Planner 已获得动态多阶段 Policy 所需的等待语义，下一阶段可在不改公共 ROS 接口的前提下实现参数和坐标变换基础模块。
  delta: 从使用 None 同时表示“没有下一步”和“任务结束”，改为使用类型化私有调度结果表达三种语义。
  lesson: 定时器调度器的空闲等待与业务任务完成必须独立表达；兼容适配器可避免为新任务重写所有存量 Policy。
  next_adjustment: 执行 TASK-011，先分离参数读取和 SE(3) 计算，再接入 PanPourPolicy。
  evidence:
  - .project-log/verification/evidence.yaml#EVID-TASK-010-001
  - kitchen_robot_home/src/dexbot_task_planner/dexbot_task_planner/entities/policy_decision.py
  - kitchen_robot_home/src/dexbot_task_planner/test/test_task_planner_decision_dispatch.py
  knowledge_candidate: false
