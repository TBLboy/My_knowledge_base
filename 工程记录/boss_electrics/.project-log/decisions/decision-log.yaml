- id: DEC-001
  title: 倾倒控制采用分层、受限反馈路线
  category: technical
  status: proposed
  authority: B
  user_approval: pending
  related_tasks:
  - TASK-001
  - TASK-003
  related_business_logic:
  - BL-PLATING-001
  context: '论文证据主要针对液体倾倒，不能直接证明固体+汤汁装盘；MoveIt 2 负责规划/伺服边界， ros2_control 提供通用接口和控制器能力，但
    KP200 的真实 effort/F-T 接口与时延未确认。

    '
  hypothesis: '将原“力感知 PID 闭环倾倒”修正为“示教轨迹基线 + 受限重量/力矩反馈局部修正”， 在接口和低速 Spike 通过前不承诺全轨迹力控；纯示教轨迹作为带安全限幅和停机状态机的回退。

    '
  options:
  - name: 推荐方案
    benefits:
    - '将原“力感知 PID 闭环倾倒”修正为“示教轨迹基线 + 受限重量/力矩反馈局部修正”， 在接口和低速 Spike 通过前不承诺全轨迹力控；纯示教轨迹作为带安全限幅和停机状态机的回退。

      '
    costs: []
    risks:
    - KP200 无可用且稳定的力矩/effort/F-T 信号
    - 估重在已知负载 Spike 中不单调或重复性不足
    - 局部修正引发姿态振荡、超力矩或碰撞风险
    - 固体卡料和落盘完整性无法由现有信号观测
  - name: 回退方案
    benefits:
    - 保留安全限幅、超时、急停和人工确认
    costs:
    - 适应性较低
    risks:
    - 固定轨迹对状态变化敏感
  decision: '将原“力感知 PID 闭环倾倒”修正为“示教轨迹基线 + 受限重量/力矩反馈局部修正”， 在接口和低速 Spike 通过前不承诺全轨迹力控；纯示教轨迹作为带安全限幅和停机状态机的回退。

    '
  reason_summary:
  - '论文证据主要针对液体倾倒，不能直接证明固体+汤汁装盘；MoveIt 2 负责规划/伺服边界， ros2_control 提供通用接口和控制器能力，但 KP200
    的真实 effort/F-T 接口与时延未确认。

    '
  conditions:
  - KP200 无可用且稳定的力矩/effort/F-T 信号
  - 估重在已知负载 Spike 中不单调或重复性不足
  - 局部修正引发姿态振荡、超力矩或碰撞风险
  - 固体卡料和落盘完整性无法由现有信号观测
  action: task-pouring-validation-spike
  expected_result: 在真实接口和安全 Spike 前不承诺超出证据范围的全轨迹自适应控制。
  reversal_plan: 若接口、重复性或安全限幅验证不通过，回退到固定场景示教轨迹并暂停反馈闭环扩展。
