- id: DEC-004
  title: V1 抓取确认暂留为可选步骤插槽
  category: business
  status: superseded
  authority: C
  user_approval: superseded_by_user_clarification
  related_tasks:
  - TASK-007
  - TASK-004
  related_business_logic:
  - BL-GRASP-001
  - BL-PLATING-001
  context: 用户于 2026-07-28 进一步澄清，左手闭合后是否通过触觉等信号确认抓取暂时不是 V1 基础流程的必需环节。
  hypothesis: 将抓取确认设计为后续可插拔能力，先完成基础抓取、提锅、底盘移动、倾倒和放回流程；避免在确认接口未定时阻塞 V1 业务闭环。
  options:
  - name: 当前 V1 采用可选插槽
    benefits:
    - 不阻塞基础闭环
    - 为后续触觉或负载判断保留扩展入口
    costs:
