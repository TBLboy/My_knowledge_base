    Executor/RobotDriver 的笛卡尔数据约定为机械臂 base frame。
  created_at: '2026-07-29'
  decision:
  - PanPourPolicy 在中心坐标系 C 下完成感知结果、抓取偏置、餐盘偏置和目标位姿计算。
  - Planner 通过固定 TCP 外参将目标 TCP 位姿转换为法兰目标位姿，业务语义统一为“控制法兰”。
  - Planner 到 Executor 的目标契约显式表示“法兰位姿，表达在 C 中”；建议增加最小类型化 FlangeMotionTarget，而不是把锅具业务字段整体下沉为
    PourTaskTarget。
  - 继续复用现有 ExecuteTask Action；旧 TaskTarget 和旧 task_type 保持兼容，V1 使用新的显式法兰目标字段/路由。
  - Executor 侧设置唯一坐标适配边界，将 T_C_F 转换为 RobotDriver 所需的 T_B_F；RobotDriver 只接收机械臂 base
    frame 下的法兰目标。
  - TCP 外参、中心标定、速度和安全限幅属于配置/执行适配职责，不由 Planner 和 Executor 重复计算。
