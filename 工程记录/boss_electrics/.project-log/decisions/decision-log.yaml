- id: DEC-003
  title: 老板电器倾倒入盘采用两版本固定场景单臂 MVP 路线
  category: technical
  status: active
  authority: C
  user_approval: approved
  related_tasks:
  - TASK-004
  - TASK-005
  related_business_logic:
  - BL-GRASP-001
  - BL-PLATING-001
  context: '2026-07-27 锅具和锅铲测试显示，锅把朝左时左手抓取和倾倒较可行；右手锅铲当前存在抓取、放置、有效辅助和碰撞风险，暂不适合作为第一版主体功能。固定场景能压缩变量，便于尽快验证任务链；模型路线当前成功率和数据成本不确定，视觉伺服适合解决锅把定位和局部对位，但不应承担菜品完整倾倒判断；录制回放适合第一版，但必须配合初始状态、碰撞/速度限制、超时、急停和失败回退。

    '
  hypothesis: '将实施拆成两个版本：V1 以锅把朝左为固定场景，由左手完成锅把识别、抓取确认、餐盘定位、移动、倾倒、必要的轻微抖动和放回原位，先打通完整闭环；V2 在 V1 闭环稳定后，再评估并加入右手锅铲抓取、放置和辅助动作。V1 不等待、不依赖右手锅铲能力。

    '
  options:
  - name: 推荐方案
    benefits:
    - 'V1 采用锅把朝左的固定场景左手单臂闭环：视觉定位锅把和餐盘，执行抓取确认、移动、倾倒、必要轻微抖动和放回原位；V2 再迭代右手锅铲辅助。

      '
    costs: []
    risks:
    - 固定场景仍存在不可接受的锅把定位漂移或餐盘位置漂移
    - 单臂在最坏负载下无法稳定抓取或试抬升
    - 录制轨迹存在碰撞、超力矩或明显洒落
    - 任务失败后无法安全回到支撑面/人工接管
    - V2 右手锅铲仍可能存在抓取不稳、动作无效或与锅沿碰撞
  - name: 回退方案
    benefits:
    - 保留安全限幅、超时、急停和人工确认
    costs:
    - 适应性较低
    risks:
    - 固定轨迹对状态变化敏感
  decision: '确定采用两版本路线。V1 以锅把朝左为固定场景，不考虑右手锅铲辅助，先由左手独立完成锅把感知结果消费、抓取、准备倾倒、底盘协同、餐盘定位、移动到倾倒位、倾倒、必要的轻微抖动、放回原位和失败接管，形成完整可重复闭环；抓取确认暂留可选插槽，不作为当前 V1 基础流程必经条件；V2 在 V1 闭环完成并稳定后，再继续迭代右手锅铲抓取、放置、辅助动作及其碰撞和落料效果。

    '
  reason_summary:
  - '锅把朝左时已观察到左手抓取和倾倒较可行；右手锅铲仍有抓取、放置、有效辅助和碰撞风险，推迟到 V2 可降低 V1 变量和交付风险。'
  - '固定场景能压缩变量，便于尽快验证任务链；感知结果订阅和录制回放适合 V1，但必须配合初始状态、TCP 标定、碰撞/速度限制、超时、急停和失败回退。'
  conditions:
  - V1 不把右手锅铲辅助作为前置条件、主体功能或验收条件
  - V1 不把抓取确认作为当前基础流程的必经前置条件
  - V2 只有在 V1 完整闭环通过后才启动
  - 固定场景仍存在不可接受的锅把定位漂移或餐盘位置漂移
  - 单臂在最坏负载下无法稳定抓取或试抬升
  - 录制轨迹存在碰撞、超力矩或明显洒落
  - 任务失败后无法安全回到支撑面/人工接管
  action: task-mvp-plating-pipeline
  expected_result: V1 先获得不依赖右手锅铲的完整可重复闭环；V2 再基于 V1 数据评估右手锅铲辅助是否带来可验证收益。
  reversal_plan: 若接口、重复性或安全限幅验证不通过，回退到固定场景示教轨迹并暂停反馈闭环扩展。
  observation: null
  actual_result: null
  outcome_status: not-observed
  lesson: null
  evidence:
