- id: DEC-005
  title: V1 倾倒点采用中心坐标系餐盘中心加 xyz 偏置
  category: business
  status: active
  authority: C
  user_approval: approved
  related_tasks:
  - TASK-007
  - TASK-008
  related_business_logic:
  - BL-PLATING-001
  context: 用户于 2026-07-28 明确 V1 倾倒点的计算方式，并要求项目所有业务操作统一使用机器人中心坐标系。
  hypothesis: 使用中心坐标系下餐盘中心加可调 xyz 偏置，可以在固定场景中稳定定义倾倒点，并避免业务逻辑绑定某一机械臂基坐标系。
  options:
  - name: 中心坐标系餐盘中心加偏置
    benefits:
    - 业务坐标统一
    - 偏置可调，便于现场微调
    - 不绑定左臂或右臂基坐标
    costs:
    - 需要维护中心坐标系到执行坐标系的转换
    risks:
    - 中心坐标系定义、发布和时间同步不准确会影响全链路
  decision: V1 倾倒点使用机器人中心坐标系 C 表达，计算公式为 pour_point_C = plate_center_C + pour_offset_C，其中 pour_offset_C 是 C 下可调的 [dx, dy, dz]；所有业务目标和中间位姿统一使用 C，机械臂基坐标仅作为底层执行转换结果。
  reason_summary:
  - 用户明确要求所有项目操作统一转换到机器人中心坐标系。
  - V1 采用中心点加偏置可压缩变量，并支持现场微调。
  conditions:
  - 明确中心坐标系的原点、轴向、发布来源和时间同步
  - 明确底层执行从中心坐标系到机械臂基坐标的转换边界
  - 偏置参数必须可记录、可版本化和可回退
  action: TASK-008
  expected_result: 形成以中心坐标系为业务事实源的接口和执行承载方案。
  reversal_plan: 若中心坐标系不能提供稳定转换，则暂停接口实现并重新评估统一坐标基准，不得静默改用某一机械臂基坐标。
  observation: null
  actual_result: null
  outcome_status: not-observed
  lesson: null
  evidence:
  - 用户于 2026-07-28 补充 V1 倾倒点和统一坐标系规则
  - .project-log/business-logic/atoms.yaml
  supersedes: []
  created_at: '2026-07-28'
  updated_at: '2026-07-28'
- id: DEC-008
  title: V1 技术承载优先采用类型化 PourTaskTarget 加现有 ExecuteTask
  category: technical
  status: proposed
  authority: C
  user_approval: pending
  related_tasks:
  - TASK-008
  - TASK-004
  related_business_logic:
  - BL-PLATING-001
  - BL-GRASP-001
  context: 现有主链已经具备 TaskPlanner、ExecuteTask、MotionExecutor、Skill、MotionPrimitive 和 RobotDriver 分层，但通用 TaskTarget、Pose3D 和现有 path_record 尚未表达 V1 的中心坐标系、两个 TCP、PCA 偏置、底盘协同和锅具 TCP 局部回放。
  hypothesis: 在现有 ExecuteTask 上增加可选的类型化 PourTaskTarget，并由 planner policy 与 executor skill 分别拥有业务编排和硬件原语转换，可以用较小边界承载 V1，同时避免通用字段语义漂移。
  options:
  - name: 复用通用 TaskTarget
    benefits:
    - 接口改动少
    costs:
    - 坐标系和阶段字段隐含在 task_type/数组位置中
    risks:
    - 团队共同开发时容易产生字段复用和坐标误解
  - name: ExecuteTask 携带 PourTaskTarget
    benefits:
    - 复用现有 action 生命周期和取消机制
    - 领域数据契约类型明确
    - 不污染通用 TaskTarget
    costs:
    - 需要同步更新接口包、planner 和 executor
    risks:
    - 属于公开接口变化，需要用户和团队共同批准并版本化
  - name: 新增独立 ExecutePourTask action
    benefits:
    - 领域边界最清晰
    costs:
    - 重复 action server 生命周期、反馈、取消和部署配置
    risks:
    - 增加双入口维护和发布复杂度
  decision: '提议采用“类型化 PourTaskTarget + 现有 ExecuteTask”方案：主仓库 TaskPlanner 负责 V1 阶段、中心坐标 C 下的目标计算和底盘阶段屏障；执行仓库 BossElectricsPourSkill 负责把目标转换为现有 MotionPrimitive；锅具 TCP 局部轨迹通过独立回放适配器执行。该决策在用户批准前保持 proposed，不修改产品代码。'
  reason_summary:
  - 现有 ExecuteTask 已是两仓库间稳定的执行边界
  - 通用 TaskTarget 不足以安全表达 V1 领域语义
  - 业务状态不应下沉到 MotionExecutor controller
  - 现有 PathRecordSkill 只有录制能力，不能直接视为锅具 TCP 局部回放契约
  conditions:
  - 用户批准接口形态和跨仓库同步变更
  - 底盘组提供最小移动完成/失败/超时接口
  - 轨迹回放先通过最小 replay spike 确认局部 TCP 语义
  - 中心坐标转换只能由单一适配模块负责，禁止业务模块各自转换
  action: TASK-008
  expected_result: 形成可实施的 V1 类型化数据契约、阶段编排和执行适配器方案。
  reversal_plan: 若现有 ExecuteTask 无法兼容领域目标或 action 版本协同成本过高，再评估独立 ExecutePourTask action；不得退回到隐式数组字段复用。
  observation: null
  actual_result: null
  outcome_status: not-observed
  lesson: null
  evidence:
  - .project-log/research/solution-research.yaml
  - .project-log/architecture/architecture.yaml
  - kitchen_robot_home/src/dexbot_interfaces/action/ExecuteTask.action
  - kitchen_robot_home/src/dexbot_interfaces/msg/TaskTarget.msg
  - robot_motion_executor/src/dexbot_motion_executor/dexbot_motion_executor/skills/path_record.py
  supersedes: []
  created_at: '2026-07-28'
  updated_at: '2026-07-28'
- id: DEC-009
  title: V1 Policy 支持多阶段动态步骤生成，不强制预生成全部步骤
  category: architecture
  status: active
  authority: B
  user_approval: not-required
  related_tasks:
  - TASK-008
  - TASK-004
  related_business_logic:
  - BL-PLATING-001
  context: |
    V1 业务逻辑中存在一个根本性的时序约束：锅把位置在任务启动时可由感知获得，但餐盘在底盘移动前不在相机视野内。
    这意味着 (1) 抓取目标、(2) 提锅到准备倾倒姿态在任务启动时可预生成，
    但 (3) 底盘移动后的倾倒点计算、(4) 锅具 TCP 平移接近、(5) 增量回放只能在底盘移动完成、餐盘进入视野后才能计算。
    现有 TestGripperPolicy/PeelAppleCsvPolicy/TestHeartPolicy 均采用一次性预生成所有步骤的模式（_cached_steps 或 _task_plan），
    但 BasePolicy 接口（select_next_goal 每次被调用、update_step_status 注入结果、_world 持续更新）并不要求预生成。
  hypothesis: |
    一个 Policy 内部通过 _phase 状态区分两段，第一阶段预生成（抓取→提锅→底盘移动），
    第二阶段在底盘移动完成后动态读取 WorldState 中的餐盘位置计算结果，可以容纳 V1 流程而不需要拆成多个 Policy 或修改 Planner 路由。
  options:
  - name: 单 Policy 多阶段动态生成
    benefits:
    - 不改 task_type 路由，不改 _initialize_policy，不改 _on_tick
    - 一个文件覆盖 V1 全流程，步骤间状态由 _phase 显式管理
    - 第二阶段可在 WAIT_PLATE 子阶段通过 hold_step 等待感知更新
    costs:
    - Policy 内部需要显式的相位状态管理，相比纯预生成多一层分支
    risks:
    - 若 Phase 2 的感知等待周期过长（plate 检测延迟 > 数秒），hold_step 空转可能增加复位复杂度
  - name: 拆为两个任务/Policy
    benefits:
    - 每个 Policy 职责更单一
    costs:
    - 需要新增 task_type、新增 StartTask 路由、两任务间状态传递和 handoff 机制
    - 当前架构没有"任务链"或"子任务"机制，需要大量改动 Planner
    risks:
    - 两任务间的抓取状态、臂位姿、底盘协同状态需要跨任务持久化，复杂度远高于单 Policy 内 _phase
  decision: |
    采用"单 Policy 多阶段动态生成"方案。
    PanPourPolicy 内部维护 _phase 状态，第一阶段从感知获取锅把位置后预生成（抓取→提锅→底盘移动）步骤列表，
    第二阶段在底盘移动完成后从 _world.objects 读取餐盘检测结果，动态计算倾倒点并生成后续步骤。
    两阶段之间的等待通过"保持当前位姿"的笛卡尔空转步骤实现，不阻塞 Planner 定时器循环。
    不改 PlannerNode、不改 _initialize_policy、不改 task_type 路由。
  reason_summary:
  - select_next_goal() 被 Planner 的 _on_tick 反复调用，每次可以返回不同逻辑生成的步骤
  - update_step_status() 在每步完成后注入 COMPLETED/FAILED，Policy 可据此感知阶段推进
  - _world（WorldState）由 PerceptionReceiver 持续更新，Policy 在任何 _on_tick 时刻都能读到最新感知结果
  - 现有架构中 PeelApplePolicy（10000 步运动学生成）和 TestHeartPolicy（场景感知 plan()）已展示两种不同的步骤生成时机，本例是第三种阶段混合生成
  conditions:
  - Phase 2 的 plate 检测依赖感知组模型将餐盘结果发布到 WorldState.objects
  - 若底盘移动后 plate 在合理时间内未出现，Policy 必须设置超限终止而非无限 hold
  - 参数（抓取偏置、倾倒偏置、TCP 位姿）必须参数化注入，不能在 Policy 内硬编码
  - 后续加入异常处理时，Phase 1 和 Phase 2 各自需要独立的失败回退逻辑，统一在 _phase 矩阵中管理
  action: TASK-008 中将该模式纳入技术选型输出
  expected_result: V1 的 Policy 以单文件、两阶段模式承载全流程，不改 Planner 路由；代码可读性和扩展性满足团队共同开发需求。
  reversal_plan: 若 Policy 内部 _phase 分支复杂度超出可控范围（超过 5 个相位状态或大量跨阶段共享变量），则重新评估是否需要拆为多个 Policy 并引入任务链机制。
  observation: null
  actual_result: null
  outcome_status: not-observed
  lesson: null
  evidence:
  - kitchen_robot_home/src/dexbot_task_planner/dexbot_task_planner/policy/test_gripper_policy.py
  - kitchen_robot_home/src/dexbot_task_planner/dexbot_task_planner/policy/test_heart_policy.py
  - kitchen_robot_home/src/dexbot_task_planner/dexbot_task_planner/policy/peel_apple_policy.py
  - kitchen_robot_home/src/dexbot_task_planner/dexbot_task_planner/policy/base_policy.py
  - kitchen_robot_home/src/dexbot_task_planner/dexbot_task_planner/task_planner_node.py
  - .project-log/business-logic/clarification.yaml
  supersedes: []
  created_at: '2026-07-29'
  updated_at: '2026-07-29'
- id: DEC-002
  title: 锅把抓取确认作为倾倒安全闸门
  category: technical
  status: superseded
  authority: B
  user_approval: superseded_by_user_clarification
  related_tasks:
  - TASK-002
  - TASK-004
  related_business_logic:
  - BL-GRASP-001
  context: '锅具承受的不仅是重力，还包括长柄倾覆力矩、转运加速度、倾倒时质心变化和卡料冲击； 单一闭合到位或电机电流信号不足以证明稳定抓取。固定 KP200
    原型优先评估专用锅把适配夹具/软衬垫， 灵巧手多指包络作为软件主路径，双臂协同仅在负载/力矩评估证明单手不足时启用。

    '
  hypothesis: '将锅把抓取确认独立为倾倒动作的前置安全闸门；采用“视觉定位 + 多指/专用夹具抓取 + 接触/负载联合确认 + 受控微抬升”的流程。未输出
    grasp_confirmed 时，不得转运锅具或进入倾倒。

    '
  options:
  - name: 推荐方案
    benefits:
    - '将锅把抓取确认独立为倾倒动作的前置安全闸门；采用“视觉定位 + 多指/专用夹具抓取 + 接触/负载联合确认 + 受控微抬升”的流程。未输出 grasp_confirmed
      时，不得转运锅具或进入倾倒。

      '
    costs: []
    risks:
    - 锅把无法被可靠定位或温度不满足接近条件
    - 灵巧手/夹具无法提供可重复接触和承载确认
    - 微抬升验证无法在安全支撑面附近执行
    - 单手负载/倾覆力矩超出安全余量且未提供合格双臂方案
  - name: 回退方案
    benefits:
    - 保留安全限幅、超时、急停和人工确认
    costs:
    - 适应性较低
    risks:
    - 固定轨迹对状态变化敏感
  decision: '原方案不再作为当前 V1 必选规则；抓取确认保留为可插拔步骤，是否启用、判断信号和失败回退另行确定。

    '
  reason_summary:
  - '锅具承受的不仅是重力，还包括长柄倾覆力矩、转运加速度、倾倒时质心变化和卡料冲击； 单一闭合到位或电机电流信号不足以证明稳定抓取。固定 KP200 原型优先评估专用锅把适配夹具/软衬垫，
    灵巧手多指包络作为软件主路径，双臂协同仅在负载/力矩评估证明单手不足时启用。

    '
  conditions:
  - 锅把无法被可靠定位或温度不满足接近条件
  - 灵巧手/夹具无法提供可重复接触和承载确认
  - 微抬升验证无法在安全支撑面附近执行
  - 单手负载/倾覆力矩超出安全余量且未提供合格双臂方案
  action: task-pan-handle-grasp-spike
  expected_result: 在真实接口和安全 Spike 前不承诺超出证据范围的全轨迹自适应控制。
  reversal_plan: 若接口、重复性或安全限幅验证不通过，回退到固定场景示教轨迹并暂停反馈闭环扩展。
  observation: null
  actual_result: null
  outcome_status: not-observed
  lesson: null
