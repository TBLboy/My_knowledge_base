atoms:
- id: BL-PLATING-001
  title: 倾倒入盘
  kind: flow
  domain: plating
  status: active
  priority: high
  risk: critical
  authority: user-confirmed
  source:
    type: user-statement
    reference: /home/tbl/Project/My_knowledge_base/学习记录/2026.07.27/今日任务.md; 用户于 2026-07-28 确认两版本实施方案
  description: 机器人从自动翻炒锅中取出炒好的菜，倾倒入餐盘；V1 先以锅把朝左为固定场景，由左手完成不含右手锅铲辅助的完整闭环，V2 再迭代右手锅铲辅助
  actors:
  - 双臂移动机器人
  - 左臂控制与执行开发团队
  - 感知组模型提供方
  - 底盘控制组
  trigger: 上一个环节任务完成并移交，或本子任务被单独启动
  preconditions:
  - 上游环节通常已完成场景检查；本子任务保留可选的场景检查占位
  - 锅盖已打开并放置到安全位置
  - V1 测试场景中锅把朝左，初始锅具和餐盘位置已定义
  - 感知组模型已提供并发布锅把相关感知信息
  - 左臂末端 TCP 已完成标定，抓取姿态和锅具 TCP 约定已定义
  - 机器人中心坐标系已定义，并作为 V1 所有业务目标和中间位姿的统一表达坐标系
  - 灵巧手闭合所需关节角度和力矩参数可由执行团队提供
  inputs:
  - 感知组输出的锅把中心、抓取点、主轴方向及有效性信息
  - 沿锅把主轴 PCA 向量的抓取偏置参数；偏置可调，用于微调抓取效果
  - 左臂抓取 TCP 的位置、姿态参数和固定抓取姿态
  - 锅具 TCP 的位置、姿态参数及转换关系
  - 灵巧手闭合关节角度和力矩参数
  - 餐盘中心点在机器人中心坐标系下的坐标
  - 倾倒点相对于机器人中心坐标系 xyz 的三个可调偏置量
  rule:
    statement: >-
      V1 由上游环节移交后开始；场景检查仅保留为可选占位。任务订阅感知组提供的锅把中心、抓取点和主轴方向，不负责感知模型开发；根据抓取点沿锅把主轴 PCA 向量施加可调偏置，计算左臂抓取目标，控制参数化抓取 TCP 以固定姿态到达目标并闭合灵巧手。当前 V1 初版不执行抓取确认，闭合后直接进入提锅和准备倾倒流程；抓取确认作为后续迭代预留，不属于当前 V1 基础闭环。左手抓住锅把后提锅进入准备倾倒姿态并保持，底盘移动到餐盘相对左臂的倾倒工作区域，移动期间左臂保持该姿态。随后得到餐盘中心点在机器人中心坐标系 C 下的坐标，并叠加相对于 C 的可调 xyz 偏置，计算倾倒点：pour_point_C = plate_center_C + pour_offset_C。基于参数化锅具 TCP 与该倾倒点的转换控制左臂平移到倾倒位置，保持 TCP 姿态不变，在锅具 TCP 坐标系下回放预先录制的增量倾倒动作。所有业务目标和中间位姿统一在 C 下表达；只有底层执行确有需要时，才转换到机械臂基坐标系。放回锅具、张开灵巧手和恢复 home 的位置保留为后续流程位置，具体规则或轨迹后续确定；V1 不依赖右手锅铲辅助，V2 再单独评估右手锅铲动作。V1 当前只打通动作流程，不增加落料完整性验收和异常处理。
  outputs:
  - 菜品装入餐盘
  - 空锅（可能残留少量汤汁）
  - V1 任务链结果和失败分类记录
  side_effects:
  - 锅具可能残留油渍或高温
  - 餐盘位置可能因菜品重量轻微移动
  - 台面可能有溅出的汤汁
  exceptions:
  - 当前 V1 不实现异常分支，仅预留异常处理扩展位置
  failure_handling:
  - 当前 V1 不实现自动重试、回退或人工接管逻辑；后续版本单独定义
  invariants:
  - 机器人双臂不能进入高温区域（锅底正下方/灶具表面）
  - 抓取点必须是手柄非高温区域
  - 倾倒过程中锅体不能与台面、灶具或其他设备碰撞
  - 底盘移动期间左臂保持准备倾倒姿态，不主动改变锅具 TCP 姿态
  - 倾倒定位阶段保持锅具 TCP 姿态不变，仅按目标转换进行平移
  - 所有业务目标、中间位姿和偏置统一以机器人中心坐标系表达，不以任一机械臂基坐标系作为业务事实源
  acceptance:
  - id: BL-PLATING-001-AC-001
    given: 自动翻炒锅已完成烹饪，锅盖已打开，餐盘就位
    when: 机器人执行倾倒动作
    then: V1 不对菜品完整落盘或洒落进行自动验收；该项留作后续版本验收规则
    method: null
    evidence: null
    status: not-verified
  - id: BL-PLATING-001-AC-002
    given: V1 固定场景中锅把朝左，锅盖已打开，餐盘已就位，且感知结果和抓取参数有效
    when: 机器人仅使用左手执行抓锅、闭合、提锅、移动、倾倒、必要的轻微抖动和放回原位
    then: V1 只要求动作链按顺序执行到既定节点；当前不执行抓取确认，不加入落料验收、异常处理或右手锅铲辅助
    method: null
    evidence: null
    status: not-verified
  - id: BL-PLATING-001-AC-003
    given: 上游环节已移交任务，感知组已提供有效的锅把中心、抓取点和主轴方向
    when: V1 执行抓取准备
    then: 系统订阅并使用感知结果，根据抓取点沿锅把 PCA 主轴的可调偏置计算左臂抓取 TCP 目标；感知模型开发不属于本子任务
    method: null
    evidence: null
    status: not-verified
  - id: BL-PLATING-001-AC-004
    given: 左手已抓住锅把并进入准备倾倒姿态
    when: 底盘移动到餐盘对应工作区域
    then: 左臂保持准备倾倒姿态，底盘移动完成后再进行餐盘定位和倾倒目标计算
    method: null
    evidence: null
    status: not-verified
  - id: BL-PLATING-001-AC-005
    given: 倾倒目标点已确定，锅具 TCP 转换关系有效
    when: 左臂移动到倾倒位置并执行倾倒动作
    then: 移动阶段保持锅具 TCP 姿态不变，倾倒阶段可播放预先录制的增量动作
    method: null
    evidence: null
    status: not-verified
  - id: BL-PLATING-001-AC-006
    given: 已获得餐盘中心点在机器人中心坐标系 C 下的坐标，且已配置 pour_offset_C=[dx, dy, dz]
    when: 系统计算 V1 倾倒目标点
    then: 倾倒目标点为 pour_point_C = plate_center_C + pour_offset_C；业务目标和中间位姿继续使用 C 表达
    method: null
    evidence: null
    status: not-verified
  dependencies: []
  baseline_refs:
  - REQ-001
  decision_refs:
  - DEC-001
  - DEC-003
  implementation_refs: []
  test_refs: []
  supersedes: []
  notes: 'V1/V2 版本边界由用户于 2026-07-28 确认；V1 不包含右手锅铲辅助，V2 作为独立迭代。2026-07-28 用户进一步确认感知模型由感知组提供，本子任务只订阅结果；当前 V1 初版不执行抓取确认、落料验收和异常处理，后续再考虑；底盘移动由底盘组支持；倾倒动作采用锅具 TCP 坐标系下的录制增量动作回放；抓取偏置沿锅把 PCA 主轴，TCP 位姿参数化，放回/home 后续确定。2026-07-28 用户确认倾倒点等于机器人中心坐标系下的餐盘中心点加 xyz 可调偏置，所有业务坐标统一使用机器人中心坐标系。旧 ID: atom-plating-pour。'
  created_at: '2026-07-22'
  updated_at: '2026-07-28'
  last_verified_at: null

- id: BL-TRAJECTORY-001
  title: GUI 增量法兰轨迹录制
  kind: flow
  domain: trajectory_recording
  status: candidate
  priority: high
  risk: high
  authority: user-confirmed
  source:
    type: user-statement
    reference: 用户于 2026-08-05 确认 GUI 增量轨迹录制流程
  description: 操作员通过 GUI 的机械按钮按下/松开动作录制法兰在 flangeInBase 下的运动，并在结束后自动完成后处理，生成可供增量回放使用的轨迹文件。
  actors:
  - 操作员
  - GUI
  - 机械臂法兰位姿采集接口
  trigger: 操作员按下 GUI 中的轨迹录制机械按钮
  preconditions:
  - 机器人处于允许采集法兰位姿的安全状态
  - 当前录制模式明确为增量轨迹
  - 录制名称和目标保存位置可用
  inputs:
  - 录制名称
  - 机械按钮按下/松开事件
  - 录制期间采集的绝对法兰位姿序列 T0...Tn
  rule:
    statement: 按钮按下开始采样，按钮松开结束本次采样；结束后按照参考工程的后处理流程生成 Delta_i = inverse(T0) @ Ti 的法兰增量轨迹文件。
  outputs:
  - 增量轨迹文件，文件名或目录以 delta 开头
  - 文件内明确标注轨迹类型为增量轨迹
  - 录制结果状态和错误信息
  side_effects:
  - 产生原始采样数据和后处理结果（是否全部保留待确认）
  exceptions:
  - 采样点不足：不生成可回放增量轨迹，并向操作员报告失败
  - 录制中断或采样异常：结束当前录制并报告状态，不将不完整结果标记为可用
  - 后处理失败：保留可诊断错误，不生成或启用无效增量轨迹
  failure_handling:
  - 录制失败时 GUI 必须显示失败原因，操作员可重新发起录制
  invariants:
  - 增量轨迹的参考坐标系为初始法兰位姿，首个 delta 必须为 identity
  - 平移单位为米，旋转单位为弧度，RPY 顺序为 xyz
  - 增量轨迹与普通绝对轨迹不可仅依据文件名互相替代；文件标签必须能被回放流程校验
  acceptance:
  - id: BL-TRAJECTORY-001-AC-001
    given: GUI 处于增量轨迹录制模式且机器人可采集法兰位姿
    when: 操作员按下机械按钮并在完成动作后松开
    then: 系统只记录按钮保持期间的轨迹，并自动进入后处理
    method: null
    evidence: null
    status: not-verified
  - id: BL-TRAJECTORY-001-AC-002
    given: 录制期间得到至少两个有效绝对法兰位姿
    when: 后处理完成
    then: 输出首点为 identity 的增量轨迹文件，且文件类型标签为 delta
    method: null
    evidence: null
    status: not-verified
  - id: BL-TRAJECTORY-001-AC-003
    given: 操作员打开现有拖动控制栏目
    when: 操作员需要录制增量轨迹
    then: GUI 在普通轨迹录制按钮旁提供独立的“开始增量录制”和“停止增量录制”按钮
    method: null
    evidence: null
    status: not-verified
  dependencies: []
  baseline_refs: []
  decision_refs: []
  implementation_refs:
  - /home/tbl/Project/cucumber/dexbot_ros2_ws/src/dexbot_middle_layer/CutTofo/scripts/flange_motion_editor/capture_flange_motion.py
  - /home/tbl/Project/cucumber/dexbot_ros2_ws/src/dexbot_middle_layer/CutTofo/scripts/flange_motion_editor/process_flange_motion.py
  test_refs: []
  supersedes: []
  notes: 参考工程是技术证据，不是当前 GUI 的实现依据；当前增量录制暂不接入两个 ROS 工程执行链路。
  created_at: '2026-08-05'
  updated_at: '2026-08-05'
  last_verified_at: null

- id: BL-TRAJECTORY-002
  title: GUI 增量法兰轨迹回放
  kind: flow
  domain: trajectory_replay
  status: candidate
  priority: high
  risk: high
  authority: user-confirmed
  source:
    type: user-statement
    reference: 用户于 2026-08-05 确认 GUI 增量轨迹回放流程
  description: 操作员在 GUI 中选择增量轨迹文件，系统读取当前法兰位姿，将增量轨迹展开为当前起点下的绝对法兰轨迹并执行。
  actors:
  - 操作员
  - GUI
  - 当前法兰位姿查询接口
  - 轨迹执行接口
  trigger: 操作员选择增量轨迹文件并发起回放
  preconditions:
  - 选择的文件存在且通过增量轨迹 schema 校验
  - 文件类型标签明确为增量轨迹
  - 能够获得当前法兰位姿
  - 机器人处于允许回放的安全状态
  inputs:
  - 增量轨迹文件
  - 当前法兰位姿 T_current
  - 回放速度或其他用户可见执行参数（具体范围待确认）
  rule:
    statement: 系统按 T_current @ Delta_i 生成当前起点下的绝对法兰轨迹，再交给执行链路回放，不把普通绝对轨迹当作增量轨迹解释。
  outputs:
  - 回放执行结果
  - 轨迹类型校验结果
  - 失败原因或停止状态
  exceptions:
  - 文件标签与内容 schema 不匹配：禁止执行并报告文件类型错误
  - 当前法兰位姿获取失败：禁止展开和执行
  - 展开或执行失败：停止/结束当前回放并报告失败，不自动重复执行（是否自动重试待确认）
  invariants:
  - 回放前必须校验轨迹类型、坐标系、单位、姿态顺序和版本
  - 普通轨迹与增量轨迹在 GUI 选择和执行入口上必须可区分
  - 同一增量文件可在不同当前法兰起点复用，但动作相对几何语义保持一致
  acceptance:
  - id: BL-TRAJECTORY-002-AC-001
    given: 操作员选择一个 schema 合法且标注为 delta 的增量轨迹文件
    when: 操作员发起回放
    then: 系统读取当前法兰位姿，按 T_current @ Delta_i 展开并执行
    method: null
    evidence: null
    status: not-verified
  - id: BL-TRAJECTORY-002-AC-002
    given: 操作员选择普通绝对轨迹，或文件标签与内容不一致
    when: 操作员发起增量回放
    then: 系统在执行前拒绝该文件并显示可诊断错误
    method: null
    evidence: null
    status: not-verified
  - id: BL-TRAJECTORY-002-AC-003
    given: GUI 已展示普通轨迹回放区域
    when: 操作员需要回放增量轨迹
    then: GUI 在普通轨迹回放区域下方提供独立的增量轨迹回放区域，且选择器仅展示可回放的 delta 文件
    method: null
    evidence: null
    status: not-verified
  dependencies:
  - BL-TRAJECTORY-001
  baseline_refs: []
  decision_refs: []
  implementation_refs:
  - robot_motion_executor/src/dexbot_motion_executor/dexbot_motion_executor/entities/flange_delta_trajectory.py
  test_refs: []
  supersedes: []
  notes: 当前只澄清 GUI 业务流程，不接入 ROS/Driver 执行代码。
  created_at: '2026-08-05'
  updated_at: '2026-08-05'
  last_verified_at: null
- id: BL-GRASP-001
  title: 锅把抓取确认
  kind: flow
  domain: plating
  status: deferred
  priority: high
  risk: high
  authority: user-confirmed
  source:
    type: user-statement
    reference: 用户于 2026-07-28 补充 V1 流程
  description: 机器人在后续迭代中通过触觉、承载或其他信号确认锅把抓取稳定性；该能力不属于当前 V1 初版流程
  actors:
  - 双臂移动机器人灵巧手
  trigger: 自动翻炒锅烹饪完成，锅盖已打开，机器人获得锅把抓取区域
  preconditions:
  - 锅把抓取区域温度在允许范围内
  - 锅把和灵巧手的几何、材质、可接触区域已标定或被视觉识别
  - 锅体周围有安全接近和抬升空间
  - 机器人负载、关节力矩和灵巧手夹持能力满足最坏工况估计
  inputs:
  - 锅把位姿、轴线、直径/截面和可抓取区
  - 锅具空载及含菜最坏工况质量、质心和温度
  - 灵巧手指尖/掌面接触状态、关节位置和力矩
  - 机器人与灶具、台面、餐盘的碰撞模型
  rule:
    statement: '当前 V1 初版只依据感知组锅把信息建立预抓取姿态，并按给定关节角度和力矩闭合灵巧手；不执行抓取确认。后续迭代可增加触觉、承载或其他确认信号，具体失败回退另行定义。'
  outputs:
  - 当前 V1 的灵巧手闭合完成结果
  - 后续迭代可增加的 grasp_confirmed 或 grasp_rejected 状态
  - 抓取姿态、指关节目标、夹持力/力矩和试抬升结果日志
  - 允许进入倾倒或转入重试/人工介入
  side_effects:
  - 锅把可能发生轻微转动或滑移
  - 灵巧手接触面可能接触油污或高温残留
  - 试抬升会引起锅内菜品和汤汁重心变化
  exceptions:
  - 锅把定位不确定：保持安全距离 → 重新视觉定位 → 失败则人工介入
  - 指尖未形成预期接触：停止闭合 → 退回预抓取 → 更换抓取姿态或人工介入
  - 试抬升发生滑移/异常力矩：当前 V1 按安全停止或人工接管处理；后续抓取确认迭代再定义专门回退
  - 温度、负载或力矩超限：禁止抓取/抬升 → 报警并人工介入
  - 当前 V1 不存在抓取确认信号；后续迭代接入后再定义信号丢失处理
  failure_handling:
  - 锅把定位不确定：保持安全距离 → 重新视觉定位 → 失败则人工介入
  - 指尖未形成预期接触：停止闭合 → 退回预抓取 → 更换抓取姿态或人工介入
  - 试抬升发生滑移/异常力矩：当前 V1 按安全停止或人工接管处理；后续迭代再定义专门回退
  - 温度、负载或力矩超限：禁止抓取/抬升 → 报警并人工介入
  - 当前 V1 不存在抓取确认信号；后续迭代接入后再定义信号丢失处理
  invariants:
  - 灵巧手不能接触锅体高温区、灶面或锅内食物
  - 闭合完成前锅体仍有安全支撑，不允许悬空转运
  - 后续若启用抓取确认，需重新定义是否作为转运/倾倒闸门
  - 抓取姿态必须为后续倾倒保留安全腕部姿态和运动空间
  - 任何单一“手指闭合到位”信号不能单独证明抓取成功
  acceptance:
