    when: pour 完成回调触发
    then: 子 Policy 在生成 place 前生成导航到 cook 的 chassis_control 步骤，导航完成后才执行 place
    method: unittest test_pour_serve_navigation_policy.py::test_pour_completion_queues_cook_navigation_then_place
    evidence: EVID-POURSERVE-NAV-001
    status: passed
  - id: BL-POURSERVE-NAV-001-AC-003
    given: 底盘已导航回 cook
    when: 子 Policy 生成 place 步骤
    then: place 继续使用 pick 阶段的 approach/grasp 法兰快照，不新增重新感知
    method: 代码检查 `_populate_place_actions` 仅读取 `_approach_flange_pose`/`_grasp_flange_pose`，不调用感知；FullPolicy 冒烟确认 place 步骤在导航后直接生成
