- id: BL-FAKEVISION-001
  title: PanPour 真机链路假视觉测试
  kind: integration
  domain: robam_pan_pour
  status: experimental
  priority: high
  risk: high
  authority: user-confirmed
  source:
    type: user-statement
    reference: 用户于 2026-08-25 确认“真实机械臂 + 假视觉”测试业务逻辑
  description: >-
    在手眼标定和真实感知尚未就绪时，由假视觉节点一次发布三个中心坐标系目标对象，
    驱动 PanPour 子 Policy 在真实机械臂上跑通完整动作链；底盘保持占位跳过。
  actors:
  - PanPour 子 Policy
  - 假视觉节点
  - MotionExecutor / manipulation Skill
  - 左臂机器人
  - 左臂 O6 灵巧手
  trigger: 假视觉节点向 `/perception/scene` 发布有效场景，用户调用 PanPour
  preconditions:
  - 真机 Driver、MotionExecutor、TaskPlanner 和假视觉节点已启动
  - "`sub_policy_pan_pour.py` 测试参数满足 `GRASP_OFFSET_ALONG_HANDLE_M=0.0`、`TCP_GRASP=0`、`TCP_PAN=0`"
  - "`set_tcp(left_default)` 链路可用"
  - "`pot_handle_center`、`pot_inner_handle`、`plate_center` 已按 `get_arm_pose` 中心坐标填写"
  inputs:
  - "`pot_handle_center`"
  - "`pot_inner_handle`"
  - "`plate_center`"
  - "`scene_valid=true`"
  rule:
    statement: >-
      假视觉节点一次发布所有目标到 `/perception/scene`，不采用分阶段切换发布对象，
      这样 PanPour 不需要依赖“何时切换发布对象”的外部时序。三个对象全部定义在
      中心坐标系：`pot_handle_center` 取自用户手动把左臂移动到抓锅点时读取的法兰位姿，
      `pot_inner_handle` 由用户根据转换后的点位手动填写，`plate_center` 取自用户手动把
      左臂移动到倾倒轨迹回放起始位时读取的法兰位姿。姿态使用 identity 四元数；
      PanPour 不消费假视觉姿态，倾倒起始姿态仍使用固定 `POUR_INITIAL_FLANGE_RPY`。
      测试阶段 `TCP_GRASP`、`TCP_PAN` 和 `GRASP_OFFSET_ALONG_HANDLE_M` 临时设为全 0，
      Policy 下发法兰目标点（中心坐标系），Driver 再经中心坐标系参数转换为左臂 base 控制。
      流程为 `set_tcp -> wait_handle -> pick -> wait_plate -> pour -> place -> completed`，
      底盘占位跳过。
  outputs:
  - 假视觉驱动的 PanPour 真机完整动作链执行结果
  side_effects:
  - 真机左臂和灵巧手会实际运动
  exceptions:
  - 假视觉点与实际机械臂姿态不一致可能造成碰撞或轨迹起点错误
  - 倾倒起点固定 `POUR_INITIAL_FLANGE_RPY` 必须与 `pour_delta.json` 起始姿态一致
  failure_handling:
  - 真机安全停止沿用本机急停规则，本轮不实现自动重试
  invariants:
  - 假视觉一次发布全部对象，不切换发布对象
  - 点位语义统一为中心坐标系，`scene_valid=true`
  - 底盘保持占位跳过，不阻塞回放
  acceptance:
  - id: BL-FAKEVISION-001-AC-001
    given: 真机、假视觉节点和 PanPour 子 Policy 已启动
    when: "假视觉一次发布 `pot_handle_center`、`pot_inner_handle`、`plate_center` 且 `scene_valid=true`"
    then: "PanPour 从 `set_tcp` 开始依次完成 pick、pour、place，不等待真实感知"
    method: null
    evidence: null
    status: not-verified
  - id: BL-FAKEVISION-001-AC-002
    given: 测试阶段 TCP 与沿锅把偏移参数已临时置 0
    when: 子 Policy 根据假视觉点生成运动目标
    then: 下发的法兰目标点在中心坐标系下与假视觉抓取/倾倒点一致，Driver 负责转换到左臂 base
    method: null
    evidence: null
    status: not-verified
  - id: BL-FAKEVISION-001-AC-003
    given: 需要采集假视觉点位
    when: "用户填写 `pot_handle_center` 和 `plate_center`"
    then: "用户分别控制左臂到抓锅点和倾倒轨迹回放起始位，读取 `get_arm_pose` 的中心坐标系位置"
    method: null
    evidence: null
    status: not-verified
  dependencies:
  - BL-PANPOUR-001
  baseline_refs: []
  decision_refs: []
  implementation_refs:
  - /home/tbl/Project/boss_electrics/kitchen_robot_home/src/dexbot_task_planner/dexbot_task_planner/policy/robam/sub_policy_pan_pour.py
  test_refs: []
  supersedes: []
  notes: 用户确认不需要分阶段发布；直接全部发给 PanPour，避免切换发布对象的时序控制。
  created_at: '2026-08-25'
  updated_at: '2026-08-25'
  last_verified_at: null
- id: BL-POURSERVE-NAV-001
  title: PourServe 子 Policy 底盘导航接入
  kind: flow
  domain: robam_pour_serve_chassis
  status: active
  priority: high
  risk: high
  authority: user-confirmed
  source:
    type: user-statement
    reference: 用户于 2026-09-02 确认只增加两次底盘导航，不修改 pick/pour/place 阶段
  description: >-
    PourServe 子 Policy 在现有动作链中正式接入两次底盘 marker 导航：
    pick 完成后导航到 `serve`，再开始等待餐盘感知；pour 完成后导航到 `cook`，
    再执行现有 place。接入方式参考 Gather 的 `chassis_control -> move_to_point` 模式。
  actors:
  - TaskPlanner / FullPolicy
  - PourServe 子 Policy
  - MotionExecutor / ChassisControlSkill
  - Yunji 底盘
  - 左臂机器人
  trigger: PourServe 的 pick 或 pour 阶段执行完成
  preconditions:
  - 底盘端已保存 `serve` 和 `cook` 两个 marker
  - Motion 已注册并可用 `chassis_control` 的 `move_to_point`
  - 现有 pick/pour/place 数据快照保持可用
  inputs:
  - marker 名 `serve`
  - marker 名 `cook`
  - 现有 pick 阶段快照
  - 现有 pour 阶段回放结果
  rule:
    statement: >-
      只在 PourServePolicy 中插入两次底盘导航步骤：pick 完整执行完成后、进入
      WAIT_PLATE 前，生成 `move_to_point` 到 marker `serve`；导航完成后才允许
      等待餐盘感知。pour 完整执行完成后、进入 PLACE 前，生成 `move_to_point`
      到 marker `cook`；导航完成后才执行现有 place。pick/pour/place 的生成逻辑
      和数据来源一律不改；place 继续使用现有 pick 阶段的抓取/预抓取法兰快照，
      不新增回 cook 后的重新感知。导航步骤复用 Gather 的 `PLAN_CHASSIS_CONTROL`
      表达：`action_name=move_to_point`、`object_id=marker`、
      `control_positions=[timeout, poll]`。
  outputs:
  - 两次 `PLAN_CHASSIS_CONTROL` 导航 PlannedStep
  - PourServe 状态机按导航完成推进到 WAIT_PLATE / PLACE
  side_effects:
  - 底盘在左臂持锅姿态下移动到 serve/cook
  - 底盘导航完成前不启动餐盘感知或 place
  exceptions:
  - marker 名为空或底盘 marker 不存在时，chassis skill 返回失败
  - 底盘断连、导航超时或取消时，chassis skill 返回失败
  failure_handling:
  - 沿用现有 MotionExecutor / TaskPlanner 的步骤失败与重试语义，不新增 Policy 级补偿逻辑
  invariants:
  - 不修改 pick/pour/place 阶段及其现有数据来源
  - place 不重新感知锅位，继续使用 pick 阶段快照
  - 底盘导航期间左臂保持 pick 或 pour 结束后的当前持锅姿态
  - marker 名固定为 `serve` 和 `cook`
  acceptance:
  - id: BL-POURSERVE-NAV-001-AC-001
    given: PourServe 已进入 pick 阶段且 pick 执行成功
    when: pick 完成回调触发
    then: 子 Policy 在进入 WAIT_PLATE 前生成导航到 serve 的 chassis_control 步骤，导航完成后才等待餐盘
    method: unittest test_pour_serve_navigation_policy.py::test_pick_completion_queues_serve_navigation_then_wait_plate
    evidence: EVID-POURSERVE-NAV-001
    status: passed
  - id: BL-POURSERVE-NAV-001-AC-002
