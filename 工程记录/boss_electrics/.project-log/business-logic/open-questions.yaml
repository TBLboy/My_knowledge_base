- id: Q-025
  title: PickSkill 是否覆盖预抓取、抓取、闭合、抬锅
  category: business-flow
  status: answered
  priority: P1
  authority: C
  created: 2026-08-23
  context: |+
    新 PanPour 子 Policy 计划全程使用 manipulation、增量轨迹回放和 API。
    老逻辑抓取段分为先移动到预抓取点、再移动到抓取点；用户需要确认现有
    manipulation PickSkill 能否直接承担“预抓取/抓取/闭合/抬锅”，而不修改
    Motion Skill。
  decision_candidate: |+
    推荐 PickSkill 承担该段：`move_to_pre_pick` 为预抓取点，
    `move_to_pick` 为抓取点，`pick_gesture` 为闭合，
    `move_to_pick_retreat` 为抬锅/安全高位；其余动作槽 `enabled: false`。
    PickSkill 的必选动作是 `move_to_pick` 与 `pick_gesture`。
  requires: ""
  answer: |+
    可以。PickSkill 固定序列中的
    `move_to_pre_pick -> move_to_pick -> pick_gesture -> move_to_pick_retreat`
    覆盖老逻辑的两段抓取、闭合和抬锅。
    抬锅点只是抓完锅后的安全抬高位/倾倒准备高位，不是倾倒开始点；
    倾倒开始点后续通过盘子检测信息由视觉引导移动得到，直接调用现有 API。
