  related_tasks:
  - TASK-008
  context: 用户确认抓取偏置表达在机器人中心坐标系 C 下，并沿锅把主轴 PCA 向量方向施加；抓取 TCP 和锅具 TCP 均使用可参数化的位置与姿态定义。
  recommendation: 使用抓取 TCP 和锅具 TCP 的参数化位姿；将抓取偏置建模为 C 下沿锅把 PCA 方向的标量偏置
  alternatives: []
  answer: grasp_target_C = grasp_point_C + grasp_offset_pca * pca_axis_C；左臂抓取 TCP 与锅具 TCP 的位置、姿态均作为参数配置，锅具 TCP 是锅上的固定参考点。
  source_refs:
