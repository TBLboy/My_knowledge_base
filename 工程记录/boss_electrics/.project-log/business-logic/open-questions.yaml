- id: Q-030
  title: PanPour 预抓取点如何得到
  category: business-flow
  status: answered
  priority: P1
  authority: C
  created: 2026-08-23
  context: |+
    用户确认抓取点由视觉感知得到，并询问预抓取点来源。
    现有 `sub_policy_pour_food.py` 已展示“视觉目标 -> 抓取点 ->
    接近偏移 -> 预抓取点”的计算模式；旧 PanPour 由
    `pot_handle_center` / `pot_inner_handle` 和 PCA 轴计算抓取点。
    新 PanPour 使用 PickSkill 的 `move_to_pre_pick`，因此需要明确
    预抓取点是否固定录制、由视觉单独提供，还是 Policy 外推。
  decision_candidate: |+
    预抓取点不由视觉单独检测，也不作为固定录制点位；
    由 Policy 基于视觉抓取点沿中心坐标系 Z 轴正方向和 YAML 配置的
    接近距离外推生成。
  requires: ""
  answer: |+
    视觉先提供锅把中心/PCA（或对应把手类目标）；Policy 根据
    `grasp_offset_m` / `grasp_offset_center_m` 计算抓取点，
    再从抓取点沿中心坐标系 Z 轴正方向外推出预抓取点，
    RPY 与抓取姿态一致。
    接近方向固定为中心坐标系 Z 轴正方向，`approach_distance_m` 放
    PanPour YAML；预抓取点 = 抓取点 + [0, 0, approach_distance_m]，
    位于抓取点正上方。抓取运动从预抓取点沿中心坐标系 -Z 方向下降到抓取点。
