- id: Q-015
  title: 机器人中心坐标系 C 的原点、轴向和时序语义
  status: answered
  authority: C
  impact: high
  uncertainty: high
  rework_cost: high
  related_business_logic:
  - BL-PLATING-001
  related_tasks:
  - TASK-007
  - TASK-008
  context: 用户确认代码已经基于左右臂各自 base 坐标系的相机标定文件计算统一中心坐标系 C，用于把左右臂放入同一坐标系并支持双臂协同。
  recommendation: 复用代码已有中心坐标系和标定链路，不另设业务坐标系；技术选型阶段核对其配置入口、变换方向和运行时使用方式。
  alternatives:
  - 使用随底盘实时更新的中心坐标系，适合底盘运动期间的动态目标，但需要明确时间戳和同步语义
  - 继续使用某一机械臂基座作为中间基准，不符合已确认的统一中心坐标系规则，不推荐
  answer: 机器人中心坐标系 C 沿用代码中由左右臂 base 坐标系及相机标定文件计算出的统一坐标系，服务于左右臂协同；业务目标统一在 C 下表达。
  source_refs:
  - 用户于 2026-07-28 补充 V1 坐标规则
  created_at: '2026-07-28'
  answered_at: '2026-07-28'
