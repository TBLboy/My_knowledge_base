version: '0.4'
status: passed
functional_business_logic:
  actors:
  - 双臂移动机器人
  - 灵巧手
  - 自动翻炒锅 KP200
  - 餐盘
  scenarios:
  - 固定场景下抓锅、倾倒入盘、放回原位
  rules:
  - 抓取确认未输出 grasp_confirmed 时不得转运或倾倒。
  - 倾倒过程必须避免高温区、碰撞和明显洒落。
  state_transitions:
  - safe-supported → grasping → grasp-confirmed → transferring/pouring → returned
    or human-intervention
  exceptions:
  - 抓取失败、卡料、盘位移位、超力矩、通信丢失和过量洒落
  boundaries:
  - 第一版固定锅位、盘位、菜量和机器人初始状态；不承诺泛化、双臂协同或全轨迹自适应力控。
technical_business_logic:
  current_implementation_facts:
  - 当前项目目录主要包含方案文档和 Project Log，没有已迁移的产品代码实现。
  interface_contracts:
  - 抓取确认需要输出 grasp_confirmed/grasp_unverified/grasp_rejected。
  - 倾倒反馈依赖关节 effort/力矩或腕部 F/T 接口。
  data_and_state_rules:
  - 抓取确认必须由接触、承载和无明显滑移三类证据组合。
  consistency_and_concurrency:
  - 锅具仍有安全支撑时完成抓取确认；异常时降回支撑面并停止。
  external_constraints:
  - 厨房高温、油污、台面/灶具碰撞和设备接口不统一。
  compatibility_constraints:
  - 目标环境为双臂 7-DOF 机器人、灵巧手和 ROS 2/MoveIt 2 体系。
