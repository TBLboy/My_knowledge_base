version: '0.4'
status: active
functional_business_logic:
  actors:
  - 操作员/任务发起方
  - 上一个环节任务/子任务
  - 双臂移动机器人
  - 左臂灵巧手
  - 感知组模型提供方
  - 底盘控制组
  - 两个仓库共同开发团队
  - 自动翻炒锅 KP200
  - 餐盘
  scenarios:
  - V1 作为中间环节，在上一个环节完成并移交后，锅把朝左，由左手抓锅、移动、倾倒和必要轻微抖动；放回原位、张手和 home 作为后续插槽
  - V2 在 V1 闭环稳定后评估右手锅铲抓取、放置和辅助动作
  rules:
  - 场景检查通常由上游环节完成；本子任务保留可选场景检查占位，不把它作为当前启动前置。
  - 感知模型由感知组提供，本子任务只订阅锅把中心、抓取点、主轴方向及有效性等约定信息。
  - V1 感知正式复用现有路径 A：`ScenePerception` 经 `TaskPlannerNode._on_scene()` 写入 `WorldState`，`PanPourPolicy` 从统一 `WorldState` 消费；不为本任务创建第二套 ROS 订阅或感知缓存。
  - 抓取目标由感知抓取点沿锅把主轴 PCA 向量施加可调偏置计算，左臂通过已标定且参数化的抓取 TCP 以固定姿态到达目标。
  - V1 倾倒点由机器人中心坐标系 C 下的餐盘中心点加 C 下 xyz 三轴可调偏置得到：pour_point_C = plate_center_C + pour_offset_C。
  - 所有业务目标、中间位姿和偏置统一在机器人中心坐标系 C 下表达；机械臂基坐标系只允许作为底层执行时的转换结果。
  - 当前 V1 初版不执行抓取确认，左手闭合后直接进入提锅和准备倾倒；抓取确认作为后续迭代预留，不属于当前 V1 基础流程。
  - 左手抓住锅把后进入准备倾倒姿态并保持，底盘移动期间左臂不改变该姿态。
  - 倾倒阶段使用参数化锅具 TCP 与目标点的转换，移动到倾倒位置时保持 TCP 姿态不变；倾倒动作采用锅具 TCP 坐标系下的预录制增量动作回放。
  - V1 不依赖右手锅铲辅助，右手锅铲不作为 V1 前置条件或验收条件。
  - V1 当前只打通动作流程，不增加菜品完整落盘、卡料或洒落的验收规则。
  - V1 暂不实现异常检查、自动重试和回退处理，仅在流程中预留后续扩展位置。
  state_transitions:
  - handoff-ready → optional-scene-check → perception-subscribed → grasp-target-calculated → hand-closed → lift-to-pour-ready → base-positioned → plate-target-calculated → pour-positioned → pouring → V1-minimum-completed
  - future-cleanup-extension：在 V1 最小闭环稳定后，补充放回锅具、张开灵巧手和恢复 home 的具体规则或轨迹
  - hand-closed → lift-to-pour-ready；后续版本可在 hand-closed 与 lift-to-pour-ready 之间插入抓取确认
  - perception-not-ready → wait/not-started
  - future-error-handling-extension：在 V1 主流程跑通后补充异常检查、停止、重试和人工接管语义
  - V1-completed → V2-evaluation
  exceptions:
  - 当前 V1 不实现上述异常分支，仅保留异常处理扩展位置
  - 右手锅铲无法稳定抓取、放置、进入锅内或造成碰撞（V2）
  boundaries:
  - V1 固定锅位、盘位、锅把朝向、菜量范围、机器人初始状态、抓取姿态和倾倒动作基线。
  - 感知模型训练、推理和锅把特征识别不属于本子任务；本子任务负责订阅和消费其输出。
  - 底盘移动控制由底盘组支持；本子任务负责定义左臂保持准备倾倒姿态的协同要求。
  - 抓取 TCP 和锅具 TCP 的位置、姿态均可参数化；抓取偏置数值属于待填写参数，放回规则或轨迹及 home 位置后续确定，均不阻塞当前前段流程。
  - 抓取确认不进入当前 V1 实现，后续是否增加及其失败回退另立迭代任务。
  - V1 不承诺右手锅铲辅助、生产级泛化、全轨迹自适应力控或默认双臂协同，也不加入当前版本的落料验收和异常处理。
  - 当前澄清只冻结业务边界，不冻结未来框架、库、控制器或重构方案。
technical_business_logic:
  current_implementation_facts:
  - kitchen_robot_home 是 ROS 2 Humble 主工作空间，包含 dexbot_interfaces、dexbot_task_planner、dexbot_bringup、配置和 SDK 资源。
  - dexbot_task_planner 订阅 perception/scene，提供 StartTask、CheckPick、PauseTask、GetTaskStatus 服务，并通过 motion_executor/execute_task action 调用执行层。
  - TaskPlannerNode 按 task_type 选择 policy；policy 返回 PlannedStep 或 BimanualStep；planner 将步骤转换为 ExecuteTask.Goal。
  - robot_motion_executor 是独立 ROS 2 Python 包，提供 ExecuteTask action server，并注册 API、Skill 和 Controller。
  - MotionExecutor 将高层目标映射为 MotionPrimitive，再调用 robot_driver 的移动、夹爪、灵巧手状态和停止接口。
  - ExecuteTask 当前支持单臂、双臂并发、双臂协调同步，以及 control=True 控制器路径和 resume_restart 重启标记。
  - 当前两个仓库是独立 Git 工作树，不是主仓库内的 Git submodule；主仓库 README 同时描述部分执行层为已安装 deb 黑盒。
  - 两个仓库由团队共同开发；后续产品代码变更必须按主仓库与执行仓库的职责边界协同落地，不能默认只有单一开发者维护。
  - 感知组将提供锅把识别模型和感知信息；当前子任务的技术事实范围是订阅和使用结果，不包含模型实现。
  - 底盘组负责底盘移动能力；V1 要求底盘移动期间左臂保持准备倾倒姿态。
  - 机器人中心坐标系由左右臂 base 坐标系与相机标定文件计算得到，现有脚本约定中心坐标轴为 X 前、Y 左、Z 上。
  - '`robot_params.yaml` 已提供 `toolset.end` 和 `toolset.ref` 的位置/姿态配置入口，可作为 TCP 和相关工件坐标参数化的代码事实依据。'
  - robot_motion_executor 的 PerceptionReceiver 已订阅 `perception/scene`，只缓存最新 ScenePerception，并可按 scene_valid 判断当前场景是否有效；这可承载“订阅感知结果”，但不能替代锅把语义字段契约。
  - 两仓库现有测试主要是版权、flake8 和 pep257 检查，未发现针对 V1 锅把抓取/倾倒闭环的行为测试。
  interface_contracts:
  - ScenePerception 提供 scene_valid、scene_id、objects 和 pointcloud；对象通过 ObjectDetection 的位姿和类别进入 WorldState。
  - TaskTarget 当前承载 object_id、class_name、grasp/place pose、关节目标、手部 action_name、arm_type 和 check pose。
  - ExecuteTask.Goal 以 task_id、task_type、target 为核心，并可附带 co_target、execution_mode、sync_points、control 输入和 resume_restart。
  - MotionPrimitive 当前覆盖笛卡尔移动、线性移动、夹爪动作、关节移动、灵巧手角度/力矩读取设置、触觉抓取、路径录制等类型。
  - 当前业务新增两个坐标语义：左臂抓取 TCP 用于到达锅把抓取目标，锅具 TCP 用于将锅上参考点转换到倾倒目标；所有业务目标先在机器人中心坐标系表达，现有消息契约尚未明确表达坐标系和两个 TCP。
  - V1 倾倒目标的业务公式已确认，但现有代码没有 plate_center_C、pour_offset_C 或 frame_id 数据契约。
  - 当前 V1 约定抓取姿态暂时固定，抓取目标由感知抓取点加可调偏置得到；灵巧手闭合关节角度和力矩参数由后续执行输入补充。
  - 当前 V1 倾倒动作优先考虑预先录制的增量动作播放；录制格式、相对坐标系、播放入口和停止语义尚未选型。
  - 现有 PathRecordSkill 可按名称在控制器侧录制路径，MotionPrimitive 有 RECORD_PATH 类型；当前未确认该能力是否已经提供面向 V1 的增量回放 ExecuteTask 入口。
  - robot_driver 的真实服务语义、反馈粒度、力矩/触觉接口和 stop latch 行为需要结合驱动仓库或设备实测确认。
  data_and_state_rules:
  - planner 的 WorldState 保存最新感知对象、picked/placed 集合、整体机器人状态和左右臂独立状态。
  - 当前 `TaskPlannerNode._on_scene()` 在 `scene_valid` 时清空并重建 `WorldState.objects`；`PanPourPolicy` 已由 Planner 以 `world=self._world` 初始化，因此正式感知接入点是 WorldState，而不是 Policy 自己订阅 topic。
  - planner 以当前 policy 状态和 goal handle 推进任务；executor 以 primitive 顺序推进单臂任务，双臂路径使用独立结果和命名屏障。
  - 当前代码没有明确的锅把中心、抓取点、锅把主轴、两个 TCP、抓取偏置、可选 grasp_confirmed 结果和菜品落盘完整性数据契约。
  consistency_and_concurrency:
  - planner 单臂默认按一个 goal 顺序执行；双臂模式由 execution_mode 和 co_target 驱动。
  - executor 对双臂分别构建 primitive，并在 sync_barrier 处等待，取消或失败会触发对应结果失败。
  - planner 通过 goal_epoch、忙标志和取消回调避免处理过期 goal，但 V1 业务级重试和幂等语义尚未定义。
  - 当前业务要求底盘移动与左臂保持姿态协同，但现有双臂执行模式不等同于底盘-机械臂协同契约，尚未确认承载方式。
  external_constraints:
  - ROS 2 Humble、机器人驱动服务、感知消息、灵巧手接口和真实厨房安全边界是当前系统约束。
  - 主工作空间 launch 中 motion_executor 和 task_planner 默认启动，但感知节点和部分安全节点当前存在注释或延迟启动配置，需要运行时核实。
  compatibility_constraints:
  - 未来 V1 需要同时兼容主仓库的接口/任务规划边界和执行仓库的 Skill/MotionPrimitive 边界。
  - 技术选型不能绕过既有 ExecuteTask、TaskTarget、MotionPrimitive 和 robot_driver 服务契约，除非先记录接口变更决策。
  - 两个仓库共同开发意味着接口、版本、测试和发布边界需要在后续架构决策中共同维护。
