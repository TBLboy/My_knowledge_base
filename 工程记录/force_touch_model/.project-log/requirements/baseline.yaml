version: "0.3"
baselines:
  - id: REQ-001
    revision: 1
    status: draft
    goal: "建立统一的矿泉水瓶花生倾倒 benchmark，并以真机成功率驱动后续模型迭代。"
    actors:
      - 组内数据采集人员
      - 标注人员
      - 模型训练人员
      - 真机评测人员
    in_scope:
      - "组内遥操作采集矿泉水瓶花生倾倒任务数据"
      - "将原始数据转换为 LeRobot v3.0"
      - "使用 LeRobot 官方数据标注平台进行语义和子任务标注"
      - "统一任务和数据集上的模型训练与真机评测"
      - "以真机成功率作为当前主评测指标"
      - "根据真机失败问题设计后续针对性优化实验"
      - "记录同一轨迹的多语言描述版本作为可选数据增强方向"
    out_of_scope:
      - "当前阶段建立复杂的多指标最终排名体系"
      - "将 open-loop MAE/RMSE 作为最终 benchmark 指标"
      - "当前阶段把分段变频采样作为主要研究方向"
      - "在未完成真机 baseline 前预先决定所有模型结构变量"
    business_logic_refs:
      - BL-BENCH-001
      - BL-BENCH-002
      - BL-DATA-001
      - BL-DATA-002
      - BL-DATA-003
      - BL-DATA-004
      - BL-ITER-001
    constraints:
      - "benchmark 任务固定为握住经剪刀扩大瓶口、装有花生的矿泉水瓶，并将花生倾倒到指定接收容器"
      - "正式效果测试必须是真机部署和实际执行"
      - "当前成功条件要求完整握住瓶子并将花生倾倒干净"
      - "数据正式标注前必须转换为 LeRobot v3.0"
      - "语义描述必须与轨迹事实一致，丰富描述不能以臆造属性为代价"
      - "子任务标注至少覆盖抓取、移动、倾倒三个阶段的意图"
      - "原始数据转换不得覆盖原始数据"
    quality_attributes:
      - "可比性：不同模型使用统一任务、数据集和真机评测流程"
      - "可追溯性：每个模型版本关联数据版本、标注版本、checkpoint 和成功率"
      - "可复现性：数据转换和训练配置可重复执行"
      - "问题定位性：真机失败能够关联到任务阶段和具体现象"
    assumptions:
      - "组内具备遥操作采集和目标机器人真机部署条件"
      - "LeRobot 官方工具能够读取转换后的 v3.0 数据集并支持所需标注字段"
      - "矿泉水瓶、花生和接收容器的基础配置在同一轮 benchmark 中保持一致"
      - "同一轨迹的多描述版本可由标注工具或数据格式承载；具体实现待确认"
    unresolved_questions:
      - "正式 benchmark 的数据集规模、采集人员数量和采集轮次是什么"
      - "训练集、验证集、真机测试集如何划分，是否按场景/采集批次隔离"
      - "成功率的统计分母、重复次数和失败重试规则是什么"
      - "‘倾倒干净’的可操作判定阈值是什么，是否需要称重或人工目测"
      - "测试时瓶子、花生、盆子和摆放位置是否固定，哪些变化用于泛化评估"
      - "子任务标注最终用于训练输入、评测诊断，还是两者都用"
      - "一条轨迹允许多少个语言描述版本，训练时如何避免样本权重失衡"
      - "分段变频采样如何在 LeRobot v3.0 中保存和复现"
    approval:
      status: pending
      evidence:
        - "2026-07-30 会议内容由用户转述"
    supersedes: []
    created_at: "2026-07-30T00:00:00+08:00"
    updated_at: "2026-07-30T00:00:00+08:00"

  - id: REQ-002
    revision: 1
    status: active
    goal: "将 annotation_workbench 交付为 Linux/Ubuntu 上可独立安装和运行的本地 LeRobot v3.0 标注工具包。"
    actors:
      - "本机标注用户"
      - "工具维护人员"
    in_scope:
      - "annotation_workbench 内置桌面入口、本地数据集 HTTP 服务、可视化标注前端、标注后端和固定子任务 VLM 对齐逻辑"
      - "迁移现有可视化前端和标注后端，不对其界面进行大范围重构"
      - "以包内最小实现替代对外部 lerobot_v1.0 的运行时依赖"
      - "Linux/Ubuntu 安装脚本：Python 3.11+ 检查、.venv 创建、Python 依赖安装、Node.js 20 LTS 检查、npm install 和前端生产构建"
      - "通过 ./run.sh 和 python -m annotation_workbench 启动"
      - "通过环境变量配置外部 Ollama 服务和模型"
      - "对 LeRobot v3.0 数据集进行 GUI 人工标注、VLM 自动标注、断点恢复和 GUI 复核"
      - "证明独立包在运行时不读取外部 visualize_dataset、lerobot_v1.0 或 serve_local_dataset.py"
    out_of_scope:
      - "Windows 或 macOS 支持"
      - "重写现有 Next.js 可视化界面为纯 Python 前端"
      - "打包完整 LeRobot 源码、Node.js、Ollama 服务或 Gemma 模型权重"
      - "自动下载大模型"
      - "修改外部 visualize_dataset、lerobot_v1.0 或 serve_local_dataset.py；它们保留为备份"
      - "增加新的多用户、局域网或云端访问能力"
    business_logic_refs:
      - BL-TOOL-001
      - BL-TOOL-002
      - BL-TOOL-003
      - BL-DATA-001
      - BL-DATA-003
    constraints:
      - "Python 版本必须为 3.11+；低版本不得静默降级"
      - "Node.js 目标版本为 20 LTS；缺失时仅在用户确认后使用 sudo apt 安装"
      - "Python 虚拟环境位于 annotation_workbench/.venv"
      - "node_modules 不纳入源码包；由安装脚本依据 package-lock.json 安装"
      - "前端安装后使用 npm run build，运行时使用生产模式"
      - "默认 OLLAMA_API_BASE=http://127.0.0.1:11434/v1，OLLAMA_MODEL=gemma3:27b，可被环境变量覆盖"
      - "VLM 标注直接写入所选数据集的 meta/lerobot_annotations.json"
      - "仅支持 LeRobot v3.0 数据集"
    quality_attributes:
      - "自足性：复制 annotation_workbench 目录后，安装依赖即可运行"
      - "可复现性：安装脚本和锁定的前端依赖可重复准备运行环境"
      - "可恢复性：已完成 episode 不重复处理，失败后可继续"
      - "可诊断性：桌面端显示服务、安装与 VLM 失败原因"
      - "隔离性：工具仅回收自身启动的服务，不清理其他项目进程"
    assumptions:
      - "用户机器可访问 Ubuntu 软件源，且在需要安装系统依赖时拥有 sudo 权限"
      - "用户自行安装并运行 Ollama，且其服务可访问配置的 OpenAI 兼容地址"
      - "目标数据集包含符合 v3.0 元数据约定的 data、meta 和 video 文件"
      - "Node.js 20 LTS 可通过 Ubuntu 支持的安装方式获得"
    unresolved_questions: []
    approval:
      status: approved
      evidence:
        - "2026-08-03 用户逐项确认独立包边界和全部推荐方案"
    supersedes: []
    created_at: "2026-08-03T00:00:00+08:00"
    updated_at: "2026-08-03T00:00:00+08:00"
