version: "0.3"
baselines:
  - id: REQ-001
    revision: 1
    status: draft
    goal: "建立统一的矿泉水瓶花生倾倒 benchmark，并以真机成功率驱动后续模型迭代。"
    actors:
      - 组内数据采集人员
      - 标注人员
      - 模型训练人员
      - 真机评测人员
    in_scope:
      - "组内遥操作采集矿泉水瓶花生倾倒任务数据"
      - "将原始数据转换为 LeRobot v3.0"
      - "使用 LeRobot 官方数据标注平台进行语义和子任务标注"
      - "统一任务和数据集上的模型训练与真机评测"
      - "以真机成功率作为当前主评测指标"
      - "根据真机失败问题设计后续针对性优化实验"
      - "记录同一轨迹的多语言描述版本作为可选数据增强方向"
    out_of_scope:
      - "当前阶段建立复杂的多指标最终排名体系"
      - "将 open-loop MAE/RMSE 作为最终 benchmark 指标"
      - "当前阶段把分段变频采样作为主要研究方向"
      - "在未完成真机 baseline 前预先决定所有模型结构变量"
    business_logic_refs:
      - BL-BENCH-001
      - BL-BENCH-002
      - BL-DATA-001
      - BL-DATA-002
      - BL-DATA-003
      - BL-DATA-004
      - BL-ITER-001
    constraints:
      - "benchmark 任务固定为握住经剪刀扩大瓶口、装有花生的矿泉水瓶，并将花生倾倒到指定接收容器"
      - "正式效果测试必须是真机部署和实际执行"
      - "当前成功条件要求完整握住瓶子并将花生倾倒干净"
      - "数据正式标注前必须转换为 LeRobot v3.0"
      - "语义描述必须与轨迹事实一致，丰富描述不能以臆造属性为代价"
      - "子任务标注至少覆盖抓取、移动、倾倒三个阶段的意图"
      - "原始数据转换不得覆盖原始数据"
    quality_attributes:
      - "可比性：不同模型使用统一任务、数据集和真机评测流程"
      - "可追溯性：每个模型版本关联数据版本、标注版本、checkpoint 和成功率"
      - "可复现性：数据转换和训练配置可重复执行"
      - "问题定位性：真机失败能够关联到任务阶段和具体现象"
    assumptions:
      - "组内具备遥操作采集和目标机器人真机部署条件"
      - "LeRobot 官方工具能够读取转换后的 v3.0 数据集并支持所需标注字段"
      - "矿泉水瓶、花生和接收容器的基础配置在同一轮 benchmark 中保持一致"
      - "同一轨迹的多描述版本可由标注工具或数据格式承载；具体实现待确认"
    unresolved_questions:
      - "正式 benchmark 的数据集规模、采集人员数量和采集轮次是什么"
      - "训练集、验证集、真机测试集如何划分，是否按场景/采集批次隔离"
      - "成功率的统计分母、重复次数和失败重试规则是什么"
      - "‘倾倒干净’的可操作判定阈值是什么，是否需要称重或人工目测"
      - "测试时瓶子、花生、盆子和摆放位置是否固定，哪些变化用于泛化评估"
      - "子任务标注最终用于训练输入、评测诊断，还是两者都用"
      - "一条轨迹允许多少个语言描述版本，训练时如何避免样本权重失衡"
      - "分段变频采样如何在 LeRobot v3.0 中保存和复现"
    approval:
      status: pending
      evidence:
        - "2026-07-30 会议内容由用户转述"
    supersedes: []
    created_at: "2026-07-30T00:00:00+08:00"
    updated_at: "2026-07-30T00:00:00+08:00"
