  - id: BL-TOOL-004
    title: VLM 示范 episode 可由用户选择而不是固定前 5 条
    kind: rule
    domain: annotation-tool
    status: active
    priority: high
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-08-08 新数据集标定测试要求"
    description: "自动标注时，人工示范不能默认锁定为前 5 条；用户应能自主选择哪些 episode 作为示范数据集。"
    actors:
      - "本机标注用户"
    trigger: "用户启动 VLM 自动标注并选择自动标注范围时"
    preconditions:
      - "至少一条 episode 已被完整人工标注或可临时指定为示范"
      - "所选示范的固定 subtask 文本、数量和顺序一致"
    inputs:
      - "用户选择的示范 episode 列表"
      - "用户选择的自动标注 episode 列表"
    rule:
      statement: "VLM 自动标注必须使用用户显式选择的示范 episode，不能硬编码前 5 条；示范列表和自动标注列表可分别选择，也可存在重叠。"
    outputs:
      - "本次运行的 demo_episodes"
      - "自动标注请求使用用户选择的示范数据"
    side_effects:
      - "用户只需人工标注自己选择的少量 episode，即可作为后续自动标注示范"
      - "不同运行可以选择不同示范集，结果应记录 demo_episodes"
    exceptions:
      - "所选示范不完整或 subtask 不一致时，应阻止本次运行并提示用户修改"
      - "未选择任何示范时，保留现有非 fixed 路径或明确禁止固定模式"
    failure_handling:
      - "示范校验失败时停止自动标注，不静默回退到前 5 条"
    invariants:
      - "固定 subtask 文本、数量和顺序不得因示范选择改变"
      - "不修改原始视频和人工标注"
    acceptance:
      - id: BL-TOOL-004-A1
        given: "用户选择任意若干条已完整标注 episode 作为示范"
        when: "启动 VLM 自动标注"
        then: "系统仅使用用户选择的示范 episode，并拒绝把前 5 条硬编码为默认"
        method: "桌面/CLI 自动标注 smoke"
        evidence: null
        status: not-verified
    dependencies:
      - BL-TOOL-002
