version: "0.3"
source_of_truth: true
atoms:
  - id: BL-TOOL-001
    title: annotation_workbench 必须可独立安装和启动
    kind: integration
    domain: annotation-tool
    status: active
    priority: high
    risk: high
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-08-03 独立包需求澄清"
    description: "用户只保留 annotation_workbench 目录时，仍可完成本地标注全流程。"
    actors: ["本机标注用户"]
    trigger: "用户将 annotation_workbench 复制到新的 Linux/Ubuntu 环境"
    preconditions: ["Python 3.11+、Node.js 20 LTS 和外部 Ollama 可按安装说明获得"]
    inputs: ["annotation_workbench 目录", "本地 LeRobot v3.0 数据集"]
    rule:
      statement: "安装并启动独立包不得读取项目外部 visualize_dataset、lerobot_v1.0 或 serve_local_dataset.py。"
    outputs: ["可运行桌面中间件", "可访问的本地可视化标注界面"]
    side_effects: ["包内 .venv 和前端 node_modules 被创建"]
    exceptions: ["Ollama 或模型缺失时，GUI 与安装检查必须明确报告，不得伪装为可自动标注"]
    failure_handling: ["依赖或构建失败时停止并给出可定位的命令输出和下一步"]
    invariants: ["外部旧代码只作为备份，不作为运行时输入"]
    acceptance:
      - id: BL-TOOL-001-A1
        given: "annotation_workbench 被复制到不含外部旧目录的位置"
        when: "用户执行安装和启动流程"
        then: "桌面应用和可视化标注 GUI 可启动"
        method: "隔离目录端到端 smoke"
        evidence: null
        status: not-verified
    dependencies: ["BL-DATA-001"]
    baseline_refs: ["REQ-002"]
    decision_refs: ["DEC-007"]
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: null
    created_at: "2026-08-03T00:00:00+08:00"
    updated_at: "2026-08-03T00:00:00+08:00"
    last_verified_at: null

  - id: BL-TOOL-002
    title: 独立包保留当前人工和 VLM 标注闭环
    kind: flow
    domain: annotation-tool
    status: active
    priority: high
    risk: high
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-08-03 独立包需求澄清"
    description: "拆分迁移不能改变当前桌面选择数据集、GUI 人工标注、VLM 对齐和 GUI 复核流程。"
    actors: ["本机标注用户"]
    trigger: "用户启动独立包并选择一个 LeRobot v3.0 数据集"
    preconditions: ["数据集有效", "Ollama 服务和配置模型可访问"]
    inputs: ["数据集目录", "至少一条完整人工示范", "固定 subtask 模板"]
    rule:
      statement: "工具启动包内服务打开 GUI，VLM 仅补齐非示范 episode 的固定子任务时间范围，并写回同一数据集供 GUI 复核。"
    outputs: ["meta/lerobot_annotations.json 中的人工与自动标注", "可继续编辑的 GUI 结果"]
    side_effects: ["已完成 episode 可被断点恢复逻辑跳过"]
    exceptions: ["示范不完整、Ollama 不可用、视频不可解码或单 episode 生成失败时必须报告"]
    failure_handling: ["保留已完成 episode 和失败信息，允许用户修复后再次运行"]
    invariants: ["不修改原始视频", "不改变固定 subtask 的文本、数量和顺序"]
    acceptance:
      - id: BL-TOOL-002-A1
        given: "一条人工完整示范和待处理 v3.0 数据集"
        when: "用户运行 VLM 自动标注"
        then: "结果写入当前数据集并可由包内 GUI 读取和保存"
        method: "隔离数据集端到端验证"
        evidence: null
        status: not-verified
    dependencies: ["BL-TOOL-001", "BL-DATA-003"]
    baseline_refs: ["REQ-002"]
    decision_refs: ["DEC-007"]
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: null
    created_at: "2026-08-03T00:00:00+08:00"
    updated_at: "2026-08-03T00:00:00+08:00"
    last_verified_at: null

  - id: BL-TOOL-003
    title: 安装脚本明确管理依赖和外部模型边界
    kind: rule
    domain: annotation-tool
    status: active
    priority: high
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-08-03 独立包需求澄清"
    description: "用户通过脚本得到可运行的本地环境，但系统级安装和大模型下载保持可控。"
    actors: ["本机标注用户"]
    trigger: "用户执行 ./install.sh"
    preconditions: ["Linux/Ubuntu"]
    inputs: ["系统 Python/Node 状态", "用户 sudo 确认", "Ollama 环境变量"]
    rule:
      statement: "脚本创建 .venv、安装 Python 和 npm 依赖并构建前端；缺失 Python 或 Node 时先征得确认才执行 sudo apt；只检查 Ollama 与模型，不自动下载模型。"
    outputs: ["可运行的 .venv", "已构建的前端", "环境检查结果"]
    side_effects: ["可在用户确认后安装系统包"]
    exceptions: ["系统包安装被拒绝、Ollama 不可用或模型不存在时，脚本给出说明并以非零状态退出"]
    failure_handling: ["不得静默降级、不得把模型下载作为隐含副作用"]
    invariants: ["node_modules 和 .venv 不进入源码版本控制"]
    acceptance:
      - id: BL-TOOL-003-A1
        given: "干净 Linux/Ubuntu 环境且用户已准备 Ollama"
        when: "执行 ./install.sh"
        then: "脚本完成依赖准备或在缺失前置条件处明确停止"
        method: "安装脚本 smoke"
        evidence: null
        status: not-verified
    dependencies: ["BL-TOOL-001"]
    baseline_refs: ["REQ-002"]
    decision_refs: ["DEC-007"]
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: null
    created_at: "2026-08-03T00:00:00+08:00"
    updated_at: "2026-08-03T00:00:00+08:00"
    last_verified_at: null
  - id: BL-BENCH-001
    title: 统一 benchmark 任务为矿泉水瓶花生倾倒
    kind: flow
    domain: benchmark
    status: active
    priority: high
    risk: high
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-07-30 会议纪要（用户转述）"
    description: "组内后续模型训练和效果比较使用统一的真实机器人任务与数据集。"
    actors:
      - 组内数据采集人员
      - 模型训练人员
      - 真机评测人员
    trigger: "开始建立或比较一个新的策略模型时"
    preconditions:
      - "已准备矿泉水瓶、花生、剪刀和接收容器"
      - "机器人和遥操作采集链路可用"
    inputs:
      - "矿泉水瓶花生倾倒任务示教轨迹"
      - "任务语义描述和子任务标注"
    rule:
      statement: "目标任务是：机器人握住经过处理的矿泉水瓶，将瓶内花生完整倾倒到指定容器中；后续模型训练和比较原则上以该任务及其统一数据集为 benchmark。"
    outputs:
      - "统一 benchmark 数据集"
      - "可在同一任务上比较的训练模型和真机结果"
    side_effects:
      - "后续实验结果具有跨模型可比性"
      - "实验表中的模型迭代需要关联该 benchmark"
    exceptions:
      - "其他任务可用于预训练、方法验证或补充实验，但不能替代该 benchmark 的主结论"
    failure_handling:
      - "若任务定义、数据集或评测条件改变，应建立新版本或明确记录不可直接横向比较"
    invariants:
      - "比较模型时任务目标和主要评测流程保持一致"
      - "真机成功率是 benchmark 主结果"
    acceptance:
      - id: BL-BENCH-001-A1
        given: "两个候选模型使用同一 benchmark 任务和同一评测协议"
        when: "比较模型效果"
        then: "结果可以按统一成功率进行横向比较"
        method: "后续 benchmark 评测记录"
        evidence: null
        status: not-verified
    dependencies: []
    baseline_refs:
      - REQ-001
    decision_refs: []
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: "瓶口由剪刀扩大，瓶内装花生；接收容器当前会议示例为不锈钢圆形盆，具体固定配置仍需确认。"
    created_at: "2026-07-30T00:00:00+08:00"
    updated_at: "2026-07-30T00:00:00+08:00"
    last_verified_at: null

  - id: BL-BENCH-002
    title: benchmark 采用真机部署评测
    kind: rule
    domain: benchmark
    status: active
    priority: high
    risk: high
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-07-30 会议纪要（用户转述）"
    description: "模型效果不以 open-loop 误差作为最终 benchmark 结论，而以真实机器人执行结果为主。"
    actors:
      - 真机评测人员
    trigger: "完成一个 baseline 或模型迭代版本训练后"
    preconditions:
      - "模型能够部署到目标机器人"
      - "评测任务和操作环境已准备"
    inputs:
      - "待评测模型 checkpoint"
      - "统一 benchmark 任务"
    rule:
      statement: "评测必须进行真机部署和实际执行；当前主评价指标简化为成功率。"
    outputs:
      - "每次评测的成功/失败结果"
      - "模型版本对应的成功率"
    side_effects:
      - "训练指标和 open-loop 指标只能作为诊断信息，不能替代真机成功率"
    exceptions:
      - "仿真、open-loop 或离线指标可用于开发筛选，但不构成最终 benchmark 结论"
    failure_handling:
      - "真机失败时记录失败现象和阶段，进入问题导向迭代，不直接归因于单一模型组件"
    invariants:
      - "不同模型的真机评测条件应尽量一致"
      - "成功判定标准在同一轮比较中保持一致"
    acceptance:
      - id: BL-BENCH-002-A1
        given: "模型已完成训练并具备部署 checkpoint"
        when: "执行 benchmark 真机评测"
        then: "产生按统一规则判定的成功率，而不是只报告离线损失"
        method: "真机 rollout 记录"
        evidence: null
        status: not-verified
    dependencies:
      - BL-BENCH-001
    baseline_refs:
      - REQ-001
    decision_refs: []
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: "成功的直观目标是完整握住瓶子并把花生倾倒干净；抓取失败、倾倒不完整等边界判定仍需固化。"
    created_at: "2026-07-30T00:00:00+08:00"
    updated_at: "2026-07-30T00:00:00+08:00"
    last_verified_at: null

  - id: BL-DATA-001
    title: 数据集先转换为 LeRobot v3.0 再使用官方工具标注
    kind: data-contract
    domain: dataset
    status: active
    priority: high
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-07-30 会议纪要（用户转述）"
    description: "自采数据以 LeRobot 原生格式进入后续标注和训练流程。"
    actors:
      - 数据工程人员
      - 标注人员
    trigger: "完成一批遥操作数据采集后"
    preconditions:
      - "原始采集数据可读取"
      - "已确定 state/action、相机和任务字段映射"
    inputs:
      - "组内遥操作原始数据"
    rule:
      statement: "原始数据先转换为 LeRobot v3.0 数据集，再使用 LeRobot 官方数据标注平台完成语义和子任务标注。"
    outputs:
      - "LeRobot v3.0 数据集"
      - "可被训练和标注工具读取的轨迹与元数据"
    side_effects:
      - "转换脚本和字段映射必须可复现"
    exceptions:
      - "转换失败或字段不完整时，不得直接进入正式训练"
    failure_handling:
      - "保留原始数据不变，修复转换映射后重新生成 v3.0 数据集"
    invariants:
      - "原始采集数据不被转换过程覆盖"
      - "v3.0 数据集中的动作、状态、视频和 episode 边界一致"
    acceptance:
      - id: BL-DATA-001-A1
        given: "一批原始遥操作轨迹已采集"
        when: "执行数据转换和官方工具读取"
        then: "LeRobot v3.0 数据集可被读取、浏览和标注"
        method: "转换 smoke test + 官方工具读取验证"
        evidence: null
        status: not-verified
    dependencies: []
    baseline_refs:
      - REQ-001
    decision_refs: []
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: null
    created_at: "2026-07-30T00:00:00+08:00"
    updated_at: "2026-07-30T00:00:00+08:00"
    last_verified_at: null

  - id: BL-DATA-002
    title: 语义标注应包含丰富对象和空间特征
    kind: rule
    domain: annotation
    status: active
    priority: high
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-07-30 会议纪要（用户转述）"
    description: "语言描述不仅写动作，还应尽可能描述对象属性、相对位置、目标容器和任务结果。"
    actors:
      - 标注人员
    trigger: "为一条轨迹编写语义描述时"
    preconditions:
      - "轨迹中的对象、位置和目标可从视频或现场记录确认"
    inputs:
      - "轨迹视频和机器人状态"
      - "任务对象及环境信息"
    rule:
      statement: "语义标注应在可观测且真实的范围内包含对象类别、材质、相对空间位置、目标容器和动作目标等特征，例如右前方的塑料矿泉水瓶和左手边的不锈钢圆形盆。"
    outputs:
      - "丰富且与轨迹一致的语言描述"
    side_effects:
      - "为语言条件策略提供更多可学习特征"
      - "为后续泛化实验保留语义变量"
    exceptions:
      - "不可从数据确认的属性不得臆造"
    failure_handling:
      - "描述与轨迹不一致时退回重标，不通过增加无事实依据的词汇修补"
    invariants:
      - "语言描述必须与轨迹实际发生的动作和场景一致"
    acceptance:
      - id: BL-DATA-002-A1
        given: "轨迹包含可识别的瓶子、花生、接收容器和相对位置"
        when: "完成语义标注"
        then: "描述包含已确认的关键对象、空间关系和任务目标"
        method: "标注抽检"
        evidence: null
        status: not-verified
    dependencies:
      - BL-BENCH-001
      - BL-DATA-001
    baseline_refs:
      - REQ-001
    decision_refs: []
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: "丰富描述是当前策略，不等于允许随意引入轨迹中不存在的属性。"
    created_at: "2026-07-30T00:00:00+08:00"
    updated_at: "2026-07-30T00:00:00+08:00"
    last_verified_at: null

  - id: BL-DATA-003
    title: 轨迹应支持子任务标注
    kind: data-contract
    domain: annotation
    status: active
    priority: high
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-07-30 会议纪要（用户转述）"
    description: "一条完整倾倒轨迹应能够拆分为具有明确目标的阶段或子任务。"
    actors:
      - 标注人员
      - 模型训练人员
    trigger: "对完整任务轨迹进行标注时"
    preconditions:
      - "轨迹包含可识别的阶段边界"
    inputs:
      - "完整倾倒任务轨迹"
    rule:
      statement: "至少按拿起瓶子、移动到接收容器上方、倾倒花生三个语义阶段组织子任务标注；实际边界和是否增加阶段需结合数据确认。"
    outputs:
      - "完整任务级描述"
      - "有顺序的子任务描述和对应时间区间"
    side_effects:
      - "支持阶段级失败分析和问题定位"
      - "为多任务或分层策略训练留下数据接口"
    exceptions:
      - "无法可靠判断阶段边界时应标记待复核，不强行切分"
    failure_handling:
      - "子任务边界争议进入标注复核，不直接用于比较实验"
    invariants:
      - "子任务顺序与真实执行顺序一致"
      - "子任务合起来覆盖完整任务，不改变原轨迹动作"
    acceptance:
      - id: BL-DATA-003-A1
        given: "完整倾倒轨迹已转换为 v3.0"
        when: "完成子任务标注"
        then: "至少能定位抓取、移动和倾倒三个阶段"
        method: "官方标注工具检查"
        evidence: null
        status: not-verified
    dependencies:
      - BL-DATA-001
    baseline_refs:
      - REQ-001
    decision_refs: []
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: null
    created_at: "2026-07-30T00:00:00+08:00"
    updated_at: "2026-07-30T00:00:00+08:00"
    last_verified_at: null

  - id: BL-DATA-004
    title: 同一轨迹允许多个语义描述版本
    kind: rule
    domain: annotation
    status: experimental
    priority: medium
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-07-30 会议纪要（用户转述）"
    description: "同一个真实执行轨迹可以配备多种等价但措辞不同的语言描述，用于增强语言表达覆盖。"
    actors:
      - 标注人员
      - 模型训练人员
    trigger: "准备语言条件训练样本时"
    preconditions:
      - "不同描述均指向同一条真实轨迹"
    inputs:
      - "同一条任务轨迹"
      - "多个语义描述版本"
    rule:
      statement: "可以为同一轨迹准备不同语言描述版本；每个版本必须保持任务语义和轨迹事实一致。"
    outputs:
      - "一对多的轨迹-语言描述样本"
    side_effects:
      - "增加语言表达多样性"
      - "可能改变样本权重和数据分布，需要在实验记录中注明"
    exceptions:
      - "不得使用改变目标、对象或动作顺序的描述作为同一轨迹的等价版本"
    failure_handling:
      - "出现语义不一致时删除或单独标记该描述版本"
    invariants:
      - "多版本描述共享同一真实轨迹，不复制或篡改动作数据"
    acceptance:
      - id: BL-DATA-004-A1
        given: "同一轨迹存在多个候选描述"
        when: "进入训练集"
        then: "描述版本均通过语义一致性检查并记录版本关系"
        method: "标注审查"
        evidence: null
        status: not-verified
    dependencies:
      - BL-DATA-002
    baseline_refs:
      - REQ-001
    decision_refs: []
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: "当前作为数据增强方向记录，是否默认启用以及每条轨迹的描述数量待实验决定。"
    created_at: "2026-07-30T00:00:00+08:00"
    updated_at: "2026-07-30T00:00:00+08:00"
    last_verified_at: null

  - id: BL-ITER-001
    title: 模型优化采用真机问题导向迭代
    kind: flow
    domain: iteration
    status: active
    priority: high
    risk: high
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-07-30 会议纪要（用户转述）"
    description: "后续优化不预先堆叠大量变量，而是先部署 baseline，通过真机失败现象决定下一步改进。"
    actors:
      - 模型训练人员
