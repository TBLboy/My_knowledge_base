  kind: task
  parent_id: null
  phase: business-intent
  goal: 确认项目日志、Loop Core、Skill 角色渲染、框架包校验、安装状态与测试是否可正常运行。
  status: done
  priority: medium
  risk: low
  authority: A
  owner: agent
  tags:
  - framework-health-check
  related_business_logic: []
  acceptance_refs:
  - EV-001
  - EV-002
  - EV-003
  - EV-004
  related_decisions: []
  depends_on: []
  blocked_by: []
  blocked_by_questions: []
  required_skills:
  - a-loop-control
  - a-project-log
  spec_ref: null
  inputs:
  - 项目 AGENTS.md
  - Vibe Workflow runtime
  - vibe-coding 框架源代码
  outputs:
  - 框架健康检查结论
  - 验证证据与工作留痕
  plan:
  - 初始化并恢复项目日志
  - 运行 Loop Core 与 Project Log 校验
  - 校验框架包、安装状态、角色渲染和测试
  - 记录限制与结论
  done_when:
  - 项目 Project Log 校验通过
  - Loop Core restore/status/validate 可运行
  - 框架包校验和隔离测试通过，或明确记录环境限制
  - 安装状态验证通过
  verification:
    status: passed
    commands:
    - python3 ~/.codex/vibe-workflow/scripts/loopctl.py --root <project> --json restore
    - python3 ~/.codex/vibe-workflow/scripts/validate_project.py --root <project>
    - uv run --no-project --python 3.12 --with PyYAML --with jsonschema python runtime/scripts/validate_package.py --root
      <vibe-coding>
    - PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 uv run --python 3.12 --with pytest --with PyYAML --with jsonschema python -m pytest
      -q tests
    - python3.12 scripts/global_installer.py verify --codex-home ~/.codex --without-mcp
    evidence:
    - EV-001
    - EV-002
    - EV-003
    - EV-004
    limitations:
    - 默认 /usr/bin/python3 为 Python 3.10.12，低于框架要求的 Python 3.11+；使用 Python 3.12.13 隔离环境完成需要 3.11+ 的验证。
  result:
    summary: 框架核心功能正常；项目日志此前缺失，已按运行时模板初始化。默认 Python 3.10 不能直接运行安装器，但不是框架代码失败。
    changed_files:
    - .project-log/
    deviations:
    - 未修改框架源代码；仅生成本项目缺失的 .project-log/。
    follow_ups:
    - 如需直接运行安装/升级命令，将 shell 默认 Python 切换到 3.11+，推荐 3.12。
