version: "0.2"
decisions:
  - id: DEC-001
    title: "采用场景主线和契约驱动的 VLA 阅读方法"
    category: "process"
    status: "active"
    authority: "B"
    user_approval: "approved"
    related_tasks:
      - "TUTOR-VLA-READ-001"
    related_business_logic: []
    context: "用户需要快速掌握 dexbot_vla 的整体部署流程，并判断接入新训练模型时的最小改动范围；逐函数阅读已经陷入局部细节。"
    hypothesis: "以一个已运行的模型为黄金样例，沿启动、Action、RuntimeBundle、模型服务、动作后处理和机器人驱动的真实数据流阅读，比按文件或按函数自底向上阅读更快建立可扩展的工程模型。"
    options:
      - name: "逐文件逐函数阅读"
        benefits:
          - "局部实现理解较细"
        costs:
          - "耗时长"
          - "难以形成端到端上下文"
        risks:
          - "容易陷入辅助函数，无法判断新增模型需要改哪里"
      - name: "场景主线 + 配置链 + 数据契约阅读"
        benefits:
          - "直接覆盖一次推理的完整路径"
          - "能快速定位模型接入边界"
          - "便于用现有模型做对照"
        costs:
          - "初期不覆盖所有异常分支和内部状态机"
        risks:
          - "后续排查具体问题时仍需回读局部实现"
    decision: "采用场景主线、配置链和数据契约驱动的分层阅读方法；暂不逐行深读非主线模块。"
    reason_summary:
      - "用户当前目标是整体流程和新模型接入范围，而不是完整掌握每个函数。"
      - "dexbot_vla 的模型选择和运行时装配主要由 model_id、template、service、contract 和 artifact 连接。"
      - "真实模型数据流能够暴露 observation/action/robot 之间的关键兼容边界。"
    conditions:
      - "以 pickplace_bottle_lerobot_ACT_0715_10hz 作为当前黄金样例。"
      - "遇到具体故障时，再按故障点回读 RolloutCoordinator、adapter 或 backend 的局部实现。"
    action: "先阅读启动文件和默认模型配置，产出运行流程图、配置解析图、数据流图和 GR00T 接入差异表。"
    expected_result: "能够说明一次 VLA 推理的入口、模块职责、数据流和新模型的最小改动范围。"
    reversal_plan: "如果主线阅读无法解释具体行为，再回到对应模块做问题驱动的局部源码阅读。"
    observation: "已完成阅读路线调整，并确认下一步追踪默认 ACT 模型的配置链。"
    actual_result: "用户认可该分析并要求记录到工程日志。"
    outcome_status: "successful"
    lesson: "陌生部署工程的首次阅读应优先建立可运行主线和接口契约，不应把逐函数理解作为前置条件。"
    evidence: []
    created_at: "2026-08-11"
    updated_at: "2026-08-11"
  - id: DEC-002
    title: "以服务端专用 GR00T backend 接入自训练模型"
    category: "architecture"
    status: "active"
    authority: "B"
    user_approval: "analysis-recorded"
    related_tasks:
      - "TUTOR-VLA-READ-001"
    related_business_logic: []
    context: "自训练 GR00T N1.7 checkpoint 采用 13D、40-step relative action。DexBot 当前 lerobot backend 面向 LinkerPolicyBackend 的命名输出，无法加载或解释该 checkpoint。"
    hypothesis: "将 GR00T processor、整段 relative-to-absolute action 解码和模型输入映射收敛在模型服务端 backend，可复用已有 WorkerClient/WebSocket/runtime/action scheduling/safety/robot execution 链。"
    options:
      - name: "在 ROS runtime 增加 GR00T 特例"
        benefits:
          - "可直接接触 observation 和 scheduling 状态"
        costs:
          - "relative-action 模型语义泄露到通用执行层"
          - "破坏现有模型服务进程边界"
        risks:
          - "scheduler 可能接收到依赖当前 state 的 native relative actions"
      - name: "复用现有 Linker lerobot backend"
        benefits:
          - "表面改动较少"
        costs:
          - "训练分支缺少 LinkerPolicyBackend"
          - "输出协议不兼容"
        risks:
          - "无法正确加载或解释 GR00T action tensor"
      - name: "新增服务端 groot backend"
        benefits:
          - "保持 runtime 与 WebSocket 协议通用"
          - "在同次调用内保证 relative-action 解码所需的 state 连续性"
          - "可通过 artifact 明确向外暴露 absolute 13D 语义"
        costs:
          - "需要新增 backend、注册、artifact/config 和针对性测试"
        risks:
          - "需固定双相机 processor 对缺失 cam_left_wrist 的兼容行为"
    decision: "后续实施时新增模型服务端 `groot` backend；其负责 GR00T 加载、preprocessor、predict_action_chunk、postprocessor 全 chunk 解码，并向 DexBot runtime 返回 absolute 13D action chunk。"
    reason_summary:
      - "GR00T 的 select_action 不支持 use_relative_actions=true，且 postprocessor 依赖同轮 preprocessor 缓存的 raw state。"
      - "实际 checkpoint 离线 probe 已验证此完整链可输出有限的 40 x 13 absolute chunk。"
      - "ROKAE 与 Luoshi 经用户确认是同一台实体设备，设备身份不构成架构分支。"
    conditions:
      - "外部 artifact/deployment contract 声明 action_semantics=absolute、raw_action_horizon=40、supports_rtc=false。"
      - "首版使用 30 Hz、non-RTC、latest_smooth 的 shadow template。"
      - "在确认关节零位、坐标约定与初始姿态一致性前，不批准真机命令。"
    action: "实现 backend 后补充 checkpoint artifact、deployment contract、两相机 I/O contract、policy template/model registration 及 backend/artifact/model-service tests。"
    expected_result: "GR00T 模型能够被现有模型服务加载，并以 canonical absolute 13D chunk 进入无特例的 DexBot runtime。"
    reversal_plan: "若 processor 版本无法稳定支持 checkpoint 的双相机输入，先将该兼容问题隔离在 backend/test 层，暂停模型注册，不修改 ROS runtime 作为绕过。"
    observation: "实际训练样本双相机 probe 成功；checkpoint config 与 processor sidecar 对 cam_left_wrist 的声明不一致，当前仅产生 warning，仍需测试固定行为。"
    actual_result: "已实现并注册独立 GrootBackend。实际 checkpoint 通过 backend 和 localhost WebSocket 服务返回有限 absolute [40,13] chunk；native [1,40,13] relative chunk 未泄露至通用 runtime。模型 profile 保持 shadow_only=true，未启动 ROS、未读取真实设备观测、未下发机器人命令。"
    outcome_status: "successful-offline"
    lesson: "模型内部动作语义与运行时外部动作契约应分层声明，避免模型特性污染通用执行框架。"
    evidence:
      - "/mnt/data/gr00t-finetune/outputs/lerobot_qingdao_pouring_gr00t_n1_7_v2_2cam/checkpoints/014051/pretrained_model/config.json"
      - "/home/tbl/Project/force_touch_model/lerobot_v1.0/src/lerobot/policies/groot/modeling_groot.py"
      - "/home/tbl/Project/force_touch_model/lerobot_v1.0/src/lerobot/policies/groot/processor_groot.py"
    created_at: "2026-08-11"
    updated_at: "2026-08-11"
