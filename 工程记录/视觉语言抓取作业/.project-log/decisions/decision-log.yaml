- id: DEC-008
  title: "采纳 LSAR（Language-conditioned Spatial Affordance Refinement）作为 Proposed Method"
  category: technical
  status: active
  authority: B
  user_approval: not-required
  related_tasks:
    - TASK-005
  related_business_logic: []
  context: "项目处于 solution-research → architecture-decision 阶段；需要在不改 grasp 表示、扩散过程、评估协议的前提下提出一个可解释、可插拔的改进。"
  hypothesis: "现有 vision-language fusion 主要给出 ‘Which region is related to description’，而 grasp 检测需要 ‘Which region gives best affordance’。引入 LSAR 对 A_vl 与可选 F_v 做空间细化，可以提升定位。"
  options:
    - name: "Option 1 轻量 CNN (Conv 3x3 + ReLU + Conv 3x3 + Sigmoid)"
      benefits:
        - "实现简单、计算量低、易于 ablation"
      costs:
        - "建模能力相对受限"
    - name: "Option 2 Spatial Attention (Q/K/V)"
      benefits:
        - "更强的空间建模"
      costs:
        - "结构稍复杂，需要对齐 Q/K/V 来源"
    - name: "Option 3 轻量 Transformer"
      benefits:
        - "表达力最强"
      costs:
        - "实现复杂度高、显存占用大"
  decision: "采纳 LSAR 作为 Proposed Method；实现优先级 Option 1 → Option 2 → Option 3，先跑 CNN baseline 再考虑升级。"
  reason_summary:
    - "方案明确限定‘只改 conditioning 分支’，与 baseline 区分清晰"
    - "CNN 实现成本最低，可在 batch smoke 数据上先验证"
    - "后续 ablation 可以在三选项间直接对比"
  conditions:
    - "若 batch smoke 数据集足够小可跑通 CNN baseline，再决定升级到 attention / transformer"
  action: "已存档 .project-log/docs/proposed-method-LSAR.md；新增 TASK-005 跟踪编码实现"
  expected_result: "得到一个可解释、与 LGD baseline 形成清晰对比的 LSAR 模块"
  reversal_plan: "若 CNN baseline 在小规模实验中无明显收益，可直接退化为 no-op（保持 baseline）"
  observation: "尚未启动编码"
  actual_result: null
  outcome_status: not-observed
  lesson: null
  evidence: []
  supersedes: []
  created_at: '2026-08-28T17:40:00+08:00'
  updated_at: null
- id: DEC-009
  title: 后续 Proposed Method 的 baseline 固定为 diffusion 版 LGDM
  category: technical
  status: active
  authority: B
  user_approval: not-required
  related_tasks:
    - TASK-006
  related_business_logic: []
  context: >-
    用户明确要求调用/验证当前 LGD 仓库里的 diffusion 版本，后续 LSAR 应基于
    diffusion baseline，而不是已经跑过的 lgrconvnet3 dense-map baseline。
  hypothesis: >-
    LGDM + 官方 diffusion pipeline 已在真实样本上 2/2 跑通；后续 Proposed Method
    只需在 LGDM conditioning 分支插入 LSAR，grasp 表示、扩散过程和评估协议保持不变。
  options:
    - name: 继续使用 lgrconvnet3 dense-map baseline
      benefits:
        - 已有 10/10 batch smoke 证据
      costs:
        - 不符合用户指定的 diffusion baseline 方向
        - LSAR 原方案描述的是 diffusion conditioning 分支
      risks:
        - 论文方法与用户目标脱节
    - name: 使用 diffusion 版 LGDM baseline
      benefits:
        - 与用户要求和 LSAR 方案一致
        - 后续可训练 diffusion objective 或保留官方 dense-map 更新
      costs:
        - 需要额外处理官方训练脚本中 diffusion loss 未 backward 的问题
      risks:
        - 训练显存/时间高于 lgrconvnet3
  decision: 采用 diffusion 版 LGDM 作为 Proposed Method 的 baseline。
  reason_summary:
    - LGDM 参数约 573.6M，但 batch=1 smoke 峰值 GPU 约 2.51 GiB
    - 官方 diffusion 链路已通过真实样本验证
    - 与 LSAR 的“只改 conditioning 分支”边界一致
  conditions:
    - 正式训练前需决定 diffusion objective 是否 backward，以及 dense-map loss
      是否保留
  action: >-
    新增 research/scripts/diffusion_smoke.py，记录 EV-20260902-diffusion-smoke；
    环境快照加入 transformers/timm/ruamel.yaml 等依赖。
  expected_result: 后续 Baseline vs Ours 实验以 LGDM 为 baseline。
  reversal_plan: 若扩散训练在有限 GPU 上不可行，再回退到 lgrconvnet3 并明确调整论文声明。
  observation: 2/2 真实 stem 跑通；官方训练代码只对 dense-map loss backward。
  actual_result: LGDM diffusion baseline smoke passed
  outcome_status: successful
  lesson: null
  evidence:
    - EV-20260902-diffusion-smoke
  supersedes: []
  created_at: '2026-09-02T06:12:00+08:00'
  updated_at: null
