version: "0.2"
baselines:
  - id: REQ-001
    revision: 1
    status: active
    goal: 为当前学习者制定可直接执行、可验证、可跨设备延续的机器人学习系统路线。
    actors:
      - 学习者
      - 学习陪练代理
    in_scope:
      - 数学与经典机器学习的必要补齐
      - PyTorch 深度学习训练闭环
      - 计算机视觉、Transformer 与大模型基础
      - 强化学习、模仿学习、机器人策略、VLA 与世界模型
      - 训练工程、推理优化、ROS2 与 Jetson 部署
      - 28 周总路线、首月逐日任务、资料索引和阶段验收
    out_of_scope:
      - 大型基础模型从零预训练
      - 全部半年日程一次性细化到每天且不再调整
      - 与机器人学习目标无关的模型和课程堆叠
    business_logic_refs: []
    constraints:
      - 每天约 1.5 小时
      - 主要目标为机器人学习或具身智能算法工程师
      - 数学基础尚可，需结合模型激活
      - Python 工程尚可，但训练闭环能力不足
      - Linux RTX 4090 24GB 与 Windows RTX 4060 8GB 双设备学习
    quality_attributes:
      - 可执行
      - 可验证
      - 工程导向
      - 知识依赖清晰
      - 跨设备可迁移
    assumptions:
      - 每周至少执行 6 个学习日
      - 后续逐月计划会根据验收结果滚动调整
    unresolved_questions: []
    approval:
      status: approved
      evidence:
        - 用户确认每天 1.5 小时、目标方向 1、数学水平 2、编程水平 1、持续带学交付方式 1。
        - 用户补充 Windows RTX 4060 8GB 笔记本作为第二学习设备。
    supersedes: []
    created_at: "2026-07-31"
    updated_at: "2026-07-31"
